<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Singularity: Tactical Overhaul</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; user-select: none; }
        #hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
        .row { display: flex; justify-content: space-between; width: 100%; }
        .hud-text { color: #00ffaa; text-shadow: 0 0 5px #00ffaa; font-size: 14px; }
        #bars-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 400px; text-align: center; }
        .bar-label { font-size: 10px; color: #fff; letter-spacing: 2px; margin-bottom: 2px; display: block; }
        .bar-track { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1); border: 1px solid #444; margin-bottom: 10px; position: relative; overflow: hidden; }
        #target-health-fill { width: 100%; height: 100%; background: #00ffaa; transition: width 0.1s; }
        #ship-health-fill { width: 100%; height: 100%; background: #ff3333; }
        #boost-fill { width: 100%; height: 100%; background: #ffaa00; }
        
        #power-container { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); width: 200px; height: 10px; background: #111; border: 1px solid #00ffaa; }
        #power-fill { height: 100%; background: #00ffaa; width: 0%; box-shadow: 0 0 15px #00ffaa; }

        #crosshair { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; transform: translate(-50%, -50%); pointer-events: none; z-index: 15; border: 1px solid #00ffaa; border-radius: 50%; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffaa; }
        #crosshair::before { top: 50%; left: -10px; width: 60px; height: 1px; }
        #crosshair::after { left: 50%; top: -10px; width: 1px; height: 60px; }

        #audio-gui { position: absolute; left: 0; top: 0; width: 280px; height: 100vh; background: rgba(15, 15, 15, 0.95); border-right: 1px solid #444; color: #eee; font-size: 11px; overflow-y: auto; z-index: 500; display: none; }
        .audio-folder { border-bottom: 1px solid #333; }
        .audio-folder-title { background: #000; padding: 8px; cursor: pointer; font-weight: bold; color: #00ffaa; display: flex; justify-content: space-between; border-left: 3px solid #00ffaa; }
        .audio-content { padding: 5px 0; display: none; }
        .audio-content.open { display: block; }
        .audio-row { padding: 4px 15px; display: flex; align-items: center; justify-content: space-between; }
        canvas#waveform { width: 100%; height: 100px; background: #000; border-bottom: 1px solid #444; }
        
        #start-screen { position: absolute; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: center; align-items: center; justify-content: center; flex-direction: column; }
        button { background: transparent; border: 2px solid #00ffaa; color: #00ffaa; padding: 20px 50px; cursor: pointer; font-family: inherit; font-size: 20px; }
    </style>
</head>
<body>

<div id="crosshair"></div>
<div id="start-screen"><button id="start-btn">INITIALIZE COMBAT SYSTEMS</button></div>

<div id="audio-gui">
    <div style="padding: 10px; font-weight: bold; color: #00ffaa;">TONE ANALYZER</div>
    <canvas id="waveform"></canvas>
    <div id="audio-controls-root"></div>
</div>

<div id="hud">
    <div class="row">
        <div class="hud-text">STATUS: ACTIVE</div>
        <div class="hud-text">SCORE: <span id="score">0</span></div>
    </div>
    <div id="bars-container">
        <span class="bar-label">TARGET INTEGRITY</span>
        <div class="bar-track"><div id="target-health-fill"></div></div>
        <span class="bar-label">HULL INTEGRITY</span>
        <div class="bar-track"><div id="ship-health-fill"></div></div>
        <span class="bar-label">CAPACITOR</span>
        <div class="bar-track"><div id="boost-fill"></div></div>
    </div>
    <div id="power-container"><div id="power-fill"></div></div>
</div>

<script type="importmap">
    { "imports": { 
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "dat.gui": "https://unpkg.com/dat.gui@0.7.9/build/dat.gui.module.js"
    } }
</script>

<script type="module">
    import * as THREE from 'three';
    import * as Tone from 'https://esm.sh/tone';
    import { GUI } from 'dat.gui';

    const params = {
        thrustRF: 0.03, thrustAD: 0.02, thrustWS: 0.02, rotationQE: 0.04,
        friction: 0.97, boostRegen: 0.2, shotFadeDist: 800, shotShrinkSpeed: 0.01,
        starCount: 6000, starOpacity: 0.8, dodecaColor: '#00ffaa', dodecaOpacity: 1.0,
        hudOpacity: 0.9, crosshairSize: 40
    };

    let score = 0, isActive = false, isCharging = false, chargeLevel = 0, boostTank = 100, shipHealth = 100;
    let velocity = new THREE.Vector3(), targetHealth = 100;
    const projectiles = [], particles = [], keys = {};

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- AUDIO ---
    const analyser = new Tone.Analyser("waveform", 256);
    const masterBus = new Tone.Gain(0.6).connect(analyser).toDestination();

    const setupSound = (type) => {
        const vol = new Tone.Volume(-10).connect(masterBus);
        const env = new Tone.AmplitudeEnvelope({ attack: 0.01, decay: 0.1, sustain: 0.5, release: 0.1 }).connect(vol);
        let src;
        if(type === 'noise') { src = new Tone.Noise("pink").connect(env).start(); }
        else { src = new Tone.PolySynth(Tone.Synth).connect(vol); }
        return { src, env, vol };
    };

    const s_engine = setupSound('noise');
    const s_shot = setupSound('synth');
    const s_impact = setupSound('synth');
    const s_hit_target = new Tone.MembraneSynth().connect(masterBus);

    // --- WORLD ---
    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for(let i=0; i<params.starCount; i++) starPos.push((Math.random()-0.5)*4000, (Math.random()-0.5)*4000, (Math.random()-0.5)*4000);
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff, size:1, transparent:true, opacity:0.8}));
    scene.add(stars);

    let target;
    function spawnTarget() {
        if(target) scene.remove(target);
        target = new THREE.Mesh(new THREE.DodecahedronGeometry(25), new THREE.MeshPhongMaterial({color:params.dodecaColor, flatShading:true, transparent:true}));
        target.position.set((Math.random()-0.5)*500, (Math.random()-0.5)*500, (Math.random()-0.5)*500);
        scene.add(target);
        targetHealth = 100;
    }
    spawnTarget();

    const ship = new THREE.Group();
    scene.add(ship);
    ship.position.z = 300;
    scene.add(new THREE.AmbientLight(0x404040, 3));
    const sun = new THREE.DirectionalLight(0xffffff, 2);
    sun.position.set(5, 5, 5);
    scene.add(sun);

    // --- LOGIC ---
    function spawnParticles(pos, color) {
        for(let i=0; i<15; i++) {
            const p = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshBasicMaterial({color: color}));
            p.position.copy(pos);
            const vel = new THREE.Vector3((Math.random()-0.5)*2, (Math.random()-0.5)*2, (Math.random()-0.5)*2);
            particles.push({mesh:p, vel:vel, life:1.0});
            scene.add(p);
        }
    }

    function fire() {
        const shotPos = new THREE.Vector3();
        ship.getWorldPosition(shotPos); // Fix: Get current absolute position
        
        const shot = new THREE.Mesh(new THREE.SphereGeometry(1.5 + (chargeLevel*2)), new THREE.MeshBasicMaterial({color:0x00ffaa}));
        shot.position.copy(shotPos);
        const dir = new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion);
        projectiles.push({mesh:shot, vel:dir.multiplyScalar(3.5), spawn:shotPos.clone(), damage: 10 + (chargeLevel*40)});
        scene.add(shot);
        
        s_shot.src.triggerAttackRelease(100 + (chargeLevel*500), "8n");
        chargeLevel = 0;
    }

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function updatePhysics() {
        const gp = navigator.getGamepads()[0];
        const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion);
        const right = new THREE.Vector3(1,0,0).applyQuaternion(ship.quaternion);
        const up = new THREE.Vector3(0,1,0).applyQuaternion(ship.quaternion);

        let boostMult = 1.0;
        const boosting = keys['ShiftLeft'] || (gp && gp.axes[3] < -0.5);
        if(boosting && boostTank > 0) { boostMult = 3.0; boostTank -= 0.8; }
        else { boostTank = Math.min(100, boostTank + params.boostRegen); }

        let thrusting = false;
        if(keys['KeyR'] || (gp && gp.buttons[3].pressed)) { velocity.add(fwd.multiplyScalar(params.thrustRF * boostMult)); thrusting = true; }
        if(keys['KeyF'] || (gp && gp.buttons[0].pressed)) { velocity.add(fwd.multiplyScalar(-params.thrustRF)); thrusting = true; }
        if(keys['KeyA']) velocity.add(right.multiplyScalar(-params.thrustAD));
        if(keys['KeyD']) velocity.add(right.multiplyScalar(params.thrustAD));
        if(keys['KeyW']) velocity.add(up.multiplyScalar(params.thrustWS));
        if(keys['KeyS']) velocity.add(up.multiplyScalar(-params.thrustWS));
        
        if(keys['KeyQ']) ship.rotation.y += params.rotationQE;
        if(keys['KeyE']) ship.rotation.y -= params.rotationQE;

        if(thrusting) s_engine.env.triggerAttack(); else s_engine.env.triggerRelease();

        ship.position.add(velocity);
        velocity.multiplyScalar(params.friction);
        
        if(ship.position.distanceTo(target.position) < 30) {
            shipHealth -= 5;
            velocity.multiplyScalar(-0.5);
            s_hit_target.triggerAttackRelease("C1", "4n");
        }

        camera.position.copy(ship.position);
        camera.quaternion.copy(ship.quaternion);
    }

    function update() {
        requestAnimationFrame(update);
        if(!isActive) return;
        updatePhysics();

        if(keys['Space'] || (navigator.getGamepads()[0]?.buttons[6].pressed)) {
            isCharging = true;
            chargeLevel = Math.min(chargeLevel + 0.015, 1.0);
        } else if(isCharging) {
            fire();
            isCharging = false;
        }

        // Projectile handling
        for(let i=projectiles.length-1; i>=0; i--) {
            const p = projectiles[i];
            p.mesh.position.add(p.vel);
            if(p.mesh.position.distanceTo(target.position) < 25) {
                targetHealth -= p.damage;
                score += 10;
                spawnParticles(p.mesh.position, 0x00ffaa);
                s_hit_target.triggerAttackRelease("G2", "16n");
                scene.remove(p.mesh); projectiles.splice(i,1);
                if(targetHealth <= 0) {
                    spawnParticles(target.position, 0xffaa00);
                    spawnTarget();
                    score += 500;
                }
            } else if(p.mesh.position.distanceTo(p.spawn) > params.shotFadeDist) {
                scene.remove(p.mesh); projectiles.splice(i,1);
            }
        }

        // Particle handling
        for(let i=particles.length-1; i>=0; i--) {
            const p = particles[i];
            p.mesh.position.add(p.vel);
            p.life -= 0.02;
            p.mesh.material.opacity = p.life;
            if(p.life <= 0) { scene.remove(p.mesh); particles.splice(i,1); }
        }

        document.getElementById('power-fill').style.width = (chargeLevel * 100) + '%';
        document.getElementById('target-health-fill').style.width = targetHealth + '%';
        document.getElementById('ship-health-fill').style.width = shipHealth + '%';
        document.getElementById('boost-fill').style.width = boostTank + '%';
        document.getElementById('score').innerText = score;

        const canvas = document.getElementById('waveform');
        const ctx = canvas.getContext('2d');
        const values = analyser.getValue();
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.beginPath(); ctx.strokeStyle = '#00ffaa';
        for(let i=0; i<values.length; i++){
            const x = (i/values.length)*canvas.width;
            const y = (values[i]+1)/2*canvas.height;
            if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();

        renderer.render(scene, camera);
    }

    const gui = new GUI();
    const f1 = gui.addFolder('Combat & Flight');
    f1.add(params, 'thrustRF', 0.01, 0.1);
    f1.add(params, 'boostRegen', 0.01, 1.0);
    f1.add(params, 'shotFadeDist', 100, 2000);
    
    function buildAudioUI() {
        const root = document.getElementById('audio-controls-root');
        const sounds = [{n:'Thrusters', s:s_engine}, {n:'Weaponry', s:s_shot}];
        sounds.forEach(item => {
            const folder = document.createElement('div');
            folder.className = 'audio-folder';
            folder.innerHTML = `<div class="audio-folder-title">${item.n}<span>▼</span></div>`;
            const content = document.createElement('div');
            content.className = 'audio-content';
            const add = (label, min, max, val, cb) => {
                const r = document.createElement('div'); r.className = 'audio-row';
                r.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="0.01" value="${val}">`;
                r.querySelector('input').oninput = (e) => cb(parseFloat(e.target.value));
                content.appendChild(r);
            };
            add('Vol (dB)', -60, 0, -10, v => item.s.vol.volume.value = v);
            add('Attack', 0, 1, 0.01, v => item.s.env ? item.s.env.attack = v : item.s.src.set({envelope:{attack:v}}));
            add('Release', 0, 2, 0.1, v => item.s.env ? item.s.env.release = v : item.s.src.set({envelope:{release:v}}));
            folder.querySelector('.audio-folder-title').onclick = () => content.classList.toggle('open');
            folder.appendChild(content); root.appendChild(folder);
        });
    }

    window.addEventListener('keydown', e => {
        if(e.key.toLowerCase() === 'h') {
            const ag = document.getElementById('audio-gui');
            ag.style.display = ag.style.display === 'block' ? 'none' : 'block';
        }
    });

    document.getElementById('start-btn').onclick = async () => {
        await Tone.start();
        isActive = true;
        document.getElementById('start-screen').style.display = 'none';
        buildAudioUI();
        update();
    };
</script>
</body>
</html>

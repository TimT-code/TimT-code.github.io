<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orbital Singularity: Command & Control</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; user-select: none; }
        #hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; transition: opacity 0.3s; }
        .row { display: flex; justify-content: space-between; width: 100%; }
        .hud-text { color: #00ffaa; text-shadow: 0 0 5px #00ffaa; font-size: 14px; }
        #bars-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 400px; text-align: center; }
        .bar-label { font-size: 10px; color: #fff; letter-spacing: 2px; margin-bottom: 2px; display: block; }
        .bar-track { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1); border: 1px solid #444; margin-bottom: 10px; position: relative; overflow: hidden; }
        #target-health-fill { width: 100%; height: 100%; background: #00ffaa; transition: width 0.2s; }
        #ship-health-fill { width: 100%; height: 100%; background: #ff3333; transition: width 0.2s; }
        #boost-fill { width: 100%; height: 100%; background: #ffaa00; transition: width 0.1s; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; transform: translate(-50%, -50%); pointer-events: none; z-index: 15; border: 1px solid #00ffaa; border-radius: 50%; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffaa; }
        #crosshair::before { top: 50%; left: -10px; width: 60px; height: 1px; }
        #crosshair::after { left: 50%; top: -10px; width: 1px; height: 60px; }
        #start-screen { position: absolute; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        button { background: transparent; border: 2px solid #00ffaa; color: #00ffaa; padding: 15px 40px; font-size: 18px; cursor: pointer; transition: 0.3s; font-family: inherit; }
        button:hover { background: #00ffaa; color: #000; box-shadow: 0 0 20px #00ffaa; }
        #audio-gui { position: absolute; left: 0; top: 0; width: 280px; height: 100vh; background: rgba(26, 26, 26, 0.95); border-right: 1px solid #444; color: #eee; font-size: 11px; overflow-y: auto; z-index: 500; display: none; }
        .audio-folder { border-bottom: 1px solid #333; }
        .audio-folder-title { background: #000; padding: 8px; cursor: pointer; font-weight: bold; color: #00ffaa; display: flex; justify-content: space-between; border-left: 3px solid #00ffaa; }
        .audio-content { padding: 5px 0; display: none; }
        .audio-content.open { display: block; }
        .audio-row { padding: 4px 15px; display: flex; align-items: center; justify-content: space-between; }
        .audio-row input[type="range"] { width: 100px; }
        canvas#waveform { width: 100%; height: 100px; background: #000; border-bottom: 1px solid #444; }
    </style>
</head>
<body>

<div id="crosshair"></div>

<div id="start-screen">
    <h1 style="color: #00ffaa; letter-spacing: 10px;">SINGULARITY</h1>
    <p style="color: #888; margin-bottom: 30px;">[R/F] THRUST | [W/S/A/D] STRAFE | [Q/E] ROTATE | [SHIFT/X] BOOST/BRAKE<br>Press [H] to toggle all Interface Settings</p>
    <button id="start-btn">ENGAGE SYSTEMS</button>
</div>

<div id="audio-gui">
    <div style="padding: 10px; font-weight: bold; background: #000; border-bottom: 1px solid #00ffaa;">TONE.JS MASTER SIGNAL</div>
    <canvas id="waveform"></canvas>
    <div id="audio-controls-root"></div>
</div>

<div id="hud">
    <div class="row">
        <div class="hud-text">VELOCITY: <span id="vel-val">0</span> m/s</div>
        <div class="hud-text">SCORE: <span id="score">0</span></div>
    </div>
    <div id="bars-container">
        <span class="bar-label">DODECAHEDRA STABILITY</span>
        <div class="bar-track"><div id="target-health-fill"></div></div>
        <span class="bar-label">HULL INTEGRITY</span>
        <div class="bar-track"><div id="ship-health-fill"></div></div>
        <span class="bar-label">CAPACITOR</span>
        <div class="bar-track"><div id="boost-fill"></div></div>
    </div>
</div>

<script type="importmap">
    { "imports": { 
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "dat.gui": "https://unpkg.com/dat.gui@0.7.9/build/dat.gui.module.js"
    } }
</script>

<script type="module">
    import * as THREE from 'three';
    import * as Tone from 'https://esm.sh/tone';
    import { GUI } from 'dat.gui';

    // --- CONFIGURATION ---
    const params = {
        thrustRF: 0.02,
        thrustAD: 0.015,
        thrustWS: 0.015,
        rotationQE: 0.04,
        friction: 0.98,
        boostRegen: 0.15,
        shotFadeTime: 1.5,
        shotFadeDist: 600,
        shotShrinkSpeed: 0.02,
        starCount: 6000,
        starOpacity: 0.8,
        dodecaColor: '#00ffaa',
        dodecaOpacity: 1.0,
        hudOpacity: 0.8,
        crosshairOpacity: 0.8,
        crosshairSize: 40
    };

    let score = 0, isActive = false, isCharging = false, boostTank = 100, shipHealth = 100;
    let velocity = new THREE.Vector3(), targetHealth = 100;
    const projectiles = [], keys = {};

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- AUDIO SYSTEM ---
    const analyser = new Tone.Analyser("waveform", 256);
    const masterBus = new Tone.Gain(0.6).connect(analyser).toDestination();

    const createSoundChain = (type = "synth") => {
        const vol = new Tone.Volume(-10);
        const pan = new Tone.Panner(0);
        const dist = new Tone.Distortion(0);
        const delay = new Tone.FeedbackDelay("8n", 0);
        const verb = new Tone.Reverb(0.1);
        
        const chain = vol.chain(pan, dist, delay, verb, masterBus);
        let source;
        if(type === "noise") {
            source = new Tone.Noise("white");
            const env = new Tone.AmplitudeEnvelope();
            source.connect(env);
            env.connect(vol);
            source.start();
            return { source, env, vol, pan, dist, delay, verb };
        } else {
            source = new Tone.PolySynth(Tone.Synth).connect(vol);
            return { source, vol, pan, dist, delay, verb };
        }
    };

    const s_engine = createSoundChain("noise");
    const s_shot = createSoundChain("synth");
    const s_impact = createSoundChain("synth");

    // --- WORLD ---
    let stars;
    const refreshStars = () => {
        if(stars) { scene.remove(stars); stars.geometry.dispose(); }
        const geo = new THREE.BufferGeometry();
        const pos = [];
        for(let i=0; i<params.starCount; i++) pos.push((Math.random()-0.5)*4000, (Math.random()-0.5)*4000, (Math.random()-0.5)*4000);
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        stars = new THREE.Points(geo, new THREE.PointsMaterial({color: 0xffffff, size: 1.2, transparent: true, opacity: params.starOpacity}));
        scene.add(stars);
    };
    refreshStars();

    const target = new THREE.Mesh(new THREE.DodecahedronGeometry(25), new THREE.MeshPhongMaterial({color: params.dodecaColor, transparent: true, flatShading: true}));
    scene.add(target);
    const targetLight = new THREE.PointLight(0x00ffaa, 5, 200);
    scene.add(targetLight);

    const ship = new THREE.Object3D();
    ship.position.z = 200;
    scene.add(ship);
    scene.add(new THREE.AmbientLight(0x404040, 2));

    // --- INPUT HANDLERS ---
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);
    window.addEventListener('mousedown', () => { if(isActive) isCharging = true; });
    window.addEventListener('mouseup', () => { if(isCharging) fire(); isCharging = false; });

    function fire() {
        const shot = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshBasicMaterial({color: 0x00ffaa, transparent: true}));
        shot.position.copy(ship.position);
        const dir = new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion);
        projectiles.push({ mesh: shot, vel: dir.multiplyScalar(2.5), spawn: shot.position.clone(), life: 1.0 });
        scene.add(shot);
        s_shot.source.triggerAttackRelease("C4", "16n");
    }

    function updateControls() {
        const gp = navigator.getGamepads()[0];
        const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion);
        const right = new THREE.Vector3(1,0,0).applyQuaternion(ship.quaternion);
        const up = new THREE.Vector3(0,1,0).applyQuaternion(ship.quaternion);

        let moveMult = 1.0;
        const boosting = keys['ShiftLeft'] || (gp && gp.axes[3] < -0.5);
        const braking = keys['KeyX'] || (gp && gp.axes[3] > 0.5);

        if((boosting || braking) && boostTank > 0) {
            moveMult = boosting ? 2.8 : 0.3;
            boostTank -= 0.6;
        } else {
            boostTank = Math.min(100, boostTank + params.boostRegen);
        }

        // Translation
        if(keys['KeyR'] || (gp && gp.buttons[3].pressed)) velocity.add(fwd.multiplyScalar(params.thrustRF * moveMult));
        if(keys['KeyF'] || (gp && gp.buttons[0].pressed)) velocity.add(fwd.multiplyScalar(-params.thrustRF));
        if(keys['KeyA'] || (gp && gp.axes[0] < -0.1)) velocity.add(right.multiplyScalar(-params.thrustAD));
        if(keys['KeyD'] || (gp && gp.axes[0] > 0.1)) velocity.add(right.multiplyScalar(params.thrustAD));
        if(keys['KeyW'] || (gp && gp.axes[1] < -0.1)) velocity.add(up.multiplyScalar(params.thrustWS));
        if(keys['KeyS'] || (gp && gp.axes[1] > 0.1)) velocity.add(up.multiplyScalar(-params.thrustWS));

        // Rotation
        if(keys['KeyQ'] || (gp && gp.axes[2] < -0.1)) ship.rotation.y += params.rotationQE;
        if(keys['KeyE'] || (gp && gp.axes[2] > 0.1)) ship.rotation.y -= params.rotationQE;

        // Firing
        if(gp && (gp.buttons[6].pressed || gp.buttons[7].pressed)) {
            if(!isCharging) isCharging = true;
        } else if(gp && isCharging) { fire(); isCharging = false; }

        if(velocity.length() > 0.01) s_engine.env.triggerAttack(); else s_engine.env.triggerRelease();

        ship.position.add(velocity);
        velocity.multiplyScalar(params.friction);
        
        // Collisions
        if(ship.position.distanceTo(target.position) < 30) {
            shipHealth -= velocity.length() * 10;
            velocity.reflect(ship.position.clone().sub(target.position).normalize()).multiplyScalar(0.8);
            s_impact.source.triggerAttackRelease("G2", "8n");
        }

        camera.position.copy(ship.position);
        camera.quaternion.copy(ship.quaternion);
        targetLight.position.copy(target.position);
    }

    function update() {
        requestAnimationFrame(update);
        if(!isActive) return;
        updateControls();

        // Projectiles
        for(let i=projectiles.length-1; i>=0; i--) {
            const p = projectiles[i];
            p.mesh.position.add(p.vel);
            const dist = p.mesh.position.distanceTo(p.spawn);
            if(dist > params.shotFadeDist) {
                p.life -= params.shotShrinkSpeed;
                p.mesh.material.opacity = p.life;
                p.mesh.scale.setScalar(p.life);
            }
            if(p.mesh.position.distanceTo(target.position) < 25) {
                targetHealth -= 5; score += 10;
                scene.remove(p.mesh); projectiles.splice(i, 1);
            } else if(p.life <= 0) {
                scene.remove(p.mesh); projectiles.splice(i, 1);
            }
        }

        // UI
        document.getElementById('hud').style.opacity = params.hudOpacity;
        document.getElementById('boost-fill').style.width = boostTank + '%';
        document.getElementById('ship-health-fill').style.width = shipHealth + '%';
        document.getElementById('target-health-fill').style.width = targetHealth + '%';
        document.getElementById('vel-val').innerText = (velocity.length() * 100).toFixed(1);
        document.getElementById('score').innerText = score;
        const ch = document.getElementById('crosshair');
        ch.style.opacity = params.crosshairOpacity;
        ch.style.width = ch.style.height = params.crosshairSize + 'px';
        target.material.color.set(params.dodecaColor);
        target.material.opacity = params.dodecaOpacity;

        renderWaveform();
        renderer.render(scene, camera);
    }

    function renderWaveform() {
        const canvas = document.getElementById('waveform');
        const ctx = canvas.getContext('2d');
        const values = analyser.getValue();
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.beginPath(); ctx.strokeStyle = '#00ffaa'; ctx.lineWidth = 2;
        for(let i=0; i<values.length; i++) {
            const x = (i/values.length)*canvas.width;
            const y = (values[i]+1)/2*canvas.height;
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
    }

    // --- GUI GENERATION ---
    const gui = new GUI();
    const f1 = gui.addFolder('Thruster Dynamics');
    f1.add(params, 'thrustRF', 0, 0.1).name('R/F Power');
    f1.add(params, 'thrustAD', 0, 0.1).name('A/D Power');
    f1.add(params, 'thrustWS', 0, 0.1).name('W/S Power');
    f1.add(params, 'rotationQE', 0, 0.1).name('Q/E Rotation');
    
    const f2 = gui.addFolder('Visual & FX');
    f2.add(params, 'starCount', 1000, 10000).onChange(refreshStars);
    f2.add(params, 'starOpacity', 0, 1).onChange(refreshStars);
    f2.addColor(params, 'dodecaColor');
    f2.add(params, 'dodecaOpacity', 0, 1);
    f2.add(params, 'hudOpacity', 0, 1);
    f2.add(params, 'crosshairOpacity', 0, 1);

    const f3 = gui.addFolder('Weapon Systems');
    f3.add(params, 'shotFadeDist', 100, 2000);
    f3.add(params, 'shotShrinkSpeed', 0.001, 0.1);

    function buildAudioUI() {
        const root = document.getElementById('audio-controls-root');
        const sounds = [ {n: 'Engine', s: s_engine}, {n: 'Laser', s: s_shot}, {n: 'Impact', s: s_impact} ];
        
        sounds.forEach(item => {
            const folder = document.createElement('div');
            folder.className = 'audio-folder';
            folder.innerHTML = `<div class="audio-folder-title">${item.n} <span>▼</span></div>`;
            const content = document.createElement('div');
            content.className = 'audio-content';
            
            const addSlider = (label, min, max, step, start, cb) => {
                const row = document.createElement('div');
                row.className = 'audio-row';
                row.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${start}">`;
                row.querySelector('input').oninput = (e) => cb(parseFloat(e.target.value));
                content.appendChild(row);
            };

            addSlider('Vol (dB)', -60, 0, 1, -10, v => item.s.vol.volume.value = v);
            addSlider('Attack', 0, 2, 0.01, 0.1, v => item.s.source.set ? item.s.source.set({envelope:{attack:v}}) : item.s.env.attack = v);
            addSlider('Decay', 0, 2, 0.01, 0.1, v => item.s.source.set ? item.s.source.set({envelope:{decay:v}}) : item.s.env.decay = v);
            addSlider('Sustain', 0, 1, 0.01, 0.5, v => item.s.source.set ? item.s.source.set({envelope:{sustain:v}}) : item.s.env.sustain = v);
            addSlider('Release', 0, 4, 0.01, 1, v => item.s.source.set ? item.s.source.set({envelope:{release:v}}) : item.s.env.release = v);
            addSlider('Pan', -1, 1, 0.1, 0, v => item.s.pan.pan.value = v);
            addSlider('Reverb', 0, 1, 0.1, 0.1, v => item.s.verb.wet.value = v);
            addSlider('Distort', 0, 1, 0.1, 0, v => item.s.dist.distortion = v);

            folder.querySelector('.audio-folder-title').onclick = () => content.classList.toggle('open');
            folder.appendChild(content);
            root.appendChild(folder);
        });
    }

    window.addEventListener('keydown', e => {
        if(e.key.toLowerCase() === 'h') {
            const ag = document.getElementById('audio-gui');
            const state = ag.style.display === 'block' ? 'none' : 'block';
            ag.style.display = state;
            document.querySelector('.dg.main').style.display = state;
        }
    });

    document.getElementById('start-btn').onclick = async () => {
        await Tone.start();
        isActive = true;
        document.getElementById('start-screen').style.display = 'none';
        buildAudioUI();
        update();
    };

    window.onresize = () => {
        camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>

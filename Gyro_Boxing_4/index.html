<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Iron Gloves: World Tour - v1.2</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Impact', sans-serif; }
        #overlay, #victory-screen { 
            position: absolute; inset: 0; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; background: rgba(0,0,0,0.95); 
            color: #fff; z-index: 100; text-align: center;
        }
        h1 { font-size: 60px; color: #ff0000; text-transform: uppercase; margin: 0; }
        .btn { 
            padding: 20px 60px; font-size: 24px; background: #f00; color: #fff; 
            border: 4px solid #fff; cursor: pointer; margin-top: 20px; 
        }
        #hud { position: absolute; top: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        .stats { position: absolute; top: 20px; width: 35%; }
        #p-stats { left: 20px; }
        #e-stats { right: 20px; text-align: right; }
        .hp-bg { width: 100%; height: 25px; background: #333; border: 2px solid #fff; }
        .hp-fill { height: 100%; width: 100%; background: #0f0; transition: width 0.3s ease; }
        .fighter-name { font-size: 20px; color: #fff; margin-top: 5px; text-shadow: 2px 2px #000; }
        #announcer-text { position: absolute; bottom: 20%; width: 100%; text-align: center; color: #fff; font-size: 40px; text-transform: uppercase; }
    </style>
    <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@2.7.0/dist/es-module-shims.min.js"></script>
    <script type="importmap">
  {
    "imports": {
      "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
      "three/addons/": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/examples/jsm/"
    }
  }
</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
</head>
<body>

<div id="overlay">
    <h1>IRON GLOVES</h1>
    <p>MOBILE SENSORS & VOLUME ON</p>
    <button class="btn" onclick="startGame()">START CAREER</button>
</div>

<div id="victory-screen" style="display:none">
    <h1 id="vic-title">KNOCKOUT!</h1>
    <h2 id="vic-msg">NEXT FIGHTER READY</h2>
    <button class="btn" onclick="nextMatch()">NEXT MATCH</button>
</div>

<div id="hud">
    <div id="p-stats" class="stats">
        <div class="hp-bg"><div id="p-hp" class="hp-fill"></div></div>
        <div class="fighter-name">YOU</div>
    </div>
    <div id="e-stats" class="stats">
        <div class="hp-bg"><div id="e-hp" class="hp-fill"></div></div>
        <div id="e-name" class="fighter-name">OPPONENT</div>
    </div>
    <div id="announcer-text"></div>
</div>

    <script type="module">
        import * as THREE from 'three';
    </script>
    
    <script>  
    // --- DATA & STATE ---
    const STATE = {
        level: 1, playerHP: 100, enemyHP: 100, active: false, 
        currentOpponent: "", themes: ['tiger', 'dreams', 'popeye']
    };

    const OPPONENTS = [
        { name: "Salty Sam", theme: 'popeye', color: 0x5555ff },
        { name: "Neon Noel", theme: 'dreams', color: 0xff00ff },
        { name: "Thunder Tom", theme: 'tiger', color: 0xffaa00 },
        { name: "The Architect", theme: 'dreams', color: 0x00ffff }
    ];

    // --- WEB SPEECH ---
    const synth = window.speechSynthesis;
    function announce(text) {
        const utter = new SpeechSynthesisUtterance(text);
        utter.pitch = 0.8; utter.rate = 0.9;
        synth.speak(utter);
        document.getElementById('announcer-text').innerText = text;
        setTimeout(() => document.getElementById('announcer-text').innerText = "", 3000);
    }
        
    // --- THREE.JS SCENE ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Arena Lighting
    const amb = new THREE.AmbientLight(0xffffff, 0.4); scene.add(amb);
    const spot = new THREE.SpotLight(0xffffff, 1); spot.position.set(0, 10, 5); scene.add(spot);

    // Textured Opponent Materials
    gridTex = new THREE.MeshPhongMaterial({ color: 0xffffff, wireframe: true, emissive: 0x222222 });
    
    // Opponent Rig
    enemy = new THREE.Group();
    const eBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 0.8, 4, 8), gridTex);
    eBody.position.y = 1;
    const eHead = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), gridTex);
    eHead.position.y = 1.7;
    enemy.add(eBody, eHead);
    scene.add(enemy);
    enemy.position.z = -2.5;

    // Crowd (Humanized faces)
    crowdGroup = new THREE.Group();
    for(let i=0; i<100; i++) {
        const face = new THREE.Mesh(
            new THREE.PlaneGeometry(0.5, 0.5),
            new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide })
        );
        face.position.set((Math.random()-0.5)*20, 1+Math.random()*3, -10 - Math.random()*5);
        crowdGroup.add(face);
    }
    scene.add(crowdGroup);
    
    // --- AUDIO ENGINE ---
    const music = {
        tiger: () => {
            const riff = ["C3", "C3", "Bb2", "C3"];
            const p = new Tone.Sequence((time, note) => {
                new Tone.Synth().toDestination().triggerAttackRelease(note, "8n", time);
            }, riff, "4n").start(0);
            return p;
        },
        dreams: () => {
            const synth = new Tone.MonoSynth().toDestination();
            return new Tone.Sequence((time, note) => {
                synth.triggerAttackRelease(note, "8n", time);
            }, ["C3", "G3", "Ab3", "G3"], "8n").start(0);
        },
        popeye: () => {
            const synth = new Tone.PolySynth().toDestination();
            return new Tone.Sequence((time, note) => {
                synth.triggerAttackRelease(note, "8n", time);
            }, ["G4", "B4", "D5", "B4", "G4"], "4n").start(0);
        }
    };

    let currentThemePart;

    // --- HAPTICS ---
    function rumble(type) {
        if (!navigator.vibrate) return;
        if (type === 'hit') navigator.vibrate([100, 30, 100]);
        if (type === 'jab') navigator.vibrate(40);
        if (type === 'move') navigator.vibrate(10);
    }

    // --- GAMEPLAY FUNCTIONS ---
    function startGame() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        initFight();
    }

    async function initFight() {
        const opp = OPPONENTS[(STATE.level - 1) % OPPONENTS.length];
        STATE.enemyHP = 100;
        STATE.playerHP = 100;
        document.getElementById('e-name').innerText = opp.name;
        
        // Visual Update
        gridTex.color.setHex(opp.color);
        
        await Tone.start();
        if(currentThemePart) currentThemePart.stop();
        currentThemePart = music[opp.theme]();
        Tone.Transport.start();

        announce(`Fight ${STATE.level}. ${opp.name} versus Challenger.`);
        STATE.active = true;
        loop();
    }

    // Motion Handling
    window.addEventListener('devicemotion', (e) => {
        if (!STATE.active) return;
        const acc = e.acceleration;
        const total = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);

        if (total > 15) { // Punch detected
            throwPunch(total);
        }
    });

    function throwPunch(force) {
        rumble('jab');
        // Simple hit logic
        const hit = Math.random() > 0.3;
        if (hit) {
            STATE.enemyHP -= 10;
            rumble('hit');
            gsap.to(enemy.position, { z: -3, duration: 0.1, yoyo: true, repeat: 1 });
            checkState();
        }
        updateHUD();
    }

    function checkState() {
        if (STATE.enemyHP <= 0) {
            STATE.active = false;
            announce("Knockout! The winner is the Challenger!");
            document.getElementById('victory-screen').style.display = 'flex';
        }
        if (STATE.playerHP <= 0) {
            STATE.active = false;
            announce("You are knocked down! Ten. Nine. Eight.");
        }
    }

    function updateHUD() {
        document.getElementById('p-hp').style.width = STATE.playerHP + "%";
        document.getElementById('e-hp').style.width = STATE.enemyHP + "%";
    }

    function nextMatch() {
        STATE.level++;
        document.getElementById('victory-screen').style.display = 'none';
        initFight();
    }

    // --- MAIN LOOP ---
    function loop() {
        if (!STATE.active) return;
        requestAnimationFrame(loop);

        // Keep opponent centered
        enemy.position.x = Math.sin(Date.now() * 0.001) * 0.5;
        
        // Crowd minor movement
        crowdGroup.children.forEach(c => {
            c.position.y += Math.sin(Date.now() * 0.002 + c.position.x) * 0.005;
        });

        renderer.render(scene, camera);
    }

    // AI Logic
    setInterval(() => {
        if (!STATE.active) return;
        if (Math.random() > 0.95) {
            STATE.playerHP -= (5 * STATE.level);
            announce("Hit!");
            updateHUD();
            checkState();
        }
    }, 100);

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gyro Boxing Simulator - Pro Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; user-select: none; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.9); color: white; z-index: 10; pointer-events: auto; text-align: center; padding: 20px; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        
        /* Power Bars */
        .bar-wrapper { position: absolute; width: 35%; top: 20px; }
        #pWrapper { left: 20px; }
        #eWrapper { right: 20px; text-align: right; }
        .bar-container { width: 100%; height: 25px; border: 2px solid white; background: #222; position: relative; }
        .fill { height: 100%; width: 100%; background-color: #0f0; transition: width 0.1s linear, background-color 0.2s; }
        .name-tag { color: white; font-weight: bold; font-size: 14px; margin-top: 5px; text-transform: uppercase; text-shadow: 1px 1px 2px black; }

        #log { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #0f0; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 0 #000; pointer-events: none; }
        button { padding: 20px 40px; font-size: 20px; cursor: pointer; background: #d00; color: white; border: 2px solid white; border-radius: 5px; font-weight: bold; margin-top: 20px; }
        button:active { background: #900; }
        
        .flash { animation: flashAnim 0.1s infinite; }
        @keyframes flashAnim { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
        
        #knockdown-msg { position: absolute; top: 50%; width: 100%; text-align: center; color: red; font-size: 50px; display: none; font-weight: bold; text-shadow: 3px 3px #000; transform: translateY(-50%); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.26/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
</head>
<body>

<div id="overlay">
    <h1 style="color:red; text-shadow: 2px 2px white;">IRON GLOVES</h1>
    <p>Landscape Mode Required.<br>Punch air to Hit. Tilt Back to Block.<br>Shake to Get Up.</p>
    <button id="startBtn">FIGHT!</button>
</div>

<div id="hud">
    <div id="pWrapper" class="bar-wrapper">
        <div id="playerBar" class="bar-container"><div id="pFill" class="fill"></div></div>
        <div id="pName" class="name-tag">YOU</div>
    </div>
    <div id="eWrapper" class="bar-wrapper">
        <div id="enemyBar" class="bar-container"><div id="eFill" class="fill"></div></div>
        <div id="eName" class="name-tag">OPPONENT</div>
    </div>
    <div id="knockdown-msg">KNOCKDOWN! SHAKE!</div>
</div>
<div id="log"></div>

<script>
    // --- CONFIG & STATE ---
    const CONFIG = {
        accelThreshold: 15, // Punch sensitivity
        moveThreshold: 4,   // Movement sensitivity
        regenRate: 1.5,     // HP per 3 sec
        blockAngle: 10,     // Angle to trigger block
        musicVol: -10,
        sfxVol: -5
    };

    const STATE = {
        playerHP: 100,
        enemyHP: 100,
        combo: 0,
        isKnockedDown: false,
        canRecover: true,
        gameActive: false,
        lastPunchTime: 0,
        lastHitTime: 0
    };

    const NAMES = ["Iron Jaw Jack", "The Crusher", "Dynamite Dave", "Sledgehammer Sam", "Hurricane Hank", "Tank Tyler", "Viper Vance", "Bruiser Bill"];

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.03); // Darker fog for atmosphere
    
    // Camera fixed more centrally
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.7, 0); // Eye level

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    const spotLight = new THREE.SpotLight(0xffffff, 1.2);
    spotLight.position.set(0, 10, 0);
    spotLight.penumbra = 0.5;
    spotLight.castShadow = true;
    scene.add(spotLight);
    scene.add(new THREE.AmbientLight(0x202030)); // Cool ambient

    // --- ARENA ---
    // Crowd Particles (More of them, swaying)
    const crowdGeo = new THREE.BufferGeometry();
    const crowdCount = 1000;
    const posArray = new Float32Array(crowdCount * 3);
    for(let i=0; i<crowdCount * 3; i+=3) {
        let x = (Math.random() - 0.5) * 60;
        let z = (Math.random() - 0.5) * 60;
        // Keep center clear
        if (Math.abs(x) < 8 && Math.abs(z) < 8) x += 10; 
        posArray[i] = x;
        posArray[i+1] = Math.random() * 5 - 2; // Tiered seating
        posArray[i+2] = z;
    }
    crowdGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const crowdMat = new THREE.PointsMaterial({ color: 0x555555, size: 0.4 });
    const crowd = new THREE.Points(crowdGeo, crowdMat);
    scene.add(crowd);

    // Ring Floor
    const floorGeo = new THREE.PlaneGeometry(12, 12);
    const floorMat = new THREE.MeshPhongMaterial({ color: 0x111111, specular: 0x222222 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.5;
    scene.add(floor);
    
    // Ropes
    const ropeGroup = new THREE.Group();
    const ropeMat = new THREE.MeshBasicMaterial({ color: 0x880000 });
    for(let h of [0.5, 1.0, 1.5]) { // 3 Rope heights
        // Simple box representation for ropes
        const r1 = new THREE.Mesh(new THREE.BoxGeometry(12, 0.05, 0.05), ropeMat); r1.position.set(0, h-1.5, -6);
        const r2 = new THREE.Mesh(new THREE.BoxGeometry(12, 0.05, 0.05), ropeMat); r2.position.set(0, h-1.5, 6);
        const r3 = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 12), ropeMat); r3.position.set(-6, h-1.5, 0);
        const r4 = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 12), ropeMat); r4.position.set(6, h-1.5, 0);
        ropeGroup.add(r1, r2, r3, r4);
    }
    scene.add(ropeGroup);

    // --- FIGHTER ---
    function createFighter(color) {
        const group = new THREE.Group();
        const mat = new THREE.MeshLambertMaterial({ 
            color: color, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.6,
            emissive: color,
            emissiveIntensity: 0.2
        });

        // Head
        const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.25, 1), mat.clone());
        head.position.y = 1.6;
        
        // Upper Torso
        const upperTorso = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.35, 0.5, 8), mat.clone());
        upperTorso.position.y = 1.2;

        // Lower Torso (Abs/Hips)
        const lowerTorso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.38, 0.5, 8), mat.clone());
        lowerTorso.position.y = 0.7;

        // Arms (Visual cues)
        const lArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8), mat);
        lArm.position.set(-0.5, 1.3, 0.3); lArm.rotation.x = 0.5; lArm.rotation.z = 0.2;
        
        const rArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8), mat);
        rArm.position.set(0.5, 1.3, 0.3); rArm.rotation.x = 0.5; rArm.rotation.z = -0.2;

        group.add(head, upperTorso, lowerTorso, lArm, rArm);
        
        // References for animation
        group.userData = { head, upperTorso, lowerTorso }; 
        return group;
    }

    const enemy = createFighter(0xff0000);
    enemy.position.z = -2.5; // Centered distance
    enemy.position.y = -1.5; // On floor
    scene.add(enemy);

    // Player Gloves (First Person)
    const gloveGeo = new THREE.SphereGeometry(0.15, 16, 16);
    const gloveMat = new THREE.MeshPhongMaterial({ color: 0x00ff00, wireframe: true });
    const leftGlove = new THREE.Mesh(gloveGeo, gloveMat);
    leftGlove.position.set(-0.3, -0.3, -0.5);
    const rightGlove = new THREE.Mesh(gloveGeo, gloveMat);
    rightGlove.position.set(0.3, -0.3, -0.5);
    camera.add(leftGlove);
    camera.add(rightGlove);
    scene.add(camera);

    // --- AUDIO & MUSIC (TONE.JS) ---
    let synth, bassSynth, noise, ambientCrowd;
    let musicLoop;

    async function initAudio() {
        await Tone.start();
        Tone.Destination.volume.value = -5;

        // 1. Music: "Eye of the Tiger" simplified riff
        // C - C - Bb - C ... 
        const poly = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sawtooth" },
            envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 1 }
        }).toDestination();
        poly.volume.value = CONFIG.musicVol;

        const kick = new Tone.MembraneSynth().toDestination();
        kick.volume.value = CONFIG.musicVol + 2;

        // Sequence
        const riff = [
            { time: "0:0", note: "C3", dur: "8n" },
            { time: "0:0:2", note: "C3", dur: "8n" }, // fast punch
            { time: "0:1:0", note: "Bb2", dur: "8n" },
            { time: "0:1:2", note: "C3", dur: "4n" },
            // ... truncated loop for style
            { time: "0:3:0", note: "G2", dur: "8n" }
        ];

        const part = new Tone.Part((time, value) => {
            poly.triggerAttackRelease(value.note, value.dur, time);
            if(Math.random()>0.5) kick.triggerAttackRelease("C1", "8n", time);
        }, riff).start(0);
        part.loop = true;
        part.loopEnd = "1m";

        musicLoop = part;

        // 2. SFX Synths
        synth = new Tone.Synth({ oscillator: { type: "square" } }).toDestination(); // Hits
        noise = new Tone.NoiseSynth({ noise: { type: "pink" } }).toDestination();   // Misses/Breath

        // 3. Atmosphere (Crowd/Arena)
        ambientCrowd = new Tone.Player("https://tonejs.github.io/audio/berklee/gong_1.mp3").toDestination(); // Placeholder URL, generated noise below is better
        
        // Procedural crowd roar
        const crowdNoise = new Tone.Noise("brown");
        const crowdFilter = new Tone.AutoFilter({ frequency: 0.5, depth: 0.5, baseFrequency: 200 }).connect(Tone.Destination);
        crowdNoise.connect(crowdFilter);
        crowdNoise.volume.value = -20;
        crowdNoise.start();

        // Random vocal effects
        setInterval(playRandomCrowdSound, 4000);
    }

    function playRandomCrowdSound() {
        if(!STATE.gameActive) return;
        // Simulate Boo, Cheer, Laugh using filtered noise bursts
        const type = Math.floor(Math.random() * 3);
        const roar = new Tone.NoiseSynth({ 
            envelope: { attack: 0.5, decay: 1, sustain: 0 },
            filter: { Q: 1, type: "bandpass", frequency: 400 }
        }).toDestination();
        
        if (type === 0) { // Cheer
            roar.volume.value = -10;
            roar.triggerAttackRelease("1n"); 
        } else if (type === 1) { // Boo (lower pitch illusion via filter)
             roar.filter.frequency.value = 150;
             roar.triggerAttackRelease("2n");
        }
    }

    function playSound(type) {
        if(type === 'hit') {
            synth.triggerAttackRelease(Math.random()>0.5?"C2":"E2", "16n");
            // Heavy impact noise
            const impact = new Tone.NoiseSynth({ envelope: { attack: 0.001, decay: 0.2 } }).toDestination();
            impact.triggerAttackRelease("16n");
        } else if (type === 'miss') {
            noise.triggerAttackRelease("32n");
        } else if (type === 'block') {
            // Metallic/Dull thud
            const blockSynth = new Tone.MembraneSynth().toDestination();
            blockSynth.triggerAttackRelease("G1", "32n");
        }
    }

    // --- VIBRATION & HAPTICS ---
    function vibrate(pattern) {
        if (navigator.vibrate) {
            navigator.vibrate(pattern);
        }
    }

    // --- INPUT ---
    let gyro = { alpha: 0, beta: 0, gamma: 0 };
    let accel = { x: 0, y: 0, z: 0 };

    function handleMotion(e) {
        if (!STATE.gameActive) return;
        
        accel = e.accelerationIncludingGravity || {x:0,y:0,z:0};
        const pureAccel = e.acceleration || {x:0,y:0,z:0};

        // Shake to recover
        if (STATE.isKnockedDown) {
            if (Math.abs(pureAccel.x) > 20 || Math.abs(pureAccel.y) > 20) {
                recoverStamina();
                vibrate(50); // Feedback for effort
            }
            return;
        }

        // Punch Logic
        const force = Math.sqrt(pureAccel.x**2 + pureAccel.y**2 + pureAccel.z**2);
        if (force > CONFIG.accelThreshold && (Date.now() - STATE.lastPunchTime > 400)) {
            STATE.lastPunchTime = Date.now();
            throwPunch(pureAccel, force);
        }
    }

    function handleOrientation(e) {
        gyro = e;
    }

    // --- GAME LOGIC ---

    function throwPunch(a, force) {
        if (STATE.playerHP <= 0) return;

        // Vibrate on throw (light)
        vibrate(30);

        // Aiming Logic
        // Beta (Front/Back tilt): > 60 is usually upright. < 45 is leaning forward.
        // Let's invert: If phone is held high/upright = Head. Tilted down = Body.
        // Or simpler: Random/Gyro based zone. 
        // Let's use Beta: 
        let target = (gyro.beta < 50) ? 'body' : 'head';
        
        // Type Logic
        let type = 'jab';
        if (a.z > 10) type = 'uppercut'; // Upward motion
        else if (Math.abs(gyro.gamma) > 25) type = 'hook'; // Twist

        // Cost
        updatePower('player', -2);

        // Animation
        const glove = (a.x < 0) ? leftGlove : rightGlove;
        const targetY = (target==='head') ? 0.2 : -0.3;
        gsap.to(glove.position, { z: -3, y: targetY, duration: 0.1, yoyo: true, repeat: 1 });

        // Resolve Hit
        setTimeout(() => checkHit(type, target, force), 100);
    }

    function checkHit(type, target, force) {
        // AI Logic
        const enemyBlocking = (Math.random() > 0.6); 
        
        if (enemyBlocking) {
            playSound('block');
            log("BLOCKED!");
            vibrate([20, 50, 20]); // Dull thud
            updatePower('player', -1);
            enemyFlash(0x0000ff);
        } else {
            playSound('hit');
            vibrate(100); // Strong hit
            let dmg = 5;
            if (STATE.combo > 2) dmg = 15;
            
            // Critical hit based on force
            if (force > 25) { 
                dmg *= 1.5; 
                log("CRITICAL!"); 
            } else {
                log("HIT!");
            }

            updatePower('enemy', -dmg);
            updatePower('player', 1);
            
            enemyFlash(0xff0000);
            enemyWince(target);
        }
    }

    function enemyWince(target) {
        const mesh = (target === 'head') ? enemy.userData.head : enemy.userData.lowerTorso;
        // Flash specific part
        mesh.material.emissive.setHex(0xffffff);
        mesh.material.emissiveIntensity = 1;
        setTimeout(() => {
            mesh.material.emissive.setHex(0xff0000);
            mesh.material.emissiveIntensity = 0.2;
        }, 150);

        // Squish body
        gsap.to(enemy.scale, { y: 0.9, x: 1.1, duration: 0.1, yoyo: true, repeat: 1 });
    }

    function enemyFlash(color) {
        // Brief tint
        enemy.userData.head.material.color.setHex(color);
        setTimeout(() => enemy.userData.head.material.color.setHex(0xff0000), 100);
    }

    function updatePower(who, amt) {
        if (who === 'player') {
            STATE.playerHP = Math.min(100, Math.max(0, STATE.playerHP + amt));
            renderBar('pFill', STATE.playerHP);
            if (STATE.playerHP <= 20 && amt < 0) checkKnockdown();
        } else {
            STATE.enemyHP = Math.min(100, Math.max(0, STATE.enemyHP + amt));
            renderBar('eFill', STATE.enemyHP);
            if (STATE.enemyHP <= 0) doKnockout('enemy');
        }
    }

    function renderBar(id, hp) {
        const el = document.getElementById(id);
        el.style.width = hp + '%';
        if (hp > 60) el.style.backgroundColor = '#0f0';
        else if (hp > 30) el.style.backgroundColor = 'yellow';
        else {
            el.style.backgroundColor = 'red';
            if (hp < 15) el.parentElement.classList.add('flash');
            else el.parentElement.classList.remove('flash');
        }
    }

    // --- AI ENEMY LOOP ---
    setInterval(() => {
        if (!STATE.gameActive || STATE.isKnockedDown) return;

        // Regen
        updatePower('player', CONFIG.regenRate / 10);

        // Enemy Attack
        if (Math.random() < 0.05) { 
            // 1. Determine player block status (Tilt Back)
            const isBlocking = (gyro.beta < CONFIG.blockAngle); 

            if (isBlocking) {
                playSound('block');
                log("YOU BLOCKED!");
                vibrate([30, 30]);
                updatePower('player', -1);
            } else {
                // Player hit
                playSound('hit');
                vibrate([100, 50, 100]); // Heavy shake
                log("OUCH!");
                
                // Camera shake
                const shake = 0.2;
                camera.position.x += (Math.random()-0.5)*shake;
                camera.position.y += (Math.random()-0.5)*shake;
                setTimeout(() => camera.position.set(0, 1.7, 0), 100);

                updatePower('player', -8);
                
                // Red flash overlay
                document.body.style.backgroundColor = '#500';
                setTimeout(() => document.body.style.backgroundColor = '#000', 50);
            }
        }
    }, 300);

    function checkKnockdown() {
        if (!STATE.canRecover) { doKnockout('player'); return; }
        
        STATE.isKnockedDown = true;
        Tone.Transport.stop(); // Stop music
        
        const msg = document.getElementById('knockdown-msg');
        msg.style.display = 'block';
        
        let count = 10;
        const cd = setInterval(() => {
            if (!STATE.isKnockedDown) { clearInterval(cd); return; }
            msg.innerText = `SHAKE!! ${count}`;
            playSound('miss'); // Ticking sound
            count--;
            if (count < 0) {
                clearInterval(cd);
                doKnockout('player');
            }
        }, 1000);
    }

    function recoverStamina() {
        STATE.playerHP += 3;
        renderBar('pFill', STATE.playerHP);
        if (STATE.playerHP > 25) {
            STATE.isKnockedDown = false;
            STATE.canRecover = false;
            document.getElementById('knockdown-msg').style.display = 'none';
            Tone.Transport.start(); // Resume music
            log("BACK IN THE FIGHT!");
        }
    }

    function doKnockout(who) {
        STATE.gameActive = false;
        Tone.Transport.stop();
        document.getElementById('knockdown-msg').style.display = 'block';
        document.getElementById('knockdown-msg').innerText = (who === 'enemy') ? "KO! YOU WIN!" : "KNOCKED OUT";
        
        if (who === 'enemy') {
            gsap.to(enemy.rotation, { x: -Math.PI/2, duration: 1.5, ease: "bounce.out" });
            gsap.to(enemy.position, { y: -2, duration: 1 });
        }
    }

    function log(txt) {
        const l = document.getElementById('log');
        l.innerText = txt;
        l.style.opacity = 1;
        setTimeout(() => l.style.opacity = 0, 1500);
    }

    // --- LOOP ---
    function animate() {
        requestAnimationFrame(animate);

        // Subtle Crowd sway
        const p = crowd.geometry.attributes.position.array;
        for(let i=1; i<p.length; i+=3) p[i] += Math.sin(Date.now()*0.005 + p[i-1])*0.01;
        crowd.geometry.attributes.position.needsUpdate = true;

        // Player Drift (Accelerometer)
        if (STATE.gameActive && !STATE.isKnockedDown) {
            // Slight parallax based on phone tilt
            camera.rotation.z = THREE.MathUtils.degToRad(-gyro.gamma / 2);
            camera.rotation.x = THREE.MathUtils.degToRad(gyro.beta - 90); 
            
            // Constrain camera to center
            camera.position.x = THREE.MathUtils.clamp(camera.position.x + (accel.x * 0.01), -1, 1);
        }

        renderer.render(scene, camera);
    }

    // --- SETUP ---
    document.getElementById('startBtn').addEventListener('click', async () => {
        // Names
        document.getElementById('eName').innerText = NAMES[Math.floor(Math.random() * NAMES.length)];
        document.getElementById('pName').innerText = "CHALLENGER";

        // Permission
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            try {
                const r = await DeviceMotionEvent.requestPermission();
                if (r!=='granted') alert("Sensors needed!");
            } catch(e) {}
        }

        window.addEventListener('devicemotion', handleMotion);
        window.addEventListener('deviceorientation', handleOrientation);

        // Audio
        await initAudio();
        Tone.Transport.start();

        // UI
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        
        STATE.gameActive = true;
        animate();
    });

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Gyr-OS | Master Utility</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <style>
        :root {
            --glass-bg: rgba(15, 15, 20, 0.9);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-neon: #00ffcc;
            --error-red: #ff4444;
            --warning-orange: #ffaa00;
            --text-main: #e0e0e0;
        }

        body, html { margin: 0; padding: 0; overflow: hidden; background: #050505; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* Force dat.gui to be visible on top */
        .dg.ac { z-index: 99 !important; }

        /* UI Overlay */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            z-index: 10;
            position: absolute;
        }

        #bottom-hud { bottom: 0; left: 0; width: 100vw; height: 20vh; display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding-top: 10px; box-sizing: border-box; }
        #master-waveform { width: 100vw; height: 5vh; border-top: 1px solid var(--accent-neon); }
        
        .btn-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
        .mode-btn { padding: 8px 12px; background: transparent; border: 1px solid var(--accent-neon); color: var(--accent-neon); border-radius: 4px; cursor: pointer; font-size: 11px; transition: 0.3s; font-weight: bold;}
        .mode-btn.active { background: var(--accent-neon); color: #000; box-shadow: 0 0 15px var(--accent-neon); }
        .recording-active { background: var(--error-red) !important; color: white !important; animation: blink 1s infinite; border-color: var(--error-red) !important; }

        @keyframes blink { 50% { opacity: 0.5; } }

        #init-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #btn-start { padding: 20px 40px; font-size: 1.5rem; background: var(--accent-neon); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        #btn-start:hover { background: #00ccaa; }
        #error-msg { color: var(--error-red); margin-top: 20px; font-family: monospace; font-size: 1rem; min-height: 1.5rem; padding: 0 20px;}
    </style>
</head>
<body>

<div id="init-overlay">
    <h1 style="color: var(--accent-neon); letter-spacing: 8px;">GYR-OS</h1>
    <p style="color: #666; margin-bottom: 20px;">SPATIAL AUDIO UTILITY V1.3</p>
    <button id="btn-start">INITIALIZE ENGINE</button>
    <div id="error-msg"></div>
</div>

<div id="canvas-container"></div>

<div id="bottom-hud" class="glass-panel">
    <div id="readout" style="font-family: monospace; font-size: 12px; color: var(--accent-neon);">SYSTEM STANDBY</div>
    <div class="btn-row" id="mode-controls">
        <button class="mode-btn active" data-mode="1">1: THEREMIN</button>
        <button class="mode-btn" data-mode="2">2: IMPACT</button>
        <button class="mode-btn" data-mode="3">3: HYBRID</button>
        <button class="mode-btn" data-mode="5">5: COMPOSER</button>
    </div>
    <div class="btn-row">
        <button id="btn-panic" class="mode-btn" style="border-color: var(--warning-orange); color: var(--warning-orange);">■ MUTE/PANIC</button>
        <button id="btn-record" class="mode-btn" style="border-color: var(--error-red); color: var(--error-red);">● REC</button>
    </div>
    <canvas id="master-waveform"></canvas>
</div>
    
<script type="importmap">
    { "imports": { 
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js"
    } }
</script>

<script type="module">
    import * as THREE from 'three';
    import * as Tone from 'https://esm.sh/tone';

// Simple math map function
const mapRange = (value, inMin, inMax, outMin, outMax) => {
    return ((value - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;
};

/**
 * THE GYR-OS MASTER OBJECT
 */
const GyrOS = {
    state: {
        mode: 1, sensitivity: 25, threshold: 15, 
        hasGyro: false,
        gyro: { x: 0, y: 0, z: 0 },
        mouse: { x: 0, y: 0 },
        synthParams: {
            oscType: 'sine', attack: 0.05, release: 1.5,
            reverbMix: 0.3, delayMix: 0.2, masterVol: 0
        },
        isRecording: false
    },

    async init() {
        const errorDiv = document.getElementById('error-msg');
        const startBtn = document.getElementById('btn-start');
        
        try {
            errorDiv.style.color = "var(--accent-neon)";
            errorDiv.innerText = "Requesting Audio/Sensor Permissions...";
            startBtn.disabled = true;

            await Tone.start();
            
            try { 
                await this.detectSensors(); 
                this.state.hasGyro = true;
            } catch(e) { 
                console.warn(e.message); 
                this.state.hasGyro = false; // Fallback to mouse/pointer
            }

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); } catch(e) {}
            }
            
            this.initAudio();
            this.initVisuals();
            this.initSensors();
            this.initRecorder();
            this.initGUI();
            this.bindEvents();

            document.getElementById('init-overlay').style.display = 'none';
            document.getElementById('readout').innerText = this.state.hasGyro ? "SYSTEM ACTIVE // GYRO LINKED" : "DESKTOP MODE // POINTER LINKED";
            
            this.loop();
        } catch (error) {
            startBtn.disabled = false;
            errorDiv.style.color = "var(--error-red)";
            errorDiv.innerText = error.message || "Initialization failed.";
        }
    },

    async detectSensors() {
        if (!window.DeviceOrientationEvent) throw new Error("No Gyroscope hardware.");

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            const permissionState = await DeviceOrientationEvent.requestPermission();
            if (permissionState !== 'granted') throw new Error("Gyroscope permission denied.");
        }
        
        return new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
                window.removeEventListener('deviceorientation', checkGyro);
                reject(new Error("No Gyro data received. Defaulting to pointer."));
            }, 1000);

            const checkGyro = (event) => {
                if (event.alpha !== null && event.beta !== null && event.gamma !== null) {
                    clearTimeout(timeout);
                    window.removeEventListener('deviceorientation', checkGyro);
                    resolve();
                }
            };
            window.addEventListener('deviceorientation', checkGyro);
        });
    },

    initAudio() {
        this.analyser = new Tone.Analyser("waveform", 1024);
        
        this.masterBus = new Tone.Volume(this.state.synthParams.masterVol).toDestination();
        this.masterBus.connect(this.analyser);

        this.rack = {
            reverb: new Tone.Freeverb({ roomSize: 0.8, dampening: 2000 }).connect(this.masterBus),
            delay: new Tone.FeedbackDelay("8n", 0.3).connect(this.masterBus)
        };
        this.rack.reverb.wet.value = this.state.synthParams.reverbMix;
        this.rack.delay.wet.value = this.state.synthParams.delayMix;

        // Theremin setup (Using a Volume node to stop audio cleanly)
        this.thereminVol = new Tone.Volume(-Infinity).connect(this.rack.reverb);
        this.synths = {
            poly: new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: this.state.synthParams.oscType },
                envelope: { attack: this.state.synthParams.attack, decay: 0.2, sustain: 0.2, release: this.state.synthParams.release }
            }).connect(this.rack.delay).connect(this.masterBus),
            
            // Oscillator stays running, but is silenced by thereminVol when not in use
            theremin: new Tone.Oscillator(440, this.state.synthParams.oscType).connect(this.thereminVol).start()
        };
        this.drums = { kick: new Tone.MembraneSynth().connect(this.masterBus) };
    },

    initVisuals() {
        this.scene = new THREE.Scene();
        this.cam = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(this.renderer.domElement);
        
        // Main Gyro Object
        this.cursor = new THREE.Mesh(
            new THREE.IcosahedronGeometry(0.6, 0), 
            new THREE.MeshPhongMaterial({ color: 0x00ffcc, wireframe: true })
        );
        this.scene.add(this.cursor);

        // Pointer/Mouse tracking object
        this.pointer = new THREE.Mesh(
            new THREE.TorusGeometry(0.3, 0.05, 8, 24),
            new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true })
        );
        this.scene.add(this.pointer);

        this.scene.add(new THREE.GridHelper(100, 50, 0x222222, 0x111111));
        this.cam.position.z = 12;
        
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 10, 10);
        this.scene.add(light);

        // Raycasting setup
        this.raycaster = new THREE.Raycaster();
        this.rayPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    },

    initSensors() {
        if (this.state.hasGyro) {
            window.addEventListener("deviceorientation", e => {
                this.state.gyro = { x: e.beta || 0, y: e.gamma || 0, z: e.alpha || 0 };
            });
            window.addEventListener("devicemotion", e => {
                let a = e.acceleration || e.accelerationIncludingGravity;
                if (!a || a.x === null) return;
                const force = Math.sqrt(a.x**2 + a.y**2 + a.z**2);
                if (force > this.state.threshold && force > 10) this.handleThrust(force);
            });
        }
    },

    handleThrust(force = 30) {
        const now = Tone.now();
        if (this.lastThrust && (now - this.lastThrust) < 0.15) return;
        this.lastThrust = now;

        if (navigator.vibrate) navigator.vibrate(30);
        
        const scaleBump = 1 + Math.min(force / 15, 3);
        this.cursor.scale.set(scaleBump, scaleBump, scaleBump);
        this.pointer.scale.set(scaleBump, scaleBump, scaleBump);
        setTimeout(() => {
            this.cursor.scale.set(1, 1, 1);
            this.pointer.scale.set(1, 1, 1);
        }, 150);

        if (this.state.mode === 2 || this.state.mode === 3) {
            const scale = ["C3", "D3", "E3", "G3", "A3", "C4", "D4", "E4", "G4", "A4", "C5", "D5", "E5", "G5", "A5"];
            
            // Use Gyro X if available, otherwise use Mouse Y for pitch
            let pitchVal = this.state.hasGyro ? this.state.gyro.x : mapRange(this.state.mouse.y, -1, 1, -90, 90);
            
            let index = Math.floor(mapRange(pitchVal, -90, 90, 0, scale.length - 1));
            index = Math.max(0, Math.min(scale.length - 1, index));
            
            const velocity = Math.min(1, force / 40);
            this.synths.poly.triggerAttackRelease(scale[index], "8n", now, velocity);
            this.drums.kick.triggerAttackRelease("C1", "16n", now, velocity * 0.8);
        }
    },

    initRecorder() {
        this.streamDest = Tone.context.createMediaStreamDestination();
        this.masterBus.connect(this.streamDest);
        let mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
        this.recorder = new MediaRecorder(this.streamDest.stream, { mimeType });
        this.chunks = [];
        this.recorder.ondataavailable = e => { if (e.data.size > 0) this.chunks.push(e.data); };
        this.recorder.onstop = () => {
            const blob = new Blob(this.chunks, { type: mimeType });
            this.chunks = [];
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `GyrOS_Rec_${Date.now()}.${mimeType.split('/')[1]}`;
            a.click();
        };
    },

    initGUI() {
        if (this.gui) this.gui.destroy();
        this.gui = new dat.GUI({ width: 280 });
        
        // 1. Logic Settings
        const sys = this.gui.addFolder('System Logic');
        sys.add(this.state, 'threshold', 5, 50).name("Impact Thresh");
        sys.add(this.state, 'sensitivity', 1, 50).name("Visual Scale");
        sys.open();

        // 2. Sound Engine Settings
        const snd = this.gui.addFolder('Sound Engine');
        snd.add(this.state.synthParams, 'masterVol', -60, 10).name('Master Vol (dB)').onChange(v => this.masterBus.volume.value = v);
        
        snd.add(this.state.synthParams, 'oscType', ['sine', 'square', 'sawtooth', 'triangle']).name('Osc Type').onChange(v => {
            this.synths.theremin.type = v;
            this.synths.poly.set({ oscillator: { type: v } });
        });

        const env = snd.addFolder('Poly Envelope');
        env.add(this.state.synthParams, 'attack', 0.001, 2).name('Attack').onChange(v => this.synths.poly.set({ envelope: { attack: v }}));
        env.add(this.state.synthParams, 'release', 0.01, 5).name('Release').onChange(v => this.synths.poly.set({ envelope: { release: v }}));

        const fx = snd.addFolder('Effects Mix');
        fx.add(this.state.synthParams, 'reverbMix', 0, 1).name('Reverb Mix').onChange(v => this.rack.reverb.wet.value = v);
        fx.add(this.state.synthParams, 'delayMix', 0, 1).name('Delay Mix').onChange(v => this.rack.delay.wet.value = v);
        
        snd.open();
    },

    bindEvents() {
        window.addEventListener('resize', () => {
            this.cam.aspect = window.innerWidth / window.innerHeight;
            this.cam.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Mode Switching
        document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn[data-mode]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                this.state.mode = parseInt(e.target.getAttribute('data-mode'));
                document.getElementById('readout').innerText = `MODE ${this.state.mode} ENGAGED`;
            });
        });

        // Mouse / Pointer Tracking for Desktop support
        const updatePointer = (clientX, clientY) => {
            this.state.mouse.x = (clientX / window.innerWidth) * 2 - 1;
            this.state.mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            this.raycaster.setFromCamera(new THREE.Vector2(this.state.mouse.x, this.state.mouse.y), this.cam);
            const target = new THREE.Vector3();
            this.raycaster.ray.intersectPlane(this.rayPlane, target);
            this.pointer.position.copy(target);
        };

        window.addEventListener('mousemove', e => updatePointer(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => updatePointer(e.touches[0].clientX, e.touches[0].clientY));
        
        // Manual impact triggers via click (For Desktop functionality Parity)
        window.addEventListener('mousedown', () => this.handleThrust(30));
        window.addEventListener('touchstart', () => this.handleThrust(30));

        // Panic / Mute System
        document.getElementById('btn-panic').onclick = () => {
            Tone.Transport.stop();
            this.synths.poly.releaseAll();
            this.drums.kick.triggerRelease();
            this.thereminVol.volume.rampTo(-Infinity, 0.05);
            
            this.state.mode = 0; // Set to Standby
            document.querySelectorAll('.mode-btn[data-mode]').forEach(b => b.classList.remove('active'));
            document.getElementById('readout').innerText = "SYSTEM MUTED // STANDBY";
            
            this.pointer.scale.set(0.1, 0.1, 0.1); // Visual shrink
        };
    },

    loop() {
        requestAnimationFrame(() => this.loop());
        const { gyro, sensitivity, mode, hasGyro, mouse } = this.state;
        const now = Tone.now();

        // 1. Visuals Iteration
        if (hasGyro) {
            const targetX = mapRange(gyro.y, -90, 90, -10 * (sensitivity/25), 10 * (sensitivity/25));
            const targetY = mapRange(gyro.x, -90, 90, -10 * (sensitivity/25), 10 * (sensitivity/25));
            this.cursor.position.x += (targetX - this.cursor.position.x) * 0.1;
            this.cursor.position.y += (targetY - this.cursor.position.y) * 0.1;
        }
        this.cursor.rotation.x += 0.01;
        this.cursor.rotation.y += 0.02;
        this.pointer.rotation.x -= 0.03;
        this.pointer.rotation.z += 0.01;

        // 2. Audio Theremin Logic (Modes 1 and 3)
        if (mode === 1 || mode === 3) {
            let pitchVal, volVal;
            if (hasGyro) {
                pitchVal = gyro.x;
                volVal = gyro.y;
            } else {
                pitchVal = mapRange(mouse.y, -1, 1, -90, 90);
                volVal = mapRange(mouse.x, -1, 1, -90, 90);
            }

            let freq = mapRange(pitchVal, -90, 90, 100, 1500);
            freq = Math.max(50, Math.min(2000, freq)); 
            
            let vol = mapRange(volVal, -90, 90, -40, 0);
            vol = Math.max(-60, Math.min(0, vol));

            this.synths.theremin.frequency.setTargetAtTime(freq, now, 0.05);
            this.thereminVol.volume.setTargetAtTime(vol, now, 0.05);
        } else {
            // Smoothly mute theremin when not in modes 1 or 3
            this.thereminVol.volume.setTargetAtTime(-Infinity, now, 0.1);
        }

        // 3. Composer Mode (Mode 5) Arpeggiator
        if (mode === 5) {
            if (!this.lastArp || now - this.lastArp > 0.15) { 
                this.lastArp = now;
                const scale = ["C3", "E3", "G3", "B3", "C4", "E4", "G4", "B4", "C5"];
                let pitchVal = hasGyro ? gyro.x : mapRange(mouse.y, -1, 1, -90, 90);
                let index = Math.floor(mapRange(pitchVal, -90, 90, 0, scale.length - 1));
                index = Math.max(0, Math.min(scale.length - 1, index));
                this.synths.poly.triggerAttackRelease(scale[index], "16n");
            }
        }

        this.renderWaveform();
        this.renderer.render(this.scene, this.cam);
    },

    renderWaveform() {
        const canvas = document.getElementById('master-waveform');
        const ctx = canvas.getContext('2d');
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        
        if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
        }

        const data = this.analyser.getValue();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        
        for(let i = 0; i < data.length; i++) {
            const x = (i / data.length) * canvas.width;
            const y = ((data[i] + 1) / 2) * canvas.height;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
};

// Start Buttons
document.getElementById('btn-start').onclick = () => GyrOS.init();
document.getElementById('btn-record').onclick = function() {
    if (!GyrOS.state.isRecording) {
        GyrOS.recorder.start();
        this.classList.add('recording-active');
        this.innerText = "■ STOP REC";
    } else {
        GyrOS.recorder.stop();
        this.classList.remove('recording-active');
        this.innerText = "● REC";
    }
    GyrOS.state.isRecording = !GyrOS.state.isRecording;
};
</script>
</body>
</html>

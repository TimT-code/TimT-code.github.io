<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Gyr-OS | Master Utility</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <style>
        :root {
            --glass-bg: rgba(15, 15, 20, 0.9);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-neon: #00ffcc;
            --error-red: #ff4444;
            --text-main: #e0e0e0;
        }

        body, html { margin: 0; padding: 0; overflow: hidden; background: #050505; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* UI Overlay */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            z-index: 10;
            position: absolute;
        }

        #bottom-hud { bottom: 0; left: 0; width: 100vw; height: 18vh; display: flex; flex-direction: column; align-items: center; justify-content: space-around; }
        #master-waveform { width: 100vw; height: 5vh; border-top: 1px solid var(--accent-neon); }
        
        .mode-btn { padding: 8px 12px; background: transparent; border: 1px solid var(--accent-neon); color: var(--accent-neon); border-radius: 4px; cursor: pointer; font-size: 10px; transition: 0.3s; }
        .mode-btn.active { background: var(--accent-neon); color: #000; box-shadow: 0 0 15px var(--accent-neon); }
        .recording-active { background: var(--error-red) !important; color: white !important; animation: blink 1s infinite; border-color: var(--error-red) !important; }

        @keyframes blink { 50% { opacity: 0.5; } }

        #init-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #btn-start { padding: 20px 40px; font-size: 1.5rem; background: var(--accent-neon); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        #btn-start:hover { background: #00ccaa; }
        #error-msg { color: var(--error-red); margin-top: 20px; font-family: monospace; font-size: 1.2rem; min-height: 1.5rem; }
    </style>
</head>
<body>

<div id="init-overlay">
    <h1 style="color: var(--accent-neon); letter-spacing: 8px;">GYR-OS</h1>
    <p style="color: #666; margin-bottom: 20px;">SPATIAL AUDIO UTILITY V1.1</p>
    <button id="btn-start">INITIALIZE ENGINE</button>
    <div id="error-msg"></div>
</div>

<div id="canvas-container"></div>

<div id="bottom-hud" class="glass-panel">
    <div id="readout" style="font-family: monospace; font-size: 12px; color: var(--accent-neon);">SYSTEM STANDBY</div>
    <div style="display: flex; gap: 5px;" id="mode-controls">
        <button class="mode-btn active" data-mode="1">1: THEREMIN</button>
        <button class="mode-btn" data-mode="2">2: IMPACT</button>
        <button class="mode-btn" data-mode="3">3: HYBRID</button>
        <button class="mode-btn" data-mode="5">5: COMPOSER</button>
        <button id="btn-record" class="mode-btn" style="border-color: #ff4444; color: #ff4444;">● REC</button>
    </div>
    <canvas id="master-waveform"></canvas>
</div>
    
<script type="importmap">
    { "imports": { 
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js"
    } }
</script>

<script type="module">
    import * as THREE from 'three';
    import * as Tone from 'https://esm.sh/tone';

/**
 * THE GYR-OS MASTER OBJECT
 */
const GyrOS = {
    state: {
        mode: 1, sensitivity: 25, threshold: 25, 
        gyro: { x: 0, y: 0, z: 0 },
        osc: { sine: true, sawtooth: false, square: false, triangle: false },
        isRecording: false
    },

    async init() {
        const errorDiv = document.getElementById('error-msg');
        const startBtn = document.getElementById('btn-start');
        
        try {
            errorDiv.innerText = "Requesting permissions...";
            startBtn.disabled = true;

            // 1. Audio and Permissions
            await Tone.start();
            await this.detectGyroscope();

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); } catch(e) { console.warn("Wake lock denied."); }
            }
            
            // 2. Subsystem Ignition
            this.initAudio();
            this.initVisuals();
            this.initSensors();
            this.initSpeech();
            this.initRecorder();
            this.initGUI();

            document.getElementById('init-overlay').style.display = 'none';
            document.getElementById('readout').innerText = "SYSTEM ACTIVE // GYRO LINKED";
            
            this.bindEvents();
            this.loop();
        } catch (error) {
            startBtn.disabled = false;
            errorDiv.innerText = error.message || "Initialization failed.";
            console.error(error);
        }
    },

    async detectGyroscope() {
        if (!window.DeviceOrientationEvent) {
            throw new Error("No Gyroscope detected on system");
        }

        // Request permission on modern iOS
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            const permissionState = await DeviceOrientationEvent.requestPermission();
            if (permissionState !== 'granted') {
                throw new Error("Gyroscope permission denied by user.");
            }
        }

        // Validate actual sensor hardware presence using a timeout logic
        return new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
                window.removeEventListener('deviceorientation', checkGyro);
                reject(new Error("No Gyroscope detected on system"));
            }, 2000);

            const checkGyro = (event) => {
                // If the hardware sends valid angular tracking properties
                if (event.alpha !== null && event.beta !== null && event.gamma !== null) {
                    clearTimeout(timeout);
                    window.removeEventListener('deviceorientation', checkGyro);
                    resolve();
                }
            };

            window.addEventListener('deviceorientation', checkGyro);
        });
    },

    initAudio() {
        this.analyser = new Tone.Analyser("waveform", 1024);
        this.rack = {
            reverb: new Tone.Reverb(3).toDestination(),
            delay: new Tone.FeedbackDelay("8n", 0.4).connect(Tone.Destination)
        };
        this.synths = {
            poly: new Tone.PolySynth().connect(this.rack.delay),
            theremin: new Tone.Oscillator(440, "sine").toDestination()
        };
        this.drums = { kick: new Tone.MembraneSynth().toDestination() };
        Tone.Destination.connect(this.analyser);
    },

    initVisuals() {
        this.scene = new THREE.Scene();
        this.cam = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(this.renderer.domElement);
        
        this.cursor = new THREE.Mesh(
            new THREE.IcosahedronGeometry(0.6, 0), 
            new THREE.MeshPhongMaterial({ color: 0x00ffcc, wireframe: true })
        );
        this.scene.add(this.cursor);
        this.scene.add(new THREE.GridHelper(100, 50, 0x222222, 0x111111));
        this.cam.position.z = 12;
        
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 10, 10);
        this.scene.add(light);
    },

    initSensors() {
        window.addEventListener("deviceorientation", e => {
            // Null fallback is handled, mapping beta/gamma natively
            this.state.gyro = { x: e.beta || 0, y: e.gamma || 0, z: e.alpha || 0 };
        });
        
        window.addEventListener("devicemotion", e => {
            if (!e.acceleration || e.acceleration.x === null) return;
            const a = e.acceleration;
            const force = Math.sqrt(a.x**2 + a.y**2 + a.z**2);
            if (force > this.state.threshold) this.handleThrust();
        });
    },

    handleThrust() {
        if (navigator.vibrate) navigator.vibrate(30);
        this.cursor.scale.set(2, 2, 2);
        
        // Reset scale gracefully
        setTimeout(() => this.cursor.scale.set(1, 1, 1), 100);

        if (this.state.mode === 2 || this.state.mode === 3) {
            this.drums.kick.triggerAttackRelease("C1", "8n");
        }
    },

    initSpeech() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Speech) {
            try {
                this.recognition = new Speech();
                this.recognition.continuous = true;
                this.recognition.onresult = (e) => {
                    const text = e.results[e.results.length-1][0].transcript.toLowerCase();
                    if (text.includes("spawn")) this.spawnOrb();
                };
                this.recognition.start();
            } catch (err) {
                console.warn("Speech engine initialization failed (may require permissions).", err);
            }
        } else {
            console.warn("Speech Recognition API not supported in this browser.");
        }
    },

    spawnOrb() {
        const orb = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 8, 8), 
            new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true })
        );
        orb.position.copy(this.cursor.position);
        this.scene.add(orb);
    },

    initRecorder() {
        this.streamDest = Tone.context.createMediaStreamDestination();
        Tone.Destination.connect(this.streamDest);
        
        let mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
        this.recorder = new MediaRecorder(this.streamDest.stream, { mimeType });
        this.chunks = [];
        
        this.recorder.ondataavailable = e => { if (e.data.size > 0) this.chunks.push(e.data); };
        this.recorder.onstop = () => {
            const blob = new Blob(this.chunks, { type: mimeType });
            this.chunks = []; // Clear for next recording
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `GyrOS_Rec_${Date.now()}.${mimeType.split('/')[1]}`;
            a.click();
        };
    },

    initGUI() {
        const gui = new dat.GUI();
        gui.add(this.state, 'threshold', 10, 100).name("Impact Thresh");
        gui.add(this.state, 'sensitivity', 1, 50).name("Gyro Scale");
        const osc = gui.addFolder('Oscillators');
        ['sine', 'sawtooth', 'square', 'triangle'].forEach(t => {
            osc.add(this.state.osc, t).listen().onChange(() => this.updateOsc(t));
        });
    },

    updateOsc(type) {
        Object.keys(this.state.osc).forEach(k => this.state.osc[k] = (k === type));
        this.synths.theremin.type = type;
        this.synths.poly.set({ oscillator: { type: type } });
    },

    bindEvents() {
        // Handle window resizing seamlessly
        window.addEventListener('resize', () => {
            this.cam.aspect = window.innerWidth / window.innerHeight;
            this.cam.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Mode Switching mechanism
        document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn[data-mode]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                this.state.mode = parseInt(e.target.getAttribute('data-mode'));
            });
        });
    },

    loop() {
        requestAnimationFrame(() => this.loop());
        const { gyro, sensitivity, mode } = this.state;

        // Visuals Interaction
        this.cursor.position.x = (gyro.y / 90) * sensitivity;
        this.cursor.position.y = (gyro.x / 90) * (sensitivity * 0.75);
        this.cursor.rotation.x += 0.01;
        this.cursor.rotation.y += 0.02;

        // Audio Theremin logic (Modes 1 and 3)
        if (mode === 1 || mode === 3) {
            // Mapping Beta angle to a healthy frequency range
            let freq = Tone.map(gyro.x, -90, 90, 100, 1000);
            freq = Math.max(20, Math.min(2000, freq)); // Safety limits
            
            this.synths.theremin.frequency.rampTo(freq, 0.1);
            if (this.synths.theremin.state !== 'started') this.synths.theremin.start();
        } else {
            this.synths.theremin.stop();
        }

        this.renderWaveform();
        this.renderer.render(this.scene, this.cam);
    },

    renderWaveform() {
        const canvas = document.getElementById('master-waveform');
        const ctx = canvas.getContext('2d');
        
        // Match Internal resolution to Display CSS Size properly
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
        }

        const data = this.analyser.getValue();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        
        for(let i = 0; i < data.length; i++) {
            const x = (i / data.length) * canvas.width;
            const y = ((data[i] + 1) / 2) * canvas.height;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
};

// Application Triggers
document.getElementById('btn-start').onclick = () => GyrOS.init();
document.getElementById('btn-record').onclick = function() {
    if (!GyrOS.state.isRecording) {
        GyrOS.recorder.start();
        this.classList.add('recording-active');
        this.innerText = "■ STOP";
    } else {
        GyrOS.recorder.stop();
        this.classList.remove('recording-active');
        this.innerText = "● REC";
    }
    GyrOS.state.isRecording = !GyrOS.state.isRecording;
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Gyr-OS | Master Utility</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <style>
        :root {
            --glass-bg: rgba(15, 15, 20, 0.9);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-neon: #00ffcc;
            --error-red: #ff4444;
            --text-main: #e0e0e0;
        }

        body, html { margin: 0; padding: 0; overflow: hidden; background: #050505; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* UI Overlay */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            z-index: 10;
            position: absolute;
        }

        #bottom-hud { bottom: 0; left: 0; width: 100vw; height: 18vh; display: flex; flex-direction: column; align-items: center; justify-content: space-around; }
        #master-waveform { width: 100vw; height: 5vh; border-top: 1px solid var(--accent-neon); }
        
        .mode-btn { padding: 8px 12px; background: transparent; border: 1px solid var(--accent-neon); color: var(--accent-neon); border-radius: 4px; cursor: pointer; font-size: 10px; transition: 0.3s; }
        .mode-btn.active { background: var(--accent-neon); color: #000; box-shadow: 0 0 15px var(--accent-neon); }
        .recording-active { background: var(--error-red) !important; color: white !important; animation: blink 1s infinite; border-color: var(--error-red) !important; }

        @keyframes blink { 50% { opacity: 0.5; } }

        #init-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #btn-start { padding: 20px 40px; font-size: 1.5rem; background: var(--accent-neon); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        #btn-start:hover { background: #00ccaa; }
        #error-msg { color: var(--error-red); margin-top: 20px; font-family: monospace; font-size: 1.2rem; min-height: 1.5rem; padding: 0 20px;}
    </style>
</head>
<body>

<div id="init-overlay">
    <h1 style="color: var(--accent-neon); letter-spacing: 8px;">GYR-OS</h1>
    <p style="color: #666; margin-bottom: 20px;">SPATIAL AUDIO UTILITY V1.2</p>
    <button id="btn-start">INITIALIZE ENGINE</button>
    <div id="error-msg"></div>
</div>

<div id="canvas-container"></div>

<div id="bottom-hud" class="glass-panel">
    <div id="readout" style="font-family: monospace; font-size: 12px; color: var(--accent-neon);">SYSTEM STANDBY</div>
    <div style="display: flex; gap: 5px;" id="mode-controls">
        <button class="mode-btn active" data-mode="1">1: THEREMIN</button>
        <button class="mode-btn" data-mode="2">2: IMPACT</button>
        <button class="mode-btn" data-mode="3">3: HYBRID</button>
        <button class="mode-btn" data-mode="5">5: COMPOSER</button>
        <button id="btn-record" class="mode-btn" style="border-color: #ff4444; color: #ff4444;">● REC</button>
    </div>
    <canvas id="master-waveform"></canvas>
</div>
    
<script type="importmap">
    { "imports": { 
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js"
    } }
</script>

<script type="module">
    import * as THREE from 'three';
    import * as Tone from 'https://esm.sh/tone';

// Simple math map function (replaces deprecated Tone.map)
const mapRange = (value, inMin, inMax, outMin, outMax) => {
    return ((value - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;
};

/**
 * THE GYR-OS MASTER OBJECT
 */
const GyrOS = {
    state: {
        mode: 1, sensitivity: 25, threshold: 15, 
        gyro: { x: 0, y: 0, z: 0 },
        osc: { sine: true, sawtooth: false, square: false, triangle: false },
        isRecording: false
    },

    async init() {
        const errorDiv = document.getElementById('error-msg');
        const startBtn = document.getElementById('btn-start');
        
        try {
            errorDiv.innerText = "Requesting permissions...";
            startBtn.disabled = true;

            // 1. Audio and Permissions
            await Tone.start();
            await this.detectSensors();

            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); } catch(e) { console.warn("Wake lock denied."); }
            }
            
            // 2. Subsystem Ignition
            this.initAudio();
            this.initVisuals();
            this.initSensors();
            this.initSpeech();
            this.initRecorder();
            this.initGUI();

            document.getElementById('init-overlay').style.display = 'none';
            document.getElementById('readout').innerText = "SYSTEM ACTIVE // GYRO LINKED";
            
            this.bindEvents();
            this.loop();
        } catch (error) {
            startBtn.disabled = false;
            errorDiv.innerText = error.message || "Initialization failed.";
            console.error(error);
        }
    },

    async detectSensors() {
        if (!window.DeviceOrientationEvent) {
            throw new Error("No Gyroscope detected on system");
        }

        // Request permission on modern iOS for Orientation
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            const permissionState = await DeviceOrientationEvent.requestPermission();
            if (permissionState !== 'granted') throw new Error("Gyroscope permission denied.");
        }
        
        // Request permission on modern iOS for Motion
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            const motionState = await DeviceMotionEvent.requestPermission();
            if (motionState !== 'granted') throw new Error("Motion permission denied.");
        }

        // Validate actual sensor hardware presence using a timeout logic
        return new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
                window.removeEventListener('deviceorientation', checkGyro);
                reject(new Error("No Gyroscope detected on system"));
            }, 2000);

            const checkGyro = (event) => {
                if (event.alpha !== null && event.beta !== null && event.gamma !== null) {
                    clearTimeout(timeout);
                    window.removeEventListener('deviceorientation', checkGyro);
                    resolve();
                }
            };
            window.addEventListener('deviceorientation', checkGyro);
        });
    },

    initAudio() {
        this.analyser = new Tone.Analyser("waveform", 1024);
        
        // Master Volume Bus
        this.masterBus = new Tone.Volume(0).toDestination();
        this.masterBus.connect(this.analyser);

        // Rack Effects (Freeverb is lighter for mobile than Reverb)
        this.rack = {
            reverb: new Tone.Freeverb({ roomSize: 0.8, dampening: 2000 }).connect(this.masterBus),
            delay: new Tone.FeedbackDelay("8n", 0.3).connect(this.masterBus)
        };
        this.rack.reverb.wet.value = 0.3;
        this.rack.delay.wet.value = 0.2;

        this.synths = {
            poly: new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: { attack: 0.01, decay: 0.2, sustain: 0.2, release: 1 }
            }).connect(this.rack.delay).connect(this.masterBus),
            
            theremin: new Tone.Oscillator(440, "sine").connect(this.rack.reverb).connect(this.masterBus)
        };
        this.drums = { kick: new Tone.MembraneSynth().connect(this.masterBus) };
    },

    initVisuals() {
        this.scene = new THREE.Scene();
        this.cam = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(this.renderer.domElement);
        
        this.cursor = new THREE.Mesh(
            new THREE.IcosahedronGeometry(0.6, 0), 
            new THREE.MeshPhongMaterial({ color: 0x00ffcc, wireframe: true })
        );
        this.scene.add(this.cursor);
        this.scene.add(new THREE.GridHelper(100, 50, 0x222222, 0x111111));
        this.cam.position.z = 12;
        
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 10, 10);
        this.scene.add(light);
    },

    initSensors() {
        window.addEventListener("deviceorientation", e => {
            this.state.gyro = { x: e.beta || 0, y: e.gamma || 0, z: e.alpha || 0 };
        });
        
        window.addEventListener("devicemotion", e => {
            let a = e.acceleration;
            // Fallback for some Android versions
            if (!a || a.x === null) a = e.accelerationIncludingGravity;
            if (!a || a.x === null) return;
            
            const force = Math.sqrt(a.x**2 + a.y**2 + a.z**2);
            // Ignore resting gravity if using fallback (~9.8)
            if (force > this.state.threshold && force > 10) {
                this.handleThrust(force);
            }
        });
    },

    handleThrust(force) {
        const now = Tone.now();
        // Debounce to prevent multiple triggers per single natural swing
        if (this.lastThrust && (now - this.lastThrust) < 0.15) return;
        this.lastThrust = now;

        if (navigator.vibrate) navigator.vibrate(30);
        
        // Visual Pop based on force
        const scaleBump = 1 + Math.min(force / 15, 3);
        this.cursor.scale.set(scaleBump, scaleBump, scaleBump);
        setTimeout(() => this.cursor.scale.set(1, 1, 1), 150);

        // IMPACT & HYBRID MODE: Play notes based on swing force & phone angle
        if (this.state.mode === 2 || this.state.mode === 3) {
            const scale = ["C3", "D3", "E3", "G3", "A3", "C4", "D4", "E4", "G4", "A4", "C5", "D5", "E5", "G5", "A5"];
            let index = Math.floor(mapRange(this.state.gyro.x, -90, 90, 0, scale.length - 1));
            index = Math.max(0, Math.min(scale.length - 1, index));
            
            const velocity = Math.min(1, force / 40);
            
            this.synths.poly.triggerAttackRelease(scale[index], "8n", now, velocity);
            this.drums.kick.triggerAttackRelease("C1", "16n", now, velocity * 0.8);
        }
    },

    initSpeech() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Speech) {
            try {
                this.recognition = new Speech();
                this.recognition.continuous = true;
                this.recognition.onresult = (e) => {
                    const text = e.results[e.results.length-1][0].transcript.toLowerCase();
                    if (text.includes("spawn")) this.spawnOrb();
                };
                this.recognition.start();
            } catch (err) {
                console.warn("Speech engine initialization failed.", err);
            }
        }
    },

    spawnOrb() {
        const orb = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 8, 8), 
            new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true })
        );
        orb.position.copy(this.cursor.position);
        this.scene.add(orb);
    },

    initRecorder() {
        this.streamDest = Tone.context.createMediaStreamDestination();
        this.masterBus.connect(this.streamDest);
        
        let mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
        this.recorder = new MediaRecorder(this.streamDest.stream, { mimeType });
        this.chunks = [];
        
        this.recorder.ondataavailable = e => { if (e.data.size > 0) this.chunks.push(e.data); };
        this.recorder.onstop = () => {
            const blob = new Blob(this.chunks, { type: mimeType });
            this.chunks = [];
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `GyrOS_Rec_${Date.now()}.${mimeType.split('/')[1]}`;
            a.click();
        };
    },

    initGUI() {
        const gui = new dat.GUI();
        gui.add(this.state, 'threshold', 5, 50).name("Impact Thresh");
        gui.add(this.state, 'sensitivity', 1, 50).name("Visual Scale");
        const osc = gui.addFolder('Oscillators');
        ['sine', 'sawtooth', 'square', 'triangle'].forEach(t => {
            osc.add(this.state.osc, t).listen().onChange(() => this.updateOsc(t));
        });
    },

    updateOsc(type) {
        Object.keys(this.state.osc).forEach(k => this.state.osc[k] = (k === type));
        this.synths.theremin.type = type;
        this.synths.poly.set({ oscillator: { type: type } });
    },

    bindEvents() {
        window.addEventListener('resize', () => {
            this.cam.aspect = window.innerWidth / window.innerHeight;
            this.cam.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn[data-mode]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                this.state.mode = parseInt(e.target.getAttribute('data-mode'));
            });
        });
    },

    loop() {
        requestAnimationFrame(() => this.loop());
        const { gyro, sensitivity, mode } = this.state;
        const now = Tone.now();

        // 1. Visuals Interaction Interpolation
        const targetX = mapRange(gyro.y, -90, 90, -10 * (sensitivity/25), 10 * (sensitivity/25));
        const targetY = mapRange(gyro.x, -90, 90, -10 * (sensitivity/25), 10 * (sensitivity/25));
        this.cursor.position.x += (targetX - this.cursor.position.x) * 0.1;
        this.cursor.position.y += (targetY - this.cursor.position.y) * 0.1;
        this.cursor.rotation.x += 0.01;
        this.cursor.rotation.y += 0.02;

        // 2. Audio Theremin Logic (Modes 1 and 3)
        if (mode === 1 || mode === 3) {
            // Pitch mapped to Beta (Tilt Forward/Back)
            let freq = mapRange(gyro.x, -90, 90, 100, 1500);
            freq = Math.max(50, Math.min(2000, freq)); // Safety clamp
            
            // Volume mapped to Gamma (Tilt Left/Right)
            let vol = mapRange(gyro.y, -90, 90, -40, 0);
            vol = Math.max(-60, Math.min(0, vol));

            // setTargetAtTime sweeps perfectly without clicks!
            this.synths.theremin.frequency.setTargetAtTime(freq, now, 0.05);
            this.synths.theremin.volume.setTargetAtTime(vol, now, 0.05);

            if (this.synths.theremin.state !== 'started') {
                this.synths.theremin.start();
            }
        } else {
            this.synths.theremin.stop();
        }

        // 3. Composer Mode (Mode 5) Arpeggiator
        if (mode === 5) {
            if (!this.lastArp || now - this.lastArp > 0.15) { // Roughly 16th notes
                this.lastArp = now;
                const scale = ["C3", "E3", "G3", "B3", "C4", "E4", "G4", "B4", "C5"];
                let index = Math.floor(mapRange(gyro.x, -90, 90, 0, scale.length - 1));
                index = Math.max(0, Math.min(scale.length - 1, index));
                this.synths.poly.triggerAttackRelease(scale[index], "16n");
            }
        }

        this.renderWaveform();
        this.renderer.render(this.scene, this.cam);
    },

    renderWaveform() {
        const canvas = document.getElementById('master-waveform');
        const ctx = canvas.getContext('2d');
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        
        if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
        }

        const data = this.analyser.getValue();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        
        for(let i = 0; i < data.length; i++) {
            const x = (i / data.length) * canvas.width;
            const y = ((data[i] + 1) / 2) * canvas.height;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
};

// Application Triggers
document.getElementById('btn-start').onclick = () => GyrOS.init();
document.getElementById('btn-record').onclick = function() {
    if (!GyrOS.state.isRecording) {
        GyrOS.recorder.start();
        this.classList.add('recording-active');
        this.innerText = "■ STOP";
    } else {
        GyrOS.recorder.stop();
        this.classList.remove('recording-active');
        this.innerText = "● REC";
    }
    GyrOS.state.isRecording = !GyrOS.state.isRecording;
};
</script>
</body>
</html>

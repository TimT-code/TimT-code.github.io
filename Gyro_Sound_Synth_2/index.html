<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Gyr-OS | Master Utility V2.0</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <style>
        :root {
            --glass-bg: rgba(10, 10, 15, 0.85);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-neon: #00ffcc;
            --error-red: #ff4444;
            --warning-orange: #ffaa00;
        }

        body, html { margin: 0; padding: 0; overflow: hidden; background: #020202; font-family: sans-serif; color: white; }
        
        /* ThreeJS Canvas */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* Grid Playfield Overlay */
        #grid-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: grid; z-index: 2; pointer-events: none;
            border: 1px solid transparent;
        }
        .grid-cell {
            border: 1px solid rgba(255,255,255,0.05); transition: background 0.1s;
        }
        .grid-cell.active { background: rgba(0, 255, 204, 0.3); border-color: var(--accent-neon); }

        /* GUI Wrappers (3 Zones) */
        .gui-wrap { position: absolute; top: 10px; z-index: 100; pointer-events: auto; }
        #gui-left { left: 10px; }
        #gui-center { left: 50%; transform: translateX(-50%); }
        #gui-right { right: 10px; }

        /* Live Data Dashboard */
        #live-dashboard {
            position: absolute; top: 10px; left: 10px; margin-top: 300px;
            background: var(--glass-bg); padding: 10px; border: 1px solid var(--glass-border);
            border-radius: 8px; font-family: monospace; font-size: 11px; z-index: 50;
            pointer-events: none; color: var(--accent-neon);
        }

        /* Bottom HUD */
        #bottom-hud {
            position: absolute; bottom: 0; left: 0; width: 100vw; height: 15vh;
            background: var(--glass-bg); backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border); z-index: 50;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }

        .hud-controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        .mode-btn {
            padding: 6px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--accent-neon);
            color: var(--accent-neon); border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold;
        }
        .mode-btn.active { background: var(--accent-neon); color: #000; box-shadow: 0 0 10px var(--accent-neon); }
        #master-waveform { width: 100vw; height: 50%; background: rgba(0,0,0,0.3); }

        /* Drop Zone */
        #drop-zone-indicator {
            position: fixed; inset: 0; background: rgba(0, 255, 204, 0.2); border: 5px dashed var(--accent-neon);
            z-index: 999; display: none; justify-content: center; align-items: center; pointer-events: none;
        }

        /* Initializer */
        #init-overlay {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        #btn-start { padding: 20px 40px; font-size: 1.5rem; background: var(--accent-neon); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="init-overlay">
    <h1 style="color: var(--accent-neon); letter-spacing: 5px;">GYR-OS V2.0</h1>
    <p>SPATIAL AUDIO & MULTI-OSC UTILITY</p>
    <button id="btn-start">INITIALIZE ENGINE</button>
    <div id="error-msg" style="color: var(--error-red); margin-top: 15px;"></div>
</div>

<div id="drop-zone-indicator"><h2>DROP AUDIO FILE HERE</h2></div>

<!-- 3 GUI Containers -->
<div class="gui-wrap" id="gui-left"></div>
<div class="gui-wrap" id="gui-center"></div>
<div class="gui-wrap" id="gui-right"></div>

<!-- Data Dashboard -->
<div id="live-dashboard">
    <div>X (Gamma): <span id="rd-x">0</span></div>
    <div>Y (Beta) : <span id="rd-y">0</span></div>
    <div>Freq     : <span id="rd-f">0</span> Hz</div>
    <div>Vol      : <span id="rd-v">0</span> dB</div>
    <div>Cell Aim : <span id="rd-c">None</span></div>
</div>

<div id="canvas-container"></div>
<div id="grid-overlay"></div>

<div id="bottom-hud">
    <div class="hud-controls">
        <button class="mode-btn active" data-mode="1">1: THEREMIN</button>
        <button class="mode-btn" data-mode="2">2: IMPACT GRID</button>
        <button class="mode-btn" data-mode="5">5: ARPEGGIATOR</button>
        <button id="btn-panic" class="mode-btn" style="border-color: var(--warning-orange); color: var(--warning-orange);">■ MUTE/PANIC</button>
        <button id="btn-record" class="mode-btn" style="border-color: var(--error-red); color: var(--error-red);">● REC</button>
    </div>
    <canvas id="master-waveform"></canvas>
</div>

<script type="importmap">
    { "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import * as Tone from 'https://esm.sh/tone';

const mapRange = (val, inMin, inMax, outMin, outMax) => ((val - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;

const GyrOS = {
    state: {
        mode: 1, hasGyro: false,
        gyro: { x: 0, y: 0, z: 0 },
        touchOffset: { freq: 1, vol: 0 }, // Touch interaction offsets
        
        // System / Left GUI
        sys: { threshold: 15, sensitivity: 30, fineControl: false },
        
        // Config / Center GUI
        cfg: { gridCols: 4, gridRows: 3, showGrid: true, decimals: 1, uiColor: '#00ffcc' },
        
        // Sound / Right GUI
        snd: { 
            scale: 'major', root: 'C', octave: 3, pitchBend: 0,
            osc1: 'sine', osc2: 'sawtooth', oscMix: 0.5,
            eqHigh: 0, eqMid: 0, eqLow: 0,
            reverb: 0.3, delay: 0.2, masterVol: -5,
            speechText: "Gyro Spatial System Active", speechRate: 1.0, speechPitch: 1.0
        },
        
        scaleNotes: [], activeCellIdx: -1, isRecording: false
    },

    async init() {
        try {
            document.getElementById('error-msg').innerText = "Requesting permissions...";
            await Tone.start();
            
            try { await this.detectSensors(); this.state.hasGyro = true; } 
            catch(e) { console.warn(e); this.state.hasGyro = false; }

            this.initAudio();
            this.initVisuals();
            this.initSensors();
            this.initGrid();
            this.initGUIs();
            this.initDragAndDrop();
            this.bindEvents();
            this.updateScale();

            document.getElementById('init-overlay').style.display = 'none';
            this.loop();
        } catch(err) {
            document.getElementById('error-msg').innerText = "Failed: " + err.message;
        }
    },

    async detectSensors() {
        if (!window.DeviceOrientationEvent) throw new Error("No hardware");
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            const p = await DeviceOrientationEvent.requestPermission();
            if (p !== 'granted') throw new Error("Permission denied");
        }
        return new Promise((res, rej) => {
            const t = setTimeout(() => { window.removeEventListener('deviceorientation', check); rej(); }, 1000);
            const check = (e) => { if (e.alpha !== null) { clearTimeout(t); res(); } };
            window.addEventListener('deviceorientation', check);
        });
    },

    initAudio() {
        this.analyser = new Tone.Analyser("waveform", 1024);
        
        // Master Bus + EQ
        this.eq = new Tone.EQ3(this.state.snd.eqLow, this.state.snd.eqMid, this.state.snd.eqHigh);
        this.masterVol = new Tone.Volume(this.state.snd.masterVol).toDestination();
        this.eq.connect(this.masterVol);
        this.masterVol.connect(this.analyser);

        // Effects Rack
        this.rack = {
            reverb: new Tone.Freeverb({ roomSize: 0.8 }).connect(this.eq),
            delay: new Tone.FeedbackDelay("8n", 0.3).connect(this.eq)
        };
        this.rack.reverb.wet.value = this.state.snd.reverb;
        this.rack.delay.wet.value = this.state.snd.delay;

        // Multi-Oscillator Synths for Playfield/Grid
        this.synths = {
            osc1: new Tone.PolySynth(Tone.Synth).connect(this.rack.delay),
            osc2: new Tone.PolySynth(Tone.Synth).connect(this.rack.delay),
            theremin: new Tone.Oscillator(440, "sine").start()
        };
        
        this.synths.osc1.set({ oscillator: { type: this.state.snd.osc1 }});
        this.synths.osc2.set({ oscillator: { type: this.state.snd.osc2 }, volume: -6 });

        // Theremin Volume Gate
        this.thereminVol = new Tone.Volume(-Infinity).connect(this.rack.reverb);
        this.synths.theremin.connect(this.thereminVol);

        // Custom File Sampler
        this.customPlayer = new Tone.Player().connect(this.rack.reverb);
        
        // Speech Synth
        this.synthSpeech = window.speechSynthesis;
    },

    initVisuals() {
        this.scene = new THREE.Scene();
        this.cam = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(this.renderer.domElement);

        // The Original Gyro Pointer Style
        this.pointer = new THREE.Mesh(
            new THREE.SphereGeometry(0.8, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true })
        );
        this.scene.add(this.pointer);
        
        const grid = new THREE.GridHelper(100, 50, 0x222222, 0x111111);
        grid.rotation.x = Math.PI / 2;
        grid.position.z = -5;
        this.scene.add(grid);

        this.cam.position.z = 10;
    },

    initGrid() {
        const overlay = document.getElementById('grid-overlay');
        overlay.innerHTML = '';
        overlay.style.gridTemplateColumns = `repeat(${this.state.cfg.gridCols}, 1fr)`;
        overlay.style.gridTemplateRows = `repeat(${this.state.cfg.gridRows}, 1fr)`;
        overlay.style.opacity = this.state.cfg.showGrid ? "1" : "0";

        const total = this.state.cfg.gridCols * this.state.cfg.gridRows;
        for(let i=0; i<total; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.id = `cell-${i}`;
            overlay.appendChild(cell);
        }
        this.updateScale();
    },

    updateScale() {
        const { root, octave, scale, gridCols, gridRows } = this.state.snd;
        const total = gridCols * gridRows;
        // Generate Tonal.js scale
        const s = Tonal.Scale.get(`${root} ${scale}`).notes;
        let notes = [];
        let currOct = parseInt(octave);
        
        for (let i = 0; i < total; i++) {
            let noteStr = s[i % s.length] + currOct;
            notes.push(noteStr);
            if ((i + 1) % s.length === 0) currOct++;
        }
        this.state.scaleNotes = notes;
    },

    initSensors() {
        if(this.state.hasGyro) {
            window.addEventListener("deviceorientation", e => {
                this.state.gyro = { x: e.gamma || 0, y: e.beta || 0 }; // Gamma is X (Left/Right), Beta is Y (Front/Back)
            });
            window.addEventListener("devicemotion", e => {
                let a = e.acceleration || e.accelerationIncludingGravity;
                if (!a || a.x === null) return;
                const force = Math.sqrt(a.x**2 + a.y**2 + a.z**2);
                if (force > this.state.sys.threshold && force > 10) this.triggerImpact(force);
            });
        }
    },

    initDragAndDrop() {
        const dropZone = document.getElementById('drop-zone-indicator');
        window.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.display = 'flex'; });
        window.addEventListener('dragleave', e => { e.preventDefault(); dropZone.style.display = 'none'; });
        window.addEventListener('drop', async e => {
            e.preventDefault();
            dropZone.style.display = 'none';
            const file = e.dataTransfer.files[0];
            if(file && file.type.includes('audio')) {
                const url = URL.createObjectURL(file);
                await this.customPlayer.load(url);
                document.getElementById('rd-c').innerText = `Loaded: ${file.name}`;
            }
        });
    },

    triggerImpact(force = 30) {
        if(this.state.mode !== 2 && this.state.mode !== 5) return;
        const now = Tone.now();
        if (this.lastHit && (now - this.lastHit) < 0.1) return;
        this.lastHit = now;

        const vol = Math.min(1, force / 40);
        const idx = this.state.activeCellIdx;
        
        // Play Audio file if loaded
        if (this.customPlayer.loaded) this.customPlayer.start(now);
        
        // Play mapped Synth Note
        if (idx >= 0 && idx < this.state.scaleNotes.length) {
            const note = this.state.scaleNotes[idx];
            this.synths.osc1.triggerAttackRelease(note, "8n", now, vol);
            this.synths.osc2.triggerAttackRelease(note, "8n", now, vol * this.state.snd.oscMix);
        }

        // Visual feedback
        this.pointer.scale.set(1.5, 1.5, 1.5);
        setTimeout(() => this.pointer.scale.set(1, 1, 1), 100);
    },

    triggerSpeech() {
        const u = new SpeechSynthesisUtterance(this.state.snd.speechText);
        u.rate = this.state.snd.speechRate;
        u.pitch = this.state.snd.speechPitch;
        this.synthSpeech.speak(u);
    },

    initGUIs() {
        // 1. SYSTEM GUI (Left)
        this.guiSys = new dat.GUI({ autoPlace: false, width: 220 });
        document.getElementById('gui-left').appendChild(this.guiSys.domElement);
        const fSys = this.guiSys.addFolder('System Settings');
        fSys.add(this.state.sys, 'threshold', 5, 50).name('Hit Thresh');
        fSys.add(this.state.sys, 'sensitivity', 10, 90).name('Gyro Scale');
        fSys.add(this.state.sys, 'fineControl').name('Fine Tuning');
        fSys.open();

        // 2. CONFIG GUI (Center)
        this.guiCfg = new dat.GUI({ autoPlace: false, width: 220 });
        document.getElementById('gui-center').appendChild(this.guiCfg.domElement);
        const fCfg = this.guiCfg.addFolder('Playfield & HUD');
        fCfg.add(this.state.cfg, 'gridCols', 1, 16).step(1).name('Grid Columns').onChange(() => this.initGrid());
        fCfg.add(this.state.cfg, 'gridRows', 1, 16).step(1).name('Grid Rows').onChange(() => this.initGrid());
        fCfg.add(this.state.cfg, 'showGrid').name('Visible Grid').onChange(() => this.initGrid());
        fCfg.add(this.state.cfg, 'decimals', 0, 4).step(1).name('Data Precision');
        fCfg.addColor(this.state.cfg, 'uiColor').name('UI Accent').onChange(c => document.documentElement.style.setProperty('--accent-neon', c));
        
        // 3. SOUND GUI (Right)
        this.guiSnd = new dat.GUI({ autoPlace: false, width: 260 });
        document.getElementById('gui-right').appendChild(this.guiSnd.domElement);
        
        const fMix = this.guiSnd.addFolder('Master Mixer');
        fMix.add(this.state.snd, 'masterVol', -60, 10).name('Master Vol').onChange(v => this.masterVol.volume.value = v);
        fMix.add(this.state.snd, 'eqLow', -10, 10).name('EQ Low').onChange(v => this.eq.low.value = v);
        fMix.add(this.state.snd, 'eqMid', -10, 10).name('EQ Mid').onChange(v => this.eq.mid.value = v);
        fMix.add(this.state.snd, 'eqHigh', -10, 10).name('EQ High').onChange(v => this.eq.high.value = v);
        fMix.add(this.state.snd, 'reverb', 0, 1).name('Reverb Mix').onChange(v => this.rack.reverb.wet.value = v);
        fMix.add(this.state.snd, 'delay', 0, 1).name('Delay Mix').onChange(v => this.rack.delay.wet.value = v);

        const fMsc = this.guiSnd.addFolder('Oscillators & Scale');
        fMsc.add(this.state.snd, 'osc1', ['sine', 'sawtooth', 'square', 'triangle']).onChange(v => this.synths.osc1.set({ oscillator: { type: v }}));
        fMsc.add(this.state.snd, 'osc2', ['sine', 'sawtooth', 'square', 'triangle']).onChange(v => this.synths.osc2.set({ oscillator: { type: v }}));
        fMsc.add(this.state.snd, 'scale', ['major', 'minor', 'pentatonic', 'chromatic', 'blues']).onChange(() => this.updateScale());
        fMsc.add(this.state.snd, 'root', ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']).onChange(() => this.updateScale());
        fMsc.add(this.state.snd, 'octave', 1, 6).step(1).onChange(() => this.updateScale());
        fMsc.add(this.state.snd, 'pitchBend', -1200, 1200).name('Pitch Bend(c)').onChange(v => this.synths.theremin.detune.value = v);

        const fSpk = this.guiSnd.addFolder('Web Speech API');
        fSpk.add(this.state.snd, 'speechText').name('Text');
        fSpk.add(this.state.snd, 'speechRate', 0.1, 3).name('Rate');
        fSpk.add(this.state.snd, 'speechPitch', 0.1, 2).name('Pitch');
        fSpk.add(this, 'triggerSpeech').name('► Speak Text');
    },

    bindEvents() {
        // Mode switch
        document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn[data-mode]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                this.state.mode = parseInt(e.target.getAttribute('data-mode'));
            });
        });

        // Touch for Theremin Offset & Desktop Mouse fallback
        const updateTouch = (e) => {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            
            // Map touch to frequency multiplier (0.5x to 2.0x) and Volume Offset
            this.state.touchOffset.freq = mapRange(y, window.innerHeight, 0, 0.5, 2.0);
            this.state.touchOffset.vol = mapRange(x, 0, window.innerWidth, -10, 10);
            
            // Manual Trigger for Desktop
            if(!this.state.hasGyro && e.type === 'mousedown') this.triggerImpact(30);
        };
        const resetTouch = () => { this.state.touchOffset = { freq: 1, vol: 0 }; };

        window.addEventListener('mousemove', updateTouch);
        window.addEventListener('touchmove', updateTouch);
        window.addEventListener('mousedown', updateTouch);
        window.addEventListener('touchstart', updateTouch);
        window.addEventListener('touchend', resetTouch);
        window.addEventListener('mouseup', resetTouch);

        // Panic
        document.getElementById('btn-panic').onclick = () => {
            Tone.Transport.stop();
            this.synths.osc1.releaseAll();
            this.synths.osc2.releaseAll();
            this.thereminVol.volume.rampTo(-Infinity, 0.05);
            this.state.mode = 0;
            document.querySelectorAll('.mode-btn[data-mode]').forEach(b => b.classList.remove('active'));
        };
    },

    loop() {
        requestAnimationFrame(() => this.loop());
        const { gyro, sys, cfg, mode, touchOffset } = this.state;
        const now = Tone.now();
        const dec = cfg.decimals;

        // Visual Pointer Calculation (Mapped to screen bounds)
        // Gamma (X) goes roughly -90 to 90. Beta (Y) goes -90 to 90.
        let normX = Math.max(-1, Math.min(1, gyro.x / sys.sensitivity));
        let normY = Math.max(-1, Math.min(1, gyro.y / sys.sensitivity));

        // Coarse/Fine tuning
        if (sys.fineControl) { normX *= 0.2; normY *= 0.2; }

        this.pointer.position.x = normX * 8; // Screen spread
        this.pointer.position.y = normY * 5;

        // Grid Cell Collision Logic
        let gridX = Math.floor(mapRange(normX, -1, 1, 0, cfg.gridCols));
        let gridY = Math.floor(mapRange(normY, 1, -1, 0, cfg.gridRows)); // Invert Y for screen space
        gridX = Math.max(0, Math.min(cfg.gridCols - 1, gridX));
        gridY = Math.max(0, Math.min(cfg.gridRows - 1, gridY));
        
        let newActiveCell = gridY * cfg.gridCols + gridX;

        // Update Grid Visuals
        if (newActiveCell !== this.state.activeCellIdx) {
            if (this.state.activeCellIdx !== -1) {
                const old = document.getElementById(`cell-${this.state.activeCellIdx}`);
                if (old) old.classList.remove('active');
            }
            const cur = document.getElementById(`cell-${newActiveCell}`);
            if (cur) cur.classList.add('active');
            this.state.activeCellIdx = newActiveCell;

            // Arpeggiator Trigger (Mode 5)
            if (mode === 5) this.triggerImpact(20); 
        }

        // Theremin Logic
        let tFreq = 0, tVol = -Infinity;
        if (mode === 1) {
            tFreq = mapRange(normY, -1, 1, 100, 1500) * touchOffset.freq;
            tFreq = Math.max(20, Math.min(3000, tFreq));
            
            tVol = mapRange(normX, -1, 1, -40, 0) + touchOffset.vol;
            tVol = Math.max(-60, Math.min(10, tVol));

            this.synths.theremin.frequency.setTargetAtTime(tFreq, now, 0.05);
            this.thereminVol.volume.setTargetAtTime(tVol, now, 0.05);
        } else {
            this.thereminVol.volume.setTargetAtTime(-Infinity, now, 0.1);
        }

        // Live Dashboard Update
        document.getElementById('rd-x').innerText = gyro.x.toFixed(dec);
        document.getElementById('rd-y').innerText = gyro.y.toFixed(dec);
        document.getElementById('rd-f').innerText = mode === 1 ? tFreq.toFixed(dec) : "---";
        document.getElementById('rd-v').innerText = mode === 1 ? tVol.toFixed(dec) : "---";
        document.getElementById('rd-c').innerText = this.state.scaleNotes[this.state.activeCellIdx] || "None";

        this.renderWaveform();
        this.renderer.render(this.scene, this.cam);
    },

    renderWaveform() {
        const cvs = document.getElementById('master-waveform');
        const ctx = cvs.getContext('2d');
        if (cvs.width !== cvs.clientWidth) { cvs.width = cvs.clientWidth; cvs.height = cvs.clientHeight; }
        
        const data = this.analyser.getValue();
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        ctx.beginPath();
        ctx.strokeStyle = this.state.cfg.uiColor;
        ctx.lineWidth = 2;
        for(let i=0; i<data.length; i++) {
            const x = (i/data.length) * cvs.width;
            const y = ((data[i]+1)/2) * cvs.height;
            i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        }
        ctx.stroke();
    }
};

document.getElementById('btn-start').onclick = () => GyrOS.init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Gyr-OS | Master Workstation V3.0</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <style>
        :root { --accent-neon: #00ffcc; --glass-bg: rgba(10, 10, 15, 0.85); }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #020202; font-family: sans-serif; color: white; user-select: none; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }

        /* 3D Grid Overlay */
        #grid-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: grid; z-index: 2; border: 1px solid transparent;
            perspective: 1000px; transition: transform 0.1s ease-out;
        }
        .grid-cell {
            border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s;
            background-size: cover; background-position: center;
            display: flex; align-items: flex-end; justify-content: flex-end; padding: 5px;
            box-sizing: border-box; font-family: monospace; font-size: 10px; color: rgba(255,255,255,0.5);
        }
        .grid-cell.active { border-color: var(--accent-neon); box-shadow: inset 0 0 20px var(--accent-neon); transform: translateZ(20px); z-index: 3; color: white; background-color: rgba(0,255,204,0.2); }
        .grid-cell.has-audio::before { content: '🎵'; position: absolute; top: 5px; left: 5px; font-size: 12px; }

        /* Draggable GUIs */
        .gui-window { position: absolute; z-index: 100; background: rgba(0,0,0,0.8); border: 1px solid var(--accent-neon); border-radius: 6px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .gui-header { background: var(--accent-neon); color: black; padding: 4px 10px; font-size: 12px; font-weight: bold; cursor: move; display: flex; justify-content: space-between; }
        
        #gui-left { top: 20px; left: 20px; }
        #gui-center { top: 20px; left: 50%; transform: translateX(-50%); }
        #gui-right { top: 20px; right: 20px; }

        /* Dashboard */
        #live-dashboard { position: absolute; bottom: 18vh; left: 20px; background: var(--glass-bg); padding: 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; font-family: monospace; font-size: 11px; z-index: 50; pointer-events: none; color: var(--accent-neon); }

        /* HUD */
        #bottom-hud { position: absolute; bottom: 0; left: 0; width: 100vw; height: 15vh; background: var(--glass-bg); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.2); z-index: 50; display: flex; flex-direction: column; }
        .hud-controls { display: flex; gap: 5px; justify-content: center; padding: 10px; }
        .mode-btn { padding: 6px 10px; background: #111; border: 1px solid var(--accent-neon); color: var(--accent-neon); border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; }
        .mode-btn.active { background: var(--accent-neon); color: #000; box-shadow: 0 0 10px var(--accent-neon); }
        #master-waveform { width: 100%; height: 100%; }

        /* Init */
        #init-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #btn-start { padding: 20px 40px; font-size: 1.5rem; background: var(--accent-neon); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="init-overlay">
    <h1 style="color: var(--accent-neon); letter-spacing: 5px;">GYR-OS V3.0</h1>
    <p>WORKSTATION MATRIX ENGINE</p>
    <button id="btn-start">INITIALIZE ENGINE</button>
    <div id="error-msg" style="color: #ff4444; margin-top: 15px;"></div>
</div>

<!-- Draggable GUI Containers -->
<div class="gui-window" id="gui-left" style="transform: none;"><div class="gui-header"><span>SENSORS & SYSTEM</span><span class="gui-toggle">▼</span></div><div class="gui-content" id="gui-left-content"></div></div>
<div class="gui-window" id="gui-center" style="transform: none;"><div class="gui-header"><span>GRID & PRESETS (Keys 1-9)</span><span class="gui-toggle">▼</span></div><div class="gui-content" id="gui-center-content"></div></div>
<div class="gui-window" id="gui-right" style="transform: none;"><div class="gui-header"><span>AUDIO & MASTER FX</span><span class="gui-toggle">▼</span></div><div class="gui-content" id="gui-right-content"></div></div>

<div id="live-dashboard">
    <div>POS: <span id="rd-pos">0, 0</span></div>
    <div>ACC: <span id="rd-acc">0</span></div>
    <div>VIB: <span id="rd-vib">Ready</span></div>
    <div>AIM: <span id="rd-cell">None</span></div>
</div>

<div id="canvas-container"></div>
<div id="grid-overlay"></div>

<div id="bottom-hud">
    <div class="hud-controls">
        <button class="mode-btn active" data-mode="1">1: THEREMIN</button>
        <button class="mode-btn" data-mode="2">2: IMPACT</button>
        <button class="mode-btn" data-mode="3">3: HYBRID</button>
        <button class="mode-btn" data-mode="4">4: HOVER-SYNTH</button>
        <button class="mode-btn" data-mode="5">5: ARP</button>
        <button id="btn-panic" class="mode-btn" style="border-color: #ffaa00; color: #ffaa00;">■ PANIC</button>
        <button id="btn-reset-gui" class="mode-btn">⟳ RESET GUIs</button>
    </div>
    <canvas id="master-waveform"></canvas>
</div>

<script type="importmap">
    { "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import * as Tone from 'https://esm.sh/tone';

const mapRange = (val, inMin, inMax, outMin, outMax) => ((val - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;

const GyrOS = {
    state: {
        mode: 1, hasGyro: false,
        rawSensors: { x: 0, y: 0, z: 0, acc: 0 },
        pointer: { x: 0, y: 0 },
        activeCellIdx: -1, prevCellIdx: -1,
        
        // Mapped Config State (Saved to LocalStorage)
        cfg: {
            // Sensors
            sensInvertX: false, sensInvertY: false, sensSwapXY: false,
            gyroScale: 30, mouseScale: 1.5, mouseSmooth: 0.2, impactThresh: 15,
            vibActive: 30, vibRest: 10,
            
            // Grid
            gridCols: 4, gridRows: 3, showGrid: true, perspective: false,
            
            // Audio Engine
            masterVol: -5, eqLow: 0, eqMid: 0, eqHigh: 0, reverbMix: 0.3, delayMix: 0.2,
            synthType: 'AMSynth', scale: 'pentatonic', root: 'C', octave: 3,
            atk: 0.05, dec: 0.2, sus: 0.5, rel: 1.5,
            
            // Grid Cells Data Array
            cells: [] 
        }
    },

    async init() {
        try {
            document.getElementById('error-msg').innerText = "Requesting permissions...";
            await Tone.start();
            try { await this.detectSensors(); this.state.hasGyro = true; } catch(e) { this.state.hasGyro = false; }

            this.initAudio();
            this.initVisuals();
            this.loadPreset('default'); // Load base or saved state
            this.initGrid();
            this.initGUIs();
            this.makeGUIsDraggable();
            this.bindEvents();
            
            document.getElementById('init-overlay').style.display = 'none';
            this.loop();
        } catch(err) { document.getElementById('error-msg').innerText = "Failed: " + err.message; }
    },

    async detectSensors() {
        if (!window.DeviceOrientationEvent) throw new Error("No hardware");
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            const p = await DeviceOrientationEvent.requestPermission();
            if (p !== 'granted') throw new Error("Permission denied");
        }
        return new Promise((res, rej) => {
            const t = setTimeout(() => { window.removeEventListener('deviceorientation', check); rej(); }, 1000);
            const check = (e) => { if (e.alpha !== null) { clearTimeout(t); res(); } };
            window.addEventListener('deviceorientation', check);
        });
    },

    initAudio() {
        this.analyser = new Tone.Analyser("waveform", 1024);
        
        this.eq = new Tone.EQ3(this.state.cfg.eqLow, this.state.cfg.eqMid, this.state.cfg.eqHigh);
        this.masterVol = new Tone.Volume(this.state.cfg.masterVol).toDestination();
        this.eq.connect(this.masterVol);
        this.masterVol.connect(this.analyser);

        this.rack = {
            reverb: new Tone.Freeverb({ roomSize: 0.8 }).connect(this.eq),
            delay: new Tone.FeedbackDelay("8n", 0.3).connect(this.eq)
        };

        // Voice Pool for Grid
        this.polySynth = new Tone.PolySynth(Tone[this.state.cfg.synthType]).connect(this.rack.delay);
        this.theremin = new Tone.Oscillator(440, "sine").start();
        this.thereminVol = new Tone.Volume(-Infinity).connect(this.rack.reverb);
        this.theremin.connect(this.thereminVol);

        // Map for cell-specific audio players
        this.cellPlayers = new Map();
    },

    initVisuals() {
        this.scene = new THREE.Scene();
        this.cam = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(this.renderer.domElement);

        this.pointer = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true }));
        this.scene.add(this.pointer);
        
        this.gridHelper = new THREE.GridHelper(100, 50, 0x222222, 0x111111);
        this.gridHelper.rotation.x = Math.PI / 2;
        this.gridHelper.position.z = -5;
        this.scene.add(this.gridHelper);
        this.cam.position.z = 10;
    },

    initGrid() {
        const overlay = document.getElementById('grid-overlay');
        overlay.innerHTML = '';
        overlay.style.gridTemplateColumns = `repeat(${this.state.cfg.gridCols}, 1fr)`;
        overlay.style.gridTemplateRows = `repeat(${this.state.cfg.gridRows}, 1fr)`;
        overlay.style.opacity = this.state.cfg.showGrid ? "1" : "0";

        const total = this.state.cfg.gridCols * this.state.cfg.gridRows;
        
        // Ensure cells state array matches
        if (this.state.cfg.cells.length !== total) {
            this.state.cfg.cells = Array.from({length: total}, (_, i) => ({
                id: i, audioSrc: null, imageSrc: null, customNote: null
            }));
        }

        const s = Tonal.Scale.get(`${this.state.cfg.root} ${this.state.cfg.scale}`).notes;
        let currOct = parseInt(this.state.cfg.octave);

        for(let i=0; i<total; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.id = `cell-${i}`;
            
            // Assign default scale note
            let note = s[i % s.length] + currOct;
            if ((i + 1) % s.length === 0) currOct++;
            this.state.cfg.cells[i].defaultNote = note;
            
            cell.innerText = note;

            // Apply saved cell data (Images/Audio icons)
            const cData = this.state.cfg.cells[i];
            if (cData.imageSrc) cell.style.backgroundImage = `url(${cData.imageSrc})`;
            if (cData.audioSrc) cell.classList.add('has-audio');

            // Drag and Drop per cell
            cell.addEventListener('dragover', e => { e.preventDefault(); cell.style.background = 'rgba(0,255,204,0.5)'; });
            cell.addEventListener('dragleave', () => cell.style.background = '');
            cell.addEventListener('drop', async e => {
                e.preventDefault(); cell.style.background = '';
                const file = e.dataTransfer.files[0];
                if (!file) return;
                
                const url = URL.createObjectURL(file);
                if (file.type.startsWith('image/')) {
                    cData.imageSrc = url;
                    cell.style.backgroundImage = `url(${url})`;
                } else if (file.type.startsWith('audio/')) {
                    cData.audioSrc = url;
                    const player = new Tone.Player(url).connect(this.rack.delay);
                    await Tone.loaded();
                    this.cellPlayers.set(i, player);
                    cell.classList.add('has-audio');
                }
            });

            overlay.appendChild(cell);
        }
    },

    triggerCell(idx, force = 30) {
        if (idx < 0 || idx >= this.state.cfg.cells.length) return;
        const now = Tone.now();
        const vol = Math.min(1, force / 40);
        
        // Vibrate
        if(navigator.vibrate) {
            navigator.vibrate([this.state.cfg.vibActive, this.state.cfg.vibRest]);
            document.getElementById('rd-vib').innerText = `HIT (${force.toFixed(0)})`;
            setTimeout(() => document.getElementById('rd-vib').innerText = "Ready", 100);
        }

        // Play Custom Audio if loaded
        if (this.cellPlayers.has(idx)) {
            const p = this.cellPlayers.get(idx);
            if(p.loaded) {
                p.volume.value = Tone.gainToDb(vol);
                p.start(now);
            }
        } 
        // Else play Synth Note
        else {
            const note = this.state.cfg.cells[idx].customNote || this.state.cfg.cells[idx].defaultNote;
            this.polySynth.triggerAttackRelease(note, "8n", now, vol);
        }

        // Visual
        this.pointer.scale.set(1.5, 1.5, 1.5);
        setTimeout(() => this.pointer.scale.set(1, 1, 1), 100);
    },

    initGUIs() {
        // Clear old
        document.getElementById('gui-left-content').innerHTML = '';
        document.getElementById('gui-center-content').innerHTML = '';
        document.getElementById('gui-right-content').innerHTML = '';

        const guiOpts = { autoPlace: false, closed: false };

        // 1. LEFT: SENSORS
        this.guiSys = new dat.GUI(guiOpts);
        document.getElementById('gui-left-content').appendChild(this.guiSys.domElement);
        const gMap = this.guiSys.addFolder('Axis Mapping');
        gMap.add(this.state.cfg, 'sensSwapXY').name('Swap X/Y');
        gMap.add(this.state.cfg, 'sensInvertX').name('Invert X');
        gMap.add(this.state.cfg, 'sensInvertY').name('Invert Y');
        const gDyn = this.guiSys.addFolder('Dynamics');
        gDyn.add(this.state.cfg, 'gyroScale', 10, 90).name('Gyro Scale');
        gDyn.add(this.state.cfg, 'mouseScale', 0.1, 5).name('Mouse Scale');
        gDyn.add(this.state.cfg, 'mouseSmooth', 0.01, 1).name('Smoothing');
        gDyn.add(this.state.cfg, 'impactThresh', 5, 50).name('Shake Thresh');
        const gVib = this.guiSys.addFolder('Haptics');
        gVib.add(this.state.cfg, 'vibActive', 0, 100).name('Vib Time (ms)');
        gVib.add(this.state.cfg, 'vibRest', 0, 100).name('Rest Time (ms)');

        // 2. CENTER: GRID & PRESETS
        this.guiCfg = new dat.GUI(guiOpts);
        document.getElementById('gui-center-content').appendChild(this.guiCfg.domElement);
        this.guiCfg.add(this.state.cfg, 'gridCols', 1, 12).step(1).name('Cols').onChange(()=>this.initGrid());
        this.guiCfg.add(this.state.cfg, 'gridRows', 1, 12).step(1).name('Rows').onChange(()=>this.initGrid());
        this.guiCfg.add(this.state.cfg, 'showGrid').name('Show Grid').onChange(()=>this.initGrid());
        this.guiCfg.add(this.state.cfg, 'perspective').name('3D Perspective');
        
        // 3. RIGHT: AUDIO
        this.guiSnd = new dat.GUI(guiOpts);
        document.getElementById('gui-right-content').appendChild(this.guiSnd.domElement);
        const sMix = this.guiSnd.addFolder('Master Mixer');
        sMix.add(this.state.cfg, 'masterVol', -60, 10).name('Master Vol').onChange(v => this.masterVol.volume.value = v);
        sMix.add(this.state.cfg, 'eqLow', -10, 10).onChange(v => this.eq.low.value = v);
        sMix.add(this.state.cfg, 'eqMid', -10, 10).onChange(v => this.eq.mid.value = v);
        sMix.add(this.state.cfg, 'eqHigh', -10, 10).onChange(v => this.eq.high.value = v);
        sMix.add(this.state.cfg, 'reverbMix', 0, 1).onChange(v => this.rack.reverb.wet.value = v);
        sMix.add(this.state.cfg, 'delayMix', 0, 1).onChange(v => this.rack.delay.wet.value = v);
        
        const sSyn = this.guiSnd.addFolder('Synth Engine');
        sSyn.add(this.state.cfg, 'synthType', ['Synth', 'AMSynth', 'FMSynth', 'MembraneSynth']).onChange(v => {
            this.polySynth.dispose();
            this.polySynth = new Tone.PolySynth(Tone[v]).connect(this.rack.delay);
            this.updateADSR();
        });
        sSyn.add(this.state.cfg, 'scale', ['major', 'minor', 'pentatonic', 'chromatic']).onChange(()=>this.initGrid());
        sSyn.add(this.state.cfg, 'root', ['C','D','E','F','G','A','B']).onChange(()=>this.initGrid());
        sSyn.add(this.state.cfg, 'octave', 1, 6).step(1).onChange(()=>this.initGrid());
        
        const sEnv = this.guiSnd.addFolder('Envelope');
        sEnv.add(this.state.cfg, 'atk', 0.01, 2).onChange(()=>this.updateADSR());
        sEnv.add(this.state.cfg, 'dec', 0.01, 2).onChange(()=>this.updateADSR());
        sEnv.add(this.state.cfg, 'sus', 0, 1).onChange(()=>this.updateADSR());
        sEnv.add(this.state.cfg, 'rel', 0.1, 5).onChange(()=>this.updateADSR());
    },

    updateADSR() {
        this.polySynth.set({ envelope: { attack: this.state.cfg.atk, decay: this.state.cfg.dec, sustain: this.state.cfg.sus, release: this.state.cfg.rel } });
    },

    makeGUIsDraggable() {
        document.querySelectorAll('.gui-window').forEach(el => {
            const header = el.querySelector('.gui-header');
            const toggle = el.querySelector('.gui-toggle');
            const content = el.querySelector('.gui-content');
            
            toggle.onclick = () => {
                content.style.display = content.style.display === 'none' ? 'block' : 'none';
                toggle.innerText = content.style.display === 'none' ? '▲' : '▼';
            };

            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            header.onmousedown = (e) => {
                if(e.target === toggle) return;
                e.preventDefault();
                pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
                document.onmousemove = (e) => {
                    e.preventDefault();
                    pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
                    pos3 = e.clientX; pos4 = e.clientY;
                    el.style.top = (el.offsetTop - pos2) + "px";
                    el.style.left = (el.offsetLeft - pos1) + "px";
                };
            };
        });
    },

    bindEvents() {
        // Mode switch
        document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn[data-mode]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                this.state.mode = parseInt(e.target.getAttribute('data-mode'));
                if(this.state.mode !== 4) this.polySynth.releaseAll(); // Stop hovers
            });
        });

        // GUI Reset
        document.getElementById('btn-reset-gui').onclick = () => {
            document.getElementById('gui-left').style = "top: 20px; left: 20px;";
            document.getElementById('gui-center').style = "top: 20px; left: 50%; transform: translateX(-50%);";
            document.getElementById('gui-right').style = "top: 20px; right: 20px;";
        };

        // Panic
        document.getElementById('btn-panic').onclick = () => {
            Tone.Transport.stop(); this.polySynth.releaseAll();
            this.cellPlayers.forEach(p => p.stop());
            this.thereminVol.volume.rampTo(-Infinity, 0.05);
        };

        // Hot-Swap Presets via Keys 1-9
        window.addEventListener('keydown', e => {
            if(e.key >= '1' && e.key <= '9') {
                if(e.shiftKey) this.savePreset(`preset_${e.key}`);
                else this.loadPreset(`preset_${e.key}`);
            }
        });

        // Sensors
        if(this.state.hasGyro) {
            window.addEventListener("deviceorientation", e => { this.state.rawSensors = { x: e.gamma||0, y: e.beta||0, z: e.alpha||0 }; });
            window.addEventListener("devicemotion", e => {
                let a = e.acceleration || e.accelerationIncludingGravity;
                if (!a || a.x === null) return;
                const force = Math.sqrt(a.x**2 + a.y**2 + a.z**2);
                this.state.rawSensors.acc = force;
                if (force > this.state.cfg.impactThresh && force > 10) {
                    if (this.state.mode === 2 || this.state.mode === 3) this.triggerCell(this.state.activeCellIdx, force);
                }
            });
        }

        // Mouse Fallback
        window.addEventListener('mousemove', e => {
            if(this.state.hasGyro) return;
            // Map mouse to -90 to 90 like gyro
            this.state.rawSensors.x = mapRange(e.clientX, 0, window.innerWidth, -90, 90);
            this.state.rawSensors.y = mapRange(e.clientY, 0, window.innerHeight, 90, -90);
        });
        window.addEventListener('mousedown', () => {
            if(!this.state.hasGyro && (this.state.mode === 2 || this.state.mode === 3)) this.triggerCell(this.state.activeCellIdx, 40);
        });
    },

    savePreset(name) {
        localStorage.setItem(`gyros_${name}`, JSON.stringify(this.state.cfg));
        console.log("Saved preset:", name);
        document.getElementById('rd-cell').innerText = `SAVED ${name}`;
    },

    loadPreset(name) {
        const data = localStorage.getItem(`gyros_${name}`);
        if(data) {
            Object.assign(this.state.cfg, JSON.parse(data));
            this.initGrid();
            this.initGUIs(); // Rebuild GUIs to reflect new state
            console.log("Loaded preset:", name);
            document.getElementById('rd-cell').innerText = `LOADED ${name}`;
        }
    },

    loop() {
        requestAnimationFrame(() => this.loop());
        const { rawSensors, cfg, mode, pointer } = this.state;
        const now = Tone.now();

        // 1. Process Input Vector
        let inX = rawSensors.x; let inY = rawSensors.y;
        if(cfg.sensSwapXY) { let t = inX; inX = inY; inY = t; }
        if(cfg.sensInvertX) inX *= -1;
        if(cfg.sensInvertY) inY *= -1;

        // 2. Map to Screen Normalized Coordinates (-1 to 1)
        let targetX = Math.max(-1, Math.min(1, inX / cfg.gyroScale));
        let targetY = Math.max(-1, Math.min(1, inY / cfg.gyroScale));
        if(!this.state.hasGyro) { targetX *= cfg.mouseScale; targetY *= cfg.mouseScale; }

        // 3. Apply Smoothing
        pointer.x += (targetX - pointer.x) * cfg.mouseSmooth;
        pointer.y += (targetY - pointer.y) * cfg.mouseSmooth;

        this.pointer.position.x = pointer.x * 8;
        this.pointer.position.y = pointer.y * 5;

        // 4. Grid Collision
        let gridX = Math.floor(mapRange(pointer.x, -1, 1, 0, cfg.gridCols));
        let gridY = Math.floor(mapRange(pointer.y, 1, -1, 0, cfg.gridRows)); 
        gridX = Math.max(0, Math.min(cfg.gridCols - 1, gridX));
        gridY = Math.max(0, Math.min(cfg.gridRows - 1, gridY));
        let newCell = gridY * cfg.gridCols + gridX;

        // 5. 3D Perspective CSS effect
        if(cfg.perspective) {
            document.getElementById('grid-overlay').style.transform = `rotateX(${pointer.y * -20}deg) rotateY(${pointer.x * 20}deg)`;
        } else {
            document.getElementById('grid-overlay').style.transform = `none`;
        }

        // Cell Change Logic
        if (newCell !== this.state.activeCellIdx) {
            if (this.state.activeCellIdx !== -1) {
                const old = document.getElementById(`cell-${this.state.activeCellIdx}`);
                if (old) old.classList.remove('active');
                
                // Stop Hover-Synth (Mode 4) when leaving cell
                if (mode === 4) {
                    if (this.cellPlayers.has(this.state.activeCellIdx)) this.cellPlayers.get(this.state.activeCellIdx).stop();
                    else this.polySynth.releaseAll();
                }
            }
            
            const cur = document.getElementById(`cell-${newCell}`);
            if (cur) cur.classList.add('active');
            
            this.state.prevCellIdx = this.state.activeCellIdx;
            this.state.activeCellIdx = newCell;

            // Trigger Arp (Mode 5) or Hover (Mode 4)
            if (mode === 5 || mode === 4) this.triggerCell(newCell, mode === 4 ? 40 : 20); 
        }

        // Theremin Update (Modes 1 & 3)
        if (mode === 1 || mode === 3) {
            let tFreq = mapRange(pointer.y, -1, 1, 100, 1500);
            tFreq = Math.max(20, Math.min(3000, tFreq));
            let tVol = mapRange(pointer.x, -1, 1, -40, 0);
            this.theremin.frequency.setTargetAtTime(tFreq, now, 0.05);
            this.thereminVol.volume.setTargetAtTime(tVol, now, 0.05);
        } else {
            this.thereminVol.volume.setTargetAtTime(-Infinity, now, 0.1);
        }

        // Dashboard
        document.getElementById('rd-pos').innerText = `${pointer.x.toFixed(2)}, ${pointer.y.toFixed(2)}`;
        document.getElementById('rd-acc').innerText = rawSensors.acc.toFixed(1);
        if(cfg.cells[this.state.activeCellIdx]) {
            const cellInfo = cfg.cells[this.state.activeCellIdx];
            document.getElementById('rd-cell').innerText = cellInfo.audioSrc ? "[SAMPLE]" : cellInfo.defaultNote;
        }

        this.renderWaveform();
        this.renderer.render(this.scene, this.cam);
    },

    renderWaveform() {
        const cvs = document.getElementById('master-waveform');
        const ctx = cvs.getContext('2d');
        if (cvs.width !== cvs.clientWidth) { cvs.width = cvs.clientWidth; cvs.height = cvs.clientHeight; }
        
        const data = this.analyser.getValue();
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        ctx.beginPath(); ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2;
        for(let i=0; i<data.length; i++) {
            const x = (i/data.length) * cvs.width;
            const y = ((data[i]+1)/2) * cvs.height;
            i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        }
        ctx.stroke();
    }
};

document.getElementById('btn-start').onclick = () => GyrOS.init();
</script>
</body>
</html>

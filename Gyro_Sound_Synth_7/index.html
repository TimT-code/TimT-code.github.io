    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <style>
        :root { --accent-neon: #00ffcc; --glass-bg: rgba(10, 10, 15, 0.85); --wave-color: #00ffcc; }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #020202; font-family: sans-serif; color: white; user-select: none; touch-action: none; }
        
        #bg-layer { position: absolute; inset: 0; z-index: 0; background-size: cover; background-position: center; transition: opacity 0.3s; }
        #canvas-container { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        #screensaver-layer { position: absolute; inset: 0; z-index: 900; pointer-events: none; opacity: 0; transition: opacity 1s; background: rgba(0,0,0,0.8); }
        
        #grid-overlay { position: absolute; inset: 0; display: grid; z-index: 2; perspective: 1000px; transition: transform 0.1s; }
        .grid-cell { border: 1px solid rgba(255,255,255,0.05); transition: all 0.2s; background-size: cover; background-position: center; display: flex; align-items: flex-end; justify-content: flex-end; padding: 5px; box-sizing: border-box; font-family: monospace; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px black; }
        .grid-cell.active { border-color: var(--accent-neon); box-shadow: inset 0 0 30px var(--accent-neon); transform: translateZ(30px); z-index: 3; color: white !important; }

        /* Draggable GUIs */
        .gui-window { position: absolute; z-index: 100; background: var(--glass-bg); border: 1px solid var(--accent-neon); border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: opacity 0.3s; cursor: grab; }
        .gui-window:active { cursor: grabbing; }
        .gui-header { background: var(--accent-neon); color: black; padding: 6px 10px; font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; touch-action: none; pointer-events: none; }
        .gui-toggle { pointer-events: auto; cursor: pointer; padding: 0 5px; }
        
        #gui-left { top: 60px; left: 40px; } 
        #gui-center { top: 60px; left: 50%; transform: translateX(-50%); } 
        #gui-right { top: 60px; right: 40px; }

        /* Custom Sampler Buttons */
        #custom-buttons-layer { position: absolute; inset: 0; z-index: 80; pointer-events: none; }
        #custom-buttons-layer.editing { pointer-events: auto; background: rgba(0, 255, 204, 0.05); }
        .custom-sampler-btn { position: absolute; padding: 10px 15px; background: rgba(0,0,0,0.8); border: 2px solid var(--accent-neon); color: var(--accent-neon); border-radius: 8px; font-family: monospace; font-weight: bold; cursor: pointer; user-select: none; touch-action: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.1s; pointer-events: auto; }
        .custom-sampler-btn:active { transform: scale(0.95); }
        .custom-sampler-btn.playing { filter: brightness(1.5); box-shadow: 0 0 15px currentColor; }

        .ui-hidden { opacity: 0 !important; pointer-events: none !important; }
        
        #live-dashboard { position: absolute; bottom: 20vh; left: 20px; background: var(--glass-bg); padding: 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; font-family: monospace; font-size: 11px; z-index: 50; pointer-events: none; color: var(--accent-neon); transition: opacity 0.3s; }
        
        /* Bottom HUD & Buttons */
        #bottom-hud { position: absolute; bottom: 0; left: 0; width: 100vw; height: 18vh; background: var(--glass-bg); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.2); z-index: 150; display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.1, 0.8, 0.1, 1); pointer-events: auto; }
        #bottom-hud.hidden { transform: translateY(100%); }
        .hud-controls { display: flex; gap: 6px; justify-content: center; padding: 6px; flex-wrap: wrap; }
        
        .sys-btn { padding: 8px 12px; background: rgba(0,0,0,0.6); border: 1px solid var(--accent-neon); color: var(--accent-neon); border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; transition: 0.2s; pointer-events: auto; }
        .sys-btn.active { background: var(--accent-neon); color: #000; box-shadow: 0 0 10px var(--accent-neon); }
        
        /* Toggle States */
        .btn-mute-on { background: rgba(255,0,0,0.9) !important; color: white !important; border-color: red !important; box-shadow: 0 0 15px red; }
        @keyframes mutePulse { 0% { box-shadow: 0 0 5px red; background: rgba(255,0,0,0.5); } 100% { box-shadow: 0 0 25px red; background: rgba(255,0,0,1); } }
        .mute-active-audio { animation: mutePulse 0.3s infinite alternate !important; border-color: white !important; }
        
        .btn-sensors-on { background: var(--accent-neon); color: #000; box-shadow: 0 0 10px var(--accent-neon); }
        .btn-sensors-off { border-color: #666 !important; color: #666 !important; text-decoration: line-through; background: rgba(0,0,0,0.5); }
        
        .btn-pads-edit { background: #ffaa00 !important; color: #000 !important; border-color: #ffaa00 !important; box-shadow: 0 0 10px #ffaa00; }
        .btn-pads-locked { border-color: #666 !important; color: #666 !important; background: rgba(0,0,0,0.5); }

        .sleep-indicator { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #ffaa00; font-family: monospace; font-weight: bold; font-size: 14px; z-index: 1000; display: none; background: rgba(0,0,0,0.8); padding: 5px 15px; border-radius: 20px; border: 1px solid #ffaa00; }

        #master-waveform { width: 100%; height: 100%; flex-grow: 1; pointer-events: none; }

        /* Secret Corners */
        .secret-corner { position: absolute; width: 80px; height: 80px; z-index: 999; opacity: 0; cursor: pointer; }
        #sc-tl { top: 0; left: 0; } #sc-tr { top: 0; right: 0; } #sc-bl { bottom: 0; left: 0; } #sc-br { bottom: 0; right: 0; }

        .vfx-layer { position: absolute; pointer-events: none; transform: translate(-50%, -50%); transform-origin: center; z-index: 10; }

        input[type="file"] { display: none; }
        #init-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #btn-start { padding: 20px 40px; font-size: 1.5rem; background: var(--accent-neon); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    { "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js" } }

<script type="module">
/**
 * GYR-OS WORKSTATION V7.1
 * Author: Tim Tesner
 * Co-Author: Gemini 3 Pro
 */

import * as THREE from 'three';
import * as Tone from 'https://esm.sh/tone';

const mapRange = (val, inMin, inMax, outMin, outMax) => ((val - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;

const NOTE_COLORS = { 'C': 0, 'C#': 30, 'D': 60, 'D#': 90, 'E': 120, 'F': 150, 'F#': 180, 'G': 210, 'G#': 240, 'A': 270, 'A#': 300, 'B': 330 };
function getNoteColor(noteStr) {
    if (!noteStr) return 'rgba(255,255,255,0.1)';
    let base = noteStr.replace(/\d+/, ''); let oct = parseInt(noteStr.replace(/\D+/g, '')) || 3;
    let hue = NOTE_COLORS[base] || 0; let light = 20 + (oct * 8); 
    return `hsla(${hue}, 80%, ${light}%, 0.3)`;
}

const GyrOS = {
    state: {
        mode: 1, hasGyro: false, holdMode: false, uiHidden: false, isMuted: false, isAsleep: false, sensorsActive: true, padsEditing: false, zIndexCounter: 100,
        rawSensors: { x: 0, y: 0, z: 0, acc: 0 },
        pointer: { x: 0, y: 0 }, lastInteraction: Date.now(),
        activeCellIdx: -1, customSamplers: [],
        
        cfg: {
            sensSwapXY: false, sensInvertX: false, sensInvertY: false,
            gyroScale: 30, impactThresh: 15,
            vibActive: 30, vibRest: 10,
            
            gridCols: 4, gridRows: 3, showGrid: true, perspective: false, colorNotes: true,
            hudColor: 'rgba(10, 10, 15, 0.85)', accentColor: '#00ffcc', waveColor: '#00ffcc',
            bgImageUrl: null, bgOpacity: 1.0, bgSize: 'cover',
            pointerSize: 1.0, pointerOpac: 1.0, hidePointerTouch: false,
            
            vfxImageUrl: null, vfxOpac: 0.8, vfxScale: 2.0, vfxSpeed: 0.5, targetNoteForImg: 'C',
            
            masterVol: -2, eqLow: 0, eqMid: 0, eqHigh: 0, reverbMix: 0.3, delayMix: 0.2,
            scale: 'pentatonic', root: 'C', octave: 3,
            
            thOn: true, thereminWave: 'sine', thBaseFreq: 100, thMaxFreq: 2000, thVolMax: 0, thVolMin: -40,
            
            s1On: true, s1Type: 'Synth', s1Vol: -4, s1Pan: -0.5, s1Atk: 0.05, s1Dec: 0.2, s1Sus: 0.5, s1Rel: 1.5,
            s1Dist: 0, s1Phaser: 0,
            
            s2On: true, s2Type: 'FMSynth', s2Vol: -6, s2Pan: 0.5, s2Atk: 0.1, s2Dec: 0.3, s2Sus: 0.4, s2Rel: 2.0,
            s2Dist: 0, s2Phaser: 0,

            m1: true, m2: true, m3: true, m4: true, m5: true, m6: true, m7: true, m8: true,
            guiFolders: {}, cells: [], noteImages: {}
        }
    },

    modesList: [ { id: 1, name: "1: THEREMIN" }, { id: 2, name: "2: IMPACT" }, { id: 3, name: "3: HYBRID" }, { id: 4, name: "4: HOVER" }, { id: 5, name: "5: ARP" }, { id: 6, name: "6: TOUCH" }, { id: 7, name: "7: TCH+THER" }, { id: 8, name: "8: THER+SYN" } ],
    scalesList: ['major', 'minor', 'pentatonic', 'chromatic', 'lydian', 'dorian', 'mixolydian', 'phrygian', 'blues'],

    async init() {
        try {
            await Tone.start();
            try { await this.detectSensors(); this.state.hasGyro = true; } catch(e) { this.state.hasGyro = false; }
            this.initAudio(); this.initVisuals(); this.initGrid(); this.initGUIs();
            this.makeGUIsDraggable(); this.bindEvents(); this.renderModeButtons();
            document.getElementById('init-overlay').style.display = 'none';
            this.loop();
        } catch(err) { document.getElementById('error-msg').innerText = "Failed: " + err.message; }
    },

    async detectSensors() {
        if (!window.DeviceOrientationEvent) throw new Error("No hardware");
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            const p = await DeviceOrientationEvent.requestPermission();
            if (p !== 'granted') throw new Error("Permission denied");
        }
        return new Promise((res, rej) => {
            const t = setTimeout(() => { window.removeEventListener('deviceorientation', check); rej(); }, 1000);
            const check = (e) => { if (e.alpha !== null) { clearTimeout(t); res(); } };
            window.addEventListener('deviceorientation', check);
        });
    },

    initAudio() {
        this.analyser = new Tone.Analyser("waveform", 1024);
        
        this.limiter = new Tone.Limiter(-2).connect(this.analyser).toDestination();
        this.muteNode = new Tone.Volume(0).connect(this.limiter);
        this.masterBus = new Tone.Volume(0).connect(this.muteNode);
        
        // Meter connected BEFORE mute so it continues to read output visually
        this.meter = new Tone.Meter().connect(this.masterBus); 

        this.eq = new Tone.EQ3(this.state.cfg.eqLow, this.state.cfg.eqMid, this.state.cfg.eqHigh).connect(this.masterBus);
        this.rack = { reverb: new Tone.Freeverb({ roomSize: 0.8 }).connect(this.eq), delay: new Tone.FeedbackDelay("8n", 0.3).connect(this.eq) };

        this.s1Phaser = new Tone.Phaser({ frequency: 15, octaves: 5, baseFrequency: 1000 }).connect(this.rack.delay);
        this.s1Dist = new Tone.Distortion(0).connect(this.s1Phaser);
        this.s1Pan = new Tone.Panner(this.state.cfg.s1Pan).connect(this.s1Dist);
        this.synth1 = new Tone.PolySynth(Tone[this.state.cfg.s1Type], { maxPolyphony: 8 }).connect(this.s1Pan);
        
        this.s2Phaser = new Tone.Phaser({ frequency: 15, octaves: 5, baseFrequency: 1000 }).connect(this.rack.delay);
        this.s2Dist = new Tone.Distortion(0).connect(this.s2Phaser);
        this.s2Pan = new Tone.Panner(this.state.cfg.s2Pan).connect(this.s2Dist);
        this.synth2 = new Tone.PolySynth(Tone[this.state.cfg.s2Type], { maxPolyphony: 8 }).connect(this.s2Pan);
        
        this.theremin = new Tone.Oscillator(this.state.cfg.thBaseFreq, this.state.cfg.thereminWave).start();
        this.thereminVol = new Tone.Volume(-Infinity).connect(this.rack.reverb);
        this.theremin.connect(this.thereminVol);

        this.updateSynths();
    },

    updateSynths() {
        this.synth1.volume.value = this.state.cfg.s1Vol; this.s1Pan.pan.value = this.state.cfg.s1Pan;
        this.s1Dist.distortion = this.state.cfg.s1Dist; this.s1Phaser.wet.value = this.state.cfg.s1Phaser;
        this.synth1.set({ envelope: { attack: this.state.cfg.s1Atk, decay: this.state.cfg.s1Dec, sustain: this.state.cfg.s1Sus, release: this.state.cfg.s1Rel } });
        
        this.synth2.volume.value = this.state.cfg.s2Vol; this.s2Pan.pan.value = this.state.cfg.s2Pan;
        this.s2Dist.distortion = this.state.cfg.s2Dist; this.s2Phaser.wet.value = this.state.cfg.s2Phaser;
        this.synth2.set({ envelope: { attack: this.state.cfg.s2Atk, decay: this.state.cfg.s2Dec, sustain: this.state.cfg.s2Sus, release: this.state.cfg.s2Rel } });
        
        this.theremin.type = this.state.cfg.thereminWave;
    },

    initVisuals() {
        this.scene = new THREE.Scene();
        this.cam = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(this.renderer.domElement);

        this.pointerMaterial = new THREE.MeshBasicMaterial({ color: this.state.cfg.accentColor, wireframe: true, transparent: true });
        this.pointerObj = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), this.pointerMaterial);
        this.scene.add(this.pointerObj);
        
        this.gridHelper = new THREE.GridHelper(100, 50, 0x222222, 0x111111);
        this.gridHelper.rotation.x = Math.PI / 2; this.gridHelper.position.z = -5;
        this.scene.add(this.gridHelper);
        this.cam.position.z = 10;
        
        this.ssScene = new THREE.Scene(); this.ssCam = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000); this.ssCam.position.z = 50;
        this.ssRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); this.ssRenderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('screensaver-layer').appendChild(this.ssRenderer.domElement);
        
        const geom = new THREE.BufferGeometry(); const verts = [];
        for(let i=0; i<2000; i++) verts.push(THREE.MathUtils.randFloatSpread(200), THREE.MathUtils.randFloatSpread(200), THREE.MathUtils.randFloatSpread(200));
        geom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
        this.particles = new THREE.Points(geom, new THREE.PointsMaterial({ color: 0x00ffcc, size: 0.5 }));
        this.ssScene.add(this.particles);

        this.raycaster = new THREE.Raycaster();
        this.planeZ0 = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

        this.applyTheme();
    },

    applyTheme() {
        document.documentElement.style.setProperty('--accent-neon', this.state.cfg.accentColor);
        document.documentElement.style.setProperty('--glass-bg', this.state.cfg.hudColor);
        document.documentElement.style.setProperty('--wave-color', this.state.cfg.waveColor);
        this.pointerMaterial.color.set(this.state.cfg.accentColor);
        this.pointerMaterial.opacity = this.state.cfg.pointerOpac;
        this.pointerObj.scale.setScalar(this.state.cfg.pointerSize);
        this.pointerObj.visible = (!this.state.cfg.hidePointerTouch || ![6,7].includes(this.state.mode));
        this.particles.material.color.set(this.state.cfg.accentColor);
        
        const bg = document.getElementById('bg-layer');
        if(this.state.cfg.bgImageUrl) { bg.style.backgroundImage = `url(${this.state.cfg.bgImageUrl})`; bg.style.opacity = this.state.cfg.bgOpacity; bg.style.backgroundSize = this.state.cfg.bgSize; } 
        else { bg.style.backgroundImage = 'none'; }
    },

    initGrid() {
        const overlay = document.getElementById('grid-overlay');
        overlay.innerHTML = '';
        overlay.style.gridTemplateColumns = `repeat(${this.state.cfg.gridCols}, 1fr)`;
        overlay.style.gridTemplateRows = `repeat(${this.state.cfg.gridRows}, 1fr)`;
        overlay.style.opacity = this.state.cfg.showGrid ? "1" : "0";

        const total = this.state.cfg.gridCols * this.state.cfg.gridRows;
        if (this.state.cfg.cells.length !== total) this.state.cfg.cells = Array.from({length: total}, (_, i) => ({ id: i }));

        const s = Tonal.Scale.get(`${this.state.cfg.root} ${this.state.cfg.scale}`).notes;
        let currOct = parseInt(this.state.cfg.octave);

        for(let i=0; i<total; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell'; cell.id = `cell-${i}`;
            let note = s[i % s.length] + currOct; if ((i + 1) % s.length === 0) currOct++;
            this.state.cfg.cells[i].defaultNote = note; cell.innerText = note;
            if(this.state.cfg.colorNotes) cell.style.backgroundColor = getNoteColor(note);
            overlay.appendChild(cell);
        }
    },

    addCustomSampler(url, fileObj) {
        // Strict Audio Verification
        const validTypes = ['audio/mpeg', 'audio/wav', 'audio/ogg', 'audio/webm', 'audio/flac', 'audio/mp4'];
        if (!validTypes.includes(fileObj.type) && !fileObj.name.match(/\.(mp3|wav|ogg|webm|flac|m4a)$/i)) {
            alert('Invalid file format. Only audio files are allowed for custom pads.'); return;
        }

        const id = Date.now();
        const player = new Tone.Player(url).connect(this.rack.delay);
        const data = { 
            id, player, url, name: fileObj.name.substring(0,8), vol: 0, loop: false, 
            bgCol: 'rgba(0,0,0,0.8)', txtCol: this.state.cfg.accentColor, brdCol: this.state.cfg.accentColor, icon: '▶',
            impactEnabled: false, impactThresh: 15
        };
        this.state.customSamplers.push(data);
        
        const btn = document.createElement('div');
        btn.className = 'custom-sampler-btn';
        btn.id = `pad-${id}`;
        btn.innerText = `${data.icon} ${data.name}`;
        btn.style.left = '50px'; btn.style.top = '150px';
        btn.style.background = data.bgCol; btn.style.color = data.txtCol; btn.style.borderColor = data.brdCol;
        
        let isDown = false, startX, startY, origX, origY, hasMoved = false;
        
        btn.addEventListener('pointerdown', e => {
            e.stopPropagation();
            if(!this.state.padsEditing) return; // Only interactable in EDIT mode
            isDown = true; hasMoved = false; startX = e.clientX; startY = e.clientY; origX = btn.offsetLeft; origY = btn.offsetTop;
            btn.setPointerCapture(e.pointerId);
        });
        
        btn.addEventListener('pointermove', e => {
            if(!isDown || !this.state.padsEditing) return;
            hasMoved = true; btn.style.left = (origX + e.clientX - startX) + 'px'; btn.style.top = (origY + e.clientY - startY) + 'px';
        });
        
        const end = (e) => {
            if(!isDown) return;
            isDown = false; btn.releasePointerCapture(e.pointerId);
            if(!hasMoved) {
                if(player.state === 'started') { player.stop(); btn.classList.remove('playing'); }
                else { player.start(Tone.now()); btn.classList.add('playing'); if(!data.loop) setTimeout(()=>btn.classList.remove('playing'), 2000); }
            }
        };
        btn.addEventListener('pointerup', end); btn.addEventListener('pointercancel', end);

    spawnVFX(xNorm, yNorm, customImg = null, customOpac = null) {
        const imgUrl = customImg || this.state.cfg.vfxImageUrl;
        if (!imgUrl) return;
        const vfx = document.createElement('img');
        vfx.src = imgUrl; vfx.className = 'vfx-layer';
        vfx.style.left = `${(xNorm + 1) / 2 * window.innerWidth}px`;
        vfx.style.top = `${(-yNorm + 1) / 2 * window.innerHeight}px`;
        
        const opac = customOpac || this.state.cfg.vfxOpac;
        const scale = this.state.cfg.vfxScale; const speed = this.state.cfg.vfxSpeed;
        
        vfx.animate([
            { opacity: opac, transform: `translate(-50%, -50%) scale(0.1)` },
            { opacity: 0, transform: `translate(-50%, -50%) scale(${scale})` }
        ], { duration: speed * 1000, easing: 'ease-out' });
        
        document.body.appendChild(vfx);
        setTimeout(() => vfx.remove(), speed * 1000);
    },

    triggerNote(noteStr, force = 30) {
        if(!this.state.cfg.s1On && !this.state.cfg.s2On) return;
        const now = Tone.now();
        const vol = Math.min(1, force / 40);
        
        // Author: Tim Tesner
        let swingForce = force;
        if(navigator.vibrate) navigator.vibrate(Math.trunc(swingForce * 10 / 2));

        this.pointerObj.scale.setScalar(this.state.cfg.pointerSize * 1.8);
        setTimeout(() => this.pointerObj.scale.setScalar(this.state.cfg.pointerSize), 100);

        // Note-Image Mapping Logic
        const baseNote = noteStr.replace(/\d+/, '');
        let match = this.state.cfg.noteImages[noteStr] || this.state.cfg.noteImages[baseNote];
        if (match) this.spawnVFX(this.state.pointer.x, this.state.pointer.y, match.url, match.opac);
        else this.spawnVFX(this.state.pointer.x, this.state.pointer.y);
        
        const dur = this.state.holdMode ? "100m" : "8n";
        if(this.state.cfg.s1On) this.synth1.triggerAttackRelease(noteStr, dur, now, vol);
        if(this.state.cfg.s2On) this.synth2.triggerAttackRelease(noteStr, dur, now, vol);
    },

    makeGUIsDraggable() {
        document.querySelectorAll('.gui-window').forEach(el => {
            const toggle = el.querySelector('.gui-toggle');
            const content = el.querySelector('.gui-content');
            
            // Bring to front
            el.addEventListener('pointerdown', () => { el.style.zIndex = ++this.state.zIndexCounter; });

            // Folder toggle logic
            toggle.addEventListener('pointerdown', e => {
                e.stopPropagation();
                const isHidden = content.style.display === 'none';
                content.style.display = isHidden ? 'block' : 'none';
                toggle.innerText = isHidden ? '▼' : '▲';
            });

            let isDown = false, startX, startY, origX, origY;
            
            // Start Drag
            el.addEventListener('pointerdown', e => {
                // Ignore drags if clicking a dat.gui folder structure so they still open/close natively!
                if(e.target.closest('.dg') || e.target.tagName==='INPUT' || e.target.tagName==='SELECT' || e.target.closest('.gui-toggle')) return;
                e.stopPropagation();
                el.setPointerCapture(e.pointerId);
                isDown = true; startX = e.clientX; startY = e.clientY; origX = el.offsetLeft; origY = el.offsetTop;
                el.style.left = origX + 'px'; el.style.right = 'auto'; // Break CSS alignment
            });

            // Move Drag
            el.addEventListener('pointermove', e => {
                if(!isDown) return;
                let newX = origX + (e.clientX - startX);
                let newY = origY + (e.clientY - startY);
                // Hard Boundary constraints
                newX = Math.max(0, Math.min(newX, window.innerWidth - 60));
                newY = Math.max(0, Math.min(newY, window.innerHeight - 30));
                el.style.left = newX + "px"; el.style.top = newY + "px";
            });

            // End Drag
            const endDrag = (e) => { if(isDown) { el.releasePointerCapture(e.pointerId); isDown = false; } };
            el.addEventListener('pointerup', endDrag); el.addEventListener('pointercancel', endDrag);
        });
    },

    bindEvents() {
        // App-wide Drops (Audio files for pads)
        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => {
            e.preventDefault();
            const file = e.dataTransfer.files[0]; if(!file) return;
            if(file.type.startsWith('audio/') || file.name.match(/\.(mp3|wav|ogg|webm|flac|m4a)$/i)) {
                this.addCustomSampler(URL.createObjectURL(file), file);
            } else { alert("Please drop a valid audio file."); }
        });

        const handleUp = (e, callback) => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader(); reader.onload = (ev) => callback(ev.target.result, file);
            file.type.startsWith('image') || file.type.startsWith('audio') ? callback(URL.createObjectURL(file), file) : reader.readAsText(file);
        };
        
        document.getElementById('up-config').addEventListener('change', e => handleUp(e, res => { Object.assign(this.state.cfg, JSON.parse(res)); this.initGrid(); this.initGUIs(); this.applyTheme(); }));
        document.getElementById('up-s1').addEventListener('change', e => handleUp(e, res => { Object.assign(this.state.cfg, JSON.parse(res)); this.updateSynths(); this.initGUIs(); }));
        document.getElementById('up-s2').addEventListener('change', e => handleUp(e, res => { Object.assign(this.state.cfg, JSON.parse(res)); this.updateSynths(); this.initGUIs(); }));
        document.getElementById('up-th').addEventListener('change', e => handleUp(e, res => { Object.assign(this.state.cfg, JSON.parse(res)); this.updateSynths(); this.initGUIs(); }));
        document.getElementById('up-bg').addEventListener('change', e => handleUp(e, url => { this.state.cfg.bgImageUrl = url; this.applyTheme(); }));
        document.getElementById('up-vfx').addEventListener('change', e => handleUp(e, url => { this.state.cfg.vfxImageUrl = url; }));
        document.getElementById('up-note-img').addEventListener('change', e => handleUp(e, url => { this.state.cfg.noteImages[this.state.cfg.targetNoteForImg] = { url: url, opac: 0.8 }; alert(`Image Mapped to ${this.state.cfg.targetNoteForImg}`); }));
        document.getElementById('up-sample').addEventListener('change', e => handleUp(e, (url, file) => this.addCustomSampler(url, file)));

        // Utility Buttons
        document.getElementById('btn-oct-up').addEventListener('click', () => { if(this.state.cfg.octave < 6) { this.state.cfg.octave++; this.initGrid(); this.guiSnd.updateDisplay(); } });
        document.getElementById('btn-oct-down').addEventListener('click', () => { if(this.state.cfg.octave > 1) { this.state.cfg.octave--; this.initGrid(); this.guiSnd.updateDisplay(); } });

        const btnPads = document.getElementById('btn-pads-edit');
        btnPads.addEventListener('click', () => {
            this.state.padsEditing = !this.state.padsEditing;
            btnPads.innerText = this.state.padsEditing ? "PADS: EDIT" : "PADS: LOCKED";
            btnPads.classList.toggle('btn-pads-edit', this.state.padsEditing);
            btnPads.classList.toggle('btn-pads-locked', !this.state.padsEditing);
            document.getElementById('custom-buttons-layer').classList.toggle('editing', this.state.padsEditing);
        });

        const btnSen = document.getElementById('btn-sensors');
        btnSen.addEventListener('click', () => {
            this.state.sensorsActive = !this.state.sensorsActive;
            btnSen.innerText = this.state.sensorsActive ? "⚡ SENSORS: ON" : "❌ SENSORS: OFF";
            btnSen.classList.toggle('btn-sensors-on', this.state.sensorsActive);
            btnSen.classList.toggle('btn-sensors-off', !this.state.sensorsActive);
        });

        const doPanic = () => {
            Tone.Transport.stop(); this.synth1.releaseAll(); this.synth2.releaseAll();
            this.state.customSamplers.forEach(s => s.player.stop());
            this.thereminVol.volume.rampTo(-Infinity, 0.05);
            this.state.holdMode = false; document.getElementById('btn-hold').classList.remove('active');
            document.getElementById('btn-hold').innerText = "⎄ HOLD: OFF";
        };
        document.getElementById('btn-panic').addEventListener('click', doPanic);

        const btnMute = document.getElementById('btn-mute');
        const toggleMute = (forceState = null) => {
            this.state.isMuted = forceState !== null ? forceState : !this.state.isMuted;
            this.muteNode.volume.value = this.state.isMuted ? -Infinity : 0;
            btnMute.classList.toggle('btn-mute-on', this.state.isMuted);
            btnMute.innerText = this.state.isMuted ? "🔇 MUTE: ON" : "🔊 MUTE: OFF";
        };
        btnMute.addEventListener('click', e => { e.target.blur(); toggleMute(); });

        const btnHold = document.getElementById('btn-hold');
        btnHold.addEventListener('click', () => { 
            this.state.holdMode = !this.state.holdMode; 
            btnHold.classList.toggle('active', this.state.holdMode); 
            btnHold.innerText = this.state.holdMode ? "⎄ HOLD: ON" : "⎄ HOLD: OFF";
        });

        let cpTimer;
        document.querySelectorAll('.secret-corner').forEach(c => {
            const toggleUI = () => {
                this.state.uiHidden = !this.state.uiHidden;
                document.querySelectorAll('.gui-window, #live-dashboard').forEach(el => el.classList.toggle('ui-hidden', this.state.uiHidden));
                document.getElementById('bottom-hud').classList.toggle('hidden', this.state.uiHidden);
            };
            c.onmousedown = c.ontouchstart = () => { cpTimer = setTimeout(toggleUI, 1500); };
            c.onmouseup = c.ontouchend = c.onmouseleave = () => clearTimeout(cpTimer);
        });

        const markActive = () => { 
            this.state.lastInteraction = Date.now();
            if(this.state.isAsleep) {
                this.state.isAsleep = false; document.getElementById('screensaver-layer').style.opacity = 0;
                document.getElementById('sleep-indicator').style.display = 'none';
                toggleMute(false);
            }
        };

        if(this.state.hasGyro) {
            window.addEventListener("deviceorientation", e => { if(!this.state.sensorsActive) return; this.state.rawSensors = { x: e.gamma||0, y: e.beta||0, z: e.alpha||0 }; markActive(); });
            window.addEventListener("devicemotion", e => {
                if(!this.state.sensorsActive) return;
                let a = e.acceleration || e.accelerationIncludingGravity; if (!a || a.x === null) return;
                const force = Math.sqrt(a.x**2 + a.y**2 + a.z**2); this.state.rawSensors.acc = force;
                if (force > 10) {
                    this.state.customSamplers.forEach(pad => {
                        if (pad.impactEnabled && force > pad.impactThresh && pad.player.state !== 'started') pad.player.start(Tone.now());
                    });
                    
                    if (force > this.state.cfg.impactThresh && [2,3,8].includes(this.state.mode) && this.state.cfg.cells[this.state.activeCellIdx]) {
                        this.triggerNote(this.state.cfg.cells[this.state.activeCellIdx].defaultNote, force);
                    }
                }
            });
        }

        const mapMouseTo3D = (cx, cy) => {
            if(!this.state.sensorsActive) return;
            const x = (cx / window.innerWidth) * 2 - 1; const y = -(cy / window.innerHeight) * 2 + 1;
            this.raycaster.setFromCamera(new THREE.Vector2(x, y), this.cam);
            const target = new THREE.Vector3(); this.raycaster.ray.intersectPlane(this.planeZ0, target);
            this.state.pointer.x = target.x / 8; this.state.pointer.y = target.y / 5;
        };

        window.addEventListener('mousemove', e => {
            if(!this.state.sensorsActive) return; markActive();
            if(!this.state.hasGyro || [6,7].includes(this.state.mode)) mapMouseTo3D(e.clientX, e.clientY);
        });

        const touchTrigger = (e) => {
            // Protect touch execution from UI interactions
            if(!this.state.sensorsActive || e.target.closest('.gui-window') || e.target.closest('#bottom-hud') || e.target.closest('.custom-sampler-btn')) return;
            markActive();
            if(!this.state.hasGyro || [6,7].includes(this.state.mode)) {
                if(e.touches) mapMouseTo3D(e.touches[0].clientX, e.touches[0].clientY);
                if ([2,3,8,6,7].includes(this.state.mode) && this.state.cfg.cells[this.state.activeCellIdx]) {
                    this.triggerNote(this.state.cfg.cells[this.state.activeCellIdx].defaultNote, 40);
                }
            }
        };
        window.addEventListener('mousedown', touchTrigger); 
        window.addEventListener('touchstart', touchTrigger, {passive: false});
        
        setInterval(() => {
            if(!this.state.isAsleep && Date.now() - this.state.lastInteraction > 10000) {
                this.state.isAsleep = true; 
                this.state.customSamplers.forEach(s => { s.player.loop = false; });
                this.synth1.releaseAll(); this.synth2.releaseAll();
                this.thereminVol.volume.rampTo(-Infinity, 0.05);
                toggleMute(true);
                document.getElementById('screensaver-layer').style.opacity = 1;
                document.getElementById('sleep-indicator').style.display = 'block';
            }
        }, 1000);
    },

    loop() {
        requestAnimationFrame(() => this.loop());
        const { rawSensors, cfg, mode, pointer, isMuted, isAsleep, sensorsActive } = this.state;
        const now = Tone.now();

        if (isMuted) {
            const level = this.meter.getValue(); document.getElementById('btn-mute').classList.toggle('mute-active-audio', level > -40);
        } else { document.getElementById('btn-mute').classList.remove('mute-active-audio'); }

        if (isAsleep || !sensorsActive) {
            this.particles.rotation.x += 0.001; this.particles.rotation.y += 0.002;
            this.ssRenderer.render(this.ssScene, this.ssCam);
            if(isAsleep) return; 
        }

        if(this.state.hasGyro && ![6,7].includes(mode)) {
            let inX = rawSensors.x; let inY = rawSensors.y;
            if(cfg.sensSwapXY) { let t = inX; inX = inY; inY = t; }
            if(cfg.sensInvertX) inX *= -1; if(cfg.sensInvertY) inY *= -1;
            pointer.x = Math.max(-1, Math.min(1, inX / cfg.gyroScale));
            pointer.y = Math.max(-1, Math.min(1, inY / cfg.gyroScale));
        }

        this.pointerObj.position.x = pointer.x * 8; this.pointerObj.position.y = pointer.y * 5;

        let gridX = Math.floor(mapRange(pointer.x, -1, 1, 0, cfg.gridCols)); let gridY = Math.floor(mapRange(pointer.y, 1, -1, 0, cfg.gridRows)); 
        gridX = Math.max(0, Math.min(cfg.gridCols - 1, gridX)); gridY = Math.max(0, Math.min(cfg.gridRows - 1, gridY));
        let newCell = gridY * cfg.gridCols + gridX;

        if (newCell !== this.state.activeCellIdx) {
            if (this.state.activeCellIdx !== -1) {
                const old = document.getElementById(`cell-${this.state.activeCellIdx}`); if (old) old.classList.remove('active');
                if (mode === 4 && !this.state.holdMode) { this.synth1.releaseAll(); this.synth2.releaseAll(); }
            }
            const cur = document.getElementById(`cell-${newCell}`); if (cur) cur.classList.add('active');
            this.state.activeCellIdx = newCell;
            if ([4,5].includes(mode) && cfg.cells[newCell]) this.triggerNote(cfg.cells[newCell].defaultNote, mode === 4 ? 40 : 20); 
        }

        if (cfg.thOn && [1, 3, 7, 8].includes(mode)) {
            let tFreq = mapRange(pointer.y, -1, 1, cfg.thBaseFreq, cfg.thMaxFreq); tFreq = Math.max(20, Math.min(5000, tFreq));
            let tVol = mapRange(pointer.x, -1, 1, cfg.thVolMin, cfg.thVolMax);
            this.theremin.frequency.setTargetAtTime(tFreq, now, 0.05); this.thereminVol.volume.setTargetAtTime(tVol, now, 0.05);
        } else { this.thereminVol.volume.setTargetAtTime(-Infinity, now, 0.1); }

        document.getElementById('rd-pos').innerText = `${pointer.x.toFixed(2)}, ${pointer.y.toFixed(2)}`;
        document.getElementById('rd-acc').innerText = rawSensors.acc.toFixed(1);

        this.renderWaveform(); this.renderer.render(this.scene, this.cam);
    },

    renderWaveform() {
        const cvs = document.getElementById('master-waveform'); const ctx = cvs.getContext('2d');
        if (cvs.width !== cvs.clientWidth) { cvs.width = cvs.clientWidth; cvs.height = cvs.clientHeight; }
        const data = this.analyser.getValue();
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        ctx.beginPath(); ctx.strokeStyle = this.state.cfg.waveColor; ctx.lineWidth = 2;
        for(let i=0; i<data.length; i++) {
            const x = (i/data.length) * cvs.width; const y = ((data[i]+1)/2) * cvs.height; i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        }
        ctx.stroke();
    }
};

document.getElementById('btn-start').onclick = () => GyrOS.init();
</script>
</body>
</html>

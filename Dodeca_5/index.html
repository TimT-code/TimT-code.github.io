<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orbital Singularity: Advanced Systems</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; user-select: none; }
        #hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
        .row { display: flex; justify-content: space-between; width: 100%; }
        .hud-text { color: #00ffaa; text-shadow: 0 0 5px #00ffaa; font-size: 14px; font-weight: bold; }
        
        #bars-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 400px; text-align: center; }
        .bar-label { font-size: 10px; color: #fff; letter-spacing: 2px; margin-bottom: 2px; display: block; }
        .bar-track { width: 100%; height: 8px; background: rgba(0, 50, 40, 0.5); border: 1px solid #444; margin-bottom: 8px; position: relative; overflow: hidden;}
        #target-health-fill { width: 100%; height: 100%; background: #ff3333; transition: width 0.1s; }
        #ship-health-fill { width: 100%; height: 100%; background: #00aaff; transition: width 0.1s; }
        #charge-fill { width: 0%; height: 100%; background: #ffff00; box-shadow: 0 0 10px #ffff00; }

        #speedo { position: absolute; bottom: 20px; right: 20px; font-size: 24px; color: #00ffaa; text-align: right; }
        #speedo span { font-size: 12px; display: block; color: #fff; }

        #crosshair { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; transform: translate(-50%, -50%); opacity: 0.1; transition: opacity 0.3s; pointer-events: none; border: 1px solid rgba(0,255,170,0.2); border-radius: 50%; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(0,255,170,0.8); }
        #crosshair::before { top: 29px; left: 0; width: 60px; height: 2px; }
        #crosshair::after { top: 0; left: 29px; width: 2px; height: 60px; }
        
        #radar-container { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 200px; height: 100px; background: radial-gradient(rgba(0, 20, 10, 0.8), transparent); border: 1px solid rgba(0, 255, 170, 0.3); border-radius: 50%; }
        #radar-blip { position: absolute; width: 6px; height: 6px; background: #ff3333; border-radius: 50%; transform: translate(-50%, -50%); top: 50%; left: 50%; }
        
        #start-screen { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        button { background: transparent; border: 2px solid #00ffaa; color: #00ffaa; padding: 15px 40px; font-size: 16px; cursor: pointer; transition: 0.3s; font-family: inherit; }
        #warning-msg { position: absolute; top: 30%; width: 100%; text-align: center; color: red; font-size: 2em; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<div id="start-screen">
    <h1 style="color: #00ffaa;">ORBITAL SINGULARITY</h1>
    <p style="color: #fff; font-size: 12px;">HOLD SPACE: CHARGE SHOT | H: TOGGLE GUI</p>
    <button id="start-btn">INITIALIZE SYSTEM</button>
</div>

<div id="warning-msg">CRITICAL: BOUNDARY BREACHED</div>

<div id="hud">
    <div class="row">
        <div class="hud-text">SCORE: <span id="score-val">0</span></div>
        <div class="hud-text">LEVEL: <span id="weap-lvl">1</span></div>
    </div>
    
    <div id="bars-container">
        <span class="bar-label">CHARGE POWER</span>
        <div class="bar-track"><div id="charge-fill"></div></div>
        <span class="bar-label">TARGET HULL</span>
        <div class="bar-track"><div id="target-health-fill"></div></div>
        <span class="bar-label">SHIP INTEGRITY</span>
        <div class="bar-track"><div id="ship-health-fill"></div></div>
    </div>

    <div id="speedo">0.00<span>VELOCITY Units/s</span></div>
    <div id="radar-container"><div id="radar-blip"></div></div>
</div>

<div id="crosshair"></div>

<script type="importmap">
    { "imports": { 
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "dat.gui": "https://unpkg.com/dat.gui@0.7.9/build/dat.gui.module.js"
    } }
</script>

<script type="module">
    import * as THREE from 'three';
    import * as Tone from 'https://esm.sh/tone';
    import { GUI } from 'dat.gui';

    const CONFIG = {
        thrustPower: 0.04,
        rotationSpeed: 0.04,
        universeRadius: 600,
        sphereDensity: 32,
        sphereColor: '#ff0000',
        sphereOpacity: 0.1,
        weaponLevel: 1,
        guiVisible: true
    };

    let score = 0, isActive = false, isOutside = false;
    let velocity = new THREE.Vector3();
    let shipHealth = 100, targetHealth = 100;
    let chargeLevel = 0, isCharging = false;

    const projectiles = [], powerups = [], keys = {};
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 8000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Audio restoral
    const chargeOsc = new Tone.Oscillator("G2", "sawtooth").toDestination();
    const shotSynth = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.005, decay: 0.2 } }).toDestination();

    function speak(text, type) {
        if (!window.speechSynthesis) return;
        const msg = new SpeechSynthesisUtterance(text);
        if (type === 'robot') { msg.pitch = 1; msg.rate = 1.1; }
        else if (type === 'alien') { msg.pitch = 0.5; msg.rate = 0.8; }
        window.speechSynthesis.speak(msg);
    }

    // Universe Boundary Construction
    let universeEdge;
    function buildBoundary() {
        if(universeEdge) scene.remove(universeEdge);
        const geo = new THREE.SphereGeometry(CONFIG.universeRadius, CONFIG.sphereDensity, CONFIG.sphereDensity);
        const mat = new THREE.MeshBasicMaterial({ 
            color: CONFIG.sphereColor, 
            wireframe: true, 
            side: THREE.BackSide, 
            transparent: true, 
            opacity: CONFIG.sphereOpacity 
        });
        universeEdge = new THREE.Mesh(geo, mat);
        scene.add(universeEdge);
    }

    // dat.GUI Integration
    const gui = new GUI();
    const sphereFolder = gui.addFolder('Boundary Settings');
    sphereFolder.add(CONFIG, 'universeRadius', 300, 2000).onChange(buildBoundary);
    sphereFolder.add(CONFIG, 'sphereDensity', 4, 128).step(1).onChange(buildBoundary);
    sphereFolder.addColor(CONFIG, 'sphereColor').onChange(buildBoundary);
    sphereFolder.add(CONFIG, 'sphereOpacity', 0, 1).onChange(buildBoundary);
    sphereFolder.open();

    // Environment
    for(let i=0; i<3000; i++) {
        const star = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshBasicMaterial({color: 0xffffff}));
        star.position.set((Math.random()-0.5)*4000, (Math.random()-0.5)*4000, (Math.random()-0.5)*4000);
        scene.add(star);
    }

    let target;
    function spawnTarget() {
        if(target) scene.remove(target);
        target = new THREE.Mesh(new THREE.IcosahedronGeometry(15, 0), new THREE.MeshPhongMaterial({ color: 0x00ff00, wireframe: true }));
        const r = CONFIG.universeRadius * 0.8;
        target.position.set((Math.random()-0.5)*r, (Math.random()-0.5)*r, (Math.random()-0.5)*r);
        scene.add(target);
        targetHealth = 100;
        speak("Target localized.", "alien");
    }

    const ship = new THREE.Object3D();
    scene.add(ship);
    scene.add(new THREE.PointLight(0xffffff, 1, 1000));

    window.addEventListener('keydown', e => { 
        keys[e.code] = true; 
        if(e.code === 'KeyH') { CONFIG.guiVisible = !CONFIG.guiVisible; gui.domElement.style.display = CONFIG.guiVisible ? 'block' : 'none'; }
        if(e.code === 'Space') { isCharging = true; chargeOsc.start(); }
    });
    window.addEventListener('keyup', e => { 
        keys[e.code] = false; 
        if(e.code === 'Space') fireShot();
    });

    function fireShot() {
        isCharging = false;
        chargeOsc.stop();
        const power = 1 + (chargeLevel / 20);
        const shotGeo = new THREE.SphereGeometry(0.5 * power, 8, 8);
        const shot = new THREE.Mesh(shotGeo, new THREE.MeshBasicMaterial({ color: chargeLevel > 80 ? 0xff0000 : 0xffff00 }));
        shot.position.copy(ship.position);
        const dir = new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion);
        projectiles.push({ 
            mesh: shot, 
            velocity: dir.multiplyScalar(4), 
            damage: 10 * power * CONFIG.weaponLevel, 
            life: 100 
        });
        scene.add(shot);
        chargeLevel = 0;
        shotSynth.triggerAttackRelease("16n");
    }

    function update() {
        requestAnimationFrame(update);
        if(!isActive) return;

        // Speedometer Calculation
        const speed = velocity.length();
        document.getElementById('speedo').innerHTML = `${speed.toFixed(2)}<span>VELOCITY Units/s</span>`;

        // Charging
        if(isCharging && chargeLevel < 100) {
            chargeLevel += 1.5;
            chargeOsc.frequency.value = 100 + (chargeLevel * 5);
        }
        document.getElementById('charge-fill').style.width = chargeLevel + '%';

        // Flight
        const forward = new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion);
        if(keys['KeyW']) velocity.add(forward.multiplyScalar(CONFIG.thrustPower));
        if(keys['KeyS']) velocity.add(forward.multiplyScalar(-CONFIG.thrustPower));
        if(keys['ArrowLeft']) ship.rotation.y += CONFIG.rotationSpeed;
        if(keys['ArrowRight']) ship.rotation.y -= CONFIG.rotationSpeed;

        ship.position.add(velocity);
        velocity.multiplyScalar(0.98);
        camera.position.copy(ship.position);
        camera.quaternion.copy(ship.quaternion);

        // Boundary Check
        if(ship.position.length() > CONFIG.universeRadius) {
            if(!isOutside) { isOutside = true; speak("Return to system.", "alien"); }
            shipHealth -= 0.2;
            document.getElementById('warning-msg').style.opacity = 1;
        } else {
            isOutside = false;
            document.getElementById('warning-msg').style.opacity = 0;
        }

        // Projectiles
        for(let i=projectiles.length-1; i>=0; i--) {
            const p = projectiles[i]; p.mesh.position.add(p.velocity); p.life--;
            if(target && p.mesh.position.distanceTo(target.position) < 20) {
                targetHealth -= p.damage;
                scene.remove(p.mesh); projectiles.splice(i,1);
                if(targetHealth <= 0) { 
                    score += 500; 
                    if(score % 1500 === 0) { CONFIG.weaponLevel++; speak("Upgraded", "robot"); }
                    spawnTarget(); 
                }
            } else if(p.life <= 0) { scene.remove(p.mesh); projectiles.splice(i,1); }
        }

        // Crosshair Alignment
        if(target) {
            const toTarget = target.position.clone().sub(ship.position).normalize();
            const shipDir = new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion);
            document.getElementById('crosshair').style.opacity = shipDir.dot(toTarget) > 0.98 ? "1" : "0.1";
            
            const localT = target.position.clone().sub(ship.position).applyQuaternion(ship.quaternion.clone().invert());
            document.getElementById('radar-blip').style.transform = `translate(${localT.x*0.1}px, ${-localT.z*0.1}px)`;
        }

        document.getElementById('score-val').innerText = score;
        document.getElementById('weap-lvl').innerText = CONFIG.weaponLevel;
        document.getElementById('target-health-fill').style.width = targetHealth + '%';
        document.getElementById('ship-health-fill').style.width = shipHealth + '%';

        renderer.render(scene, camera);
    }

    document.getElementById('start-btn').addEventListener('click', () => {
        Tone.start();
        document.getElementById('start-screen').style.display = 'none';
        isActive = true;
        buildBoundary();
        spawnTarget();
        speak("New pilot acquired. Ready for launch!", "robot");
        update();
    });
</script>
</body>
</html>

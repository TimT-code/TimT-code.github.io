<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wireframe Boxing: Career Mode</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Arial Black', sans-serif; user-select: none; }
        
        #overlay, #next-match-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            background: rgba(0,0,0,0.95); color: #fff; z-index: 20; 
            text-align: center; 
        }
        
        #next-match-screen { display: none; }

        h1 { color: #ff3333; text-shadow: 0 0 10px #f00; font-size: 40px; margin-bottom: 10px; text-transform: uppercase; font-style: italic; }
        h2 { font-size: 24px; color: #ffcc00; margin-bottom: 20px; }
        p { font-family: monospace; color: #aaa; margin-bottom: 30px; font-size: 14px; max-width: 80%; }
        
        button { 
            padding: 20px 50px; font-size: 24px; font-weight: 900; 
            background: linear-gradient(45deg, #cc0000, #ff0000); 
            color: white; border: 4px solid #fff; border-radius: 0; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        button:active { transform: scale(0.95); }

        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 10; }
        
        .status-bar { position: absolute; top: 20px; width: 40%; height: 30px; background: #222; border: 2px solid #555; transform: skewX(-20deg); }
        #player-hud { left: 20px; }
        #enemy-hud { right: 20px; }
        
        .bar-fill { height: 100%; width: 100%; background: #0f0; transition: width 0.2s; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .name { position: absolute; top: 35px; color: white; font-size: 16px; font-weight: bold; transform: skewX(20deg); text-shadow: 1px 1px 0 #000; }
        #pName { left: 5px; }
        #eName { right: 5px; text-align: right; }

        #level-indicator { position: absolute; top: 10px; width: 100%; text-align: center; color: #fc0; font-size: 20px; text-shadow: 0 2px 4px #000; }

        #log { position: absolute; bottom: 15%; width: 100%; text-align: center; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        
        .hit-text { color: #ff0; animation: pop 0.2s; }
        .damage-text { color: #f00; animation: shake 0.2s; }
        
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.5); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(-5px, 0); } 75% { transform: translate(5px, 0); } 100% { transform: translate(0,0); } }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.26/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
</head>
<body>

<div id="overlay">
    <h1>Iron Gloves</h1>
    <h2>Career Mode</h2>
    <p>Enable Sound. Tilt to Aim/Block. Punch fast.<br>Enemies adapt to your style.</p>
    <button id="startBtn">Enter Ring</button>
</div>

<div id="next-match-screen">
    <h1 style="color:#0f0">VICTORY</h1>
    <h2 id="next-opponent-name">Next: The Crusher</h2>
    <p>Opponent Stats Increased.<br>AI Learning Active.</p>
    <button id="nextBtn">FIGHT NEXT</button>
</div>

<div id="hud">
    <div id="level-indicator">FIGHT 1</div>
    <div id="player-hud" class="status-bar"><div id="pBar" class="bar-fill"></div><div id="pName" class="name">YOU</div></div>
    <div id="enemy-hud" class="status-bar"><div id="eBar" class="bar-fill"></div><div id="eName" class="name">ROOKIE RAY</div></div>
    <div id="log"></div>
</div>

<script>
    // --- GAME CONFIGURATION ---
    const CFG = {
        baseDmg: 5,
        accelThresh: 12,
        moveThresh: 3,
        cameraSway: 0.5
    };

    const STATE = {
        level: 1,
        playerHP: 100,
        enemyHP: 100,
        isFighting: false,
        isKnockedDown: false,
        jabCount: 0,
        hookCount: 0,
        uppercutCount: 0,
        lastPunchTime: 0,
        canRecover: true
    };

    const NAMES = ["Glass Joe", "Iron Mike", "Viper", "The Wall", "Ivan Drago", "Shadow", "Titan", "The End"];

    // --- THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.02);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Dynamic Camera Group (for simulating head bob/body movement)
    const cameraRig = new THREE.Group();
    cameraRig.add(camera);
    scene.add(cameraRig);
    camera.position.set(0, 1.7, 0);
    cameraRig.position.z = 2; // Start distance

    // --- ARENA ---
    // Spotlights
    const spot1 = new THREE.SpotLight(0xffffff, 1.5);
    spot1.position.set(5, 12, 5);
    spot1.castShadow = true;
    spot1.penumbra = 0.5;
    scene.add(spot1);
    
    const spot2 = new THREE.SpotLight(0xffffff, 0.8);
    spot2.position.set(-5, 12, -5);
    scene.add(spot2);

    // Ring Ropes & Mat
    const ringGroup = new THREE.Group();
    const matGeo = new THREE.PlaneGeometry(14, 14);
    const matMat = new THREE.MeshPhongMaterial({ color: 0x222222, specular: 0x111111 });
    const mat = new THREE.Mesh(matGeo, matMat);
    mat.rotation.x = -Math.PI/2;
    ringGroup.add(mat);

    const ropeMat = new THREE.MeshBasicMaterial({ color: 0xd00000 });
    for(let i=0; i<4; i++) {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.5), new THREE.MeshStandardMaterial({color:0x555}));
        post.position.set((i%2?6:-6), 1.25, (i<2?6:-6));
        ringGroup.add(post);
    }
    // Ropes
    for(let h of [1, 2, 3]) {
        const r1 = new THREE.Mesh(new THREE.BoxGeometry(12, 0.04, 0.04), ropeMat); r1.position.set(0, h*0.4+0.5, -6);
        const r2 = new THREE.Mesh(new THREE.BoxGeometry(12, 0.04, 0.04), ropeMat); r2.position.set(0, h*0.4+0.5, 6);
        const r3 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 12), ropeMat); r3.position.set(-6, h*0.4+0.5, 0);
        const r4 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 12), ropeMat); r4.position.set(6, h*0.4+0.5, 0);
        ringGroup.add(r1, r2, r3, r4);
    }
    scene.add(ringGroup);

    // --- CROWD GENERATION (FACES) ---
    function createCrowdTexture() {
        const cvs = document.createElement('canvas');
        cvs.width = 64; cvs.height = 64;
        const ctx = cvs.getContext('2d');
        ctx.fillStyle = '#444';
        ctx.beginPath(); ctx.arc(32,32,30,0,Math.PI*2); ctx.fill(); // Head
        ctx.fillStyle = '#111';
        ctx.fillRect(20, 25, 6, 6); ctx.fillRect(38, 25, 6, 6); // Eyes
        ctx.beginPath(); ctx.arc(32, 45, 10, 0, Math.PI, false); ctx.stroke(); // Smile
        const tex = new THREE.CanvasTexture(cvs);
        return tex;
    }

    const crowdGeo = new THREE.BufferGeometry();
    const cPos = [];
    for(let i=0; i<800; i++) {
        let r = 8 + Math.random() * 10;
        let theta = Math.random() * Math.PI * 2;
        cPos.push(Math.cos(theta)*r, 1 + Math.random()*4, Math.sin(theta)*r);
    }
    crowdGeo.setAttribute('position', new THREE.Float32BufferAttribute(cPos, 3));
    const crowdMat = new THREE.PointsMaterial({ 
        size: 0.8, map: createCrowdTexture(), transparent: true, opacity: 0.7 
    });
    const crowd = new THREE.Points(crowdGeo, crowdMat);
    scene.add(crowd);

    // --- HUMANOID RIGGING SYSTEM ---
    
    // Helper to create body parts
    function createLimb(w, h, d, color, x, y, z, parent) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const mat = new THREE.MeshPhongMaterial({ color: color, wireframe: true, transparent: true, opacity: 0.6 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        if(parent) parent.add(mesh);
        return mesh;
    }

    // Build Opponent
    const enemyRoot = new THREE.Group();
    enemyRoot.position.set(0, 0, -2);
    scene.add(enemyRoot);

    const eTorso = createLimb(0.5, 0.7, 0.3, 0xff0000, 0, 1.1, 0, enemyRoot); // Chest
    const eHips = createLimb(0.45, 0.4, 0.3, 0xaa0000, 0, -0.6, 0, eTorso); // Abs
    const eHead = createLimb(0.3, 0.35, 0.3, 0xffcccc, 0, 0.6, 0, eTorso); // Head

    // Enemy Arms (Complex Joints)
    const eShoulderL = new THREE.Group(); eShoulderL.position.set(-0.4, 0.3, 0); eTorso.add(eShoulderL);
    const eArmUpperL = createLimb(0.2, 0.5, 0.2, 0xff0000, 0, -0.25, 0, eShoulderL);
    const eElbowL = new THREE.Group(); eElbowL.position.set(0, -0.25, 0); eArmUpperL.add(eElbowL);
    const eForearmL = createLimb(0.18, 0.5, 0.18, 0xff0000, 0, -0.25, 0, eElbowL);
    const eGloveL = createLimb(0.25, 0.25, 0.25, 0xffffff, 0, -0.3, 0, eForearmL); // Glove

    const eShoulderR = new THREE.Group(); eShoulderR.position.set(0.4, 0.3, 0); eTorso.add(eShoulderR);
    const eArmUpperR = createLimb(0.2, 0.5, 0.2, 0xff0000, 0, -0.25, 0, eShoulderR);
    const eElbowR = new THREE.Group(); eElbowR.position.set(0, -0.25, 0); eArmUpperR.add(eElbowR);
    const eForearmR = createLimb(0.18, 0.5, 0.18, 0xff0000, 0, -0.25, 0, eElbowR);
    const eGloveR = createLimb(0.25, 0.25, 0.25, 0xffffff, 0, -0.3, 0, eForearmR);

    // Initial Guard Pose
    eShoulderL.rotation.z = 0.5; eShoulderL.rotation.x = 0.5; eElbowL.rotation.x = -2;
    eShoulderR.rotation.z = -0.5; eShoulderR.rotation.x = 0.5; eElbowR.rotation.x = -2;

    // --- PLAYER BODY (First Person Visibility) ---
    // Attached to cameraRig so it moves with view, but slightly offset
    const playerBodyGroup = new THREE.Group();
    playerBodyGroup.position.set(0, -0.5, 0.2); // Just below/behind camera
    cameraRig.add(playerBodyGroup);

    const pTorso = createLimb(0.6, 0.8, 0.4, 0x00ff00, 0, -0.5, 0, playerBodyGroup);
    // Player Gloves (Interactive)
    const pGloveL = createLimb(0.2, 0.2, 0.3, 0x00ff00, -0.4, -0.2, -0.8, camera);
    const pGloveR = createLimb(0.2, 0.2, 0.3, 0x00ff00, 0.4, -0.2, -0.8, camera);

    // --- AUDIO SYSTEM (Eye of the Tiger Style) ---
    let musicPart;
    async function initAudio() {
        await Tone.start();
        Tone.Destination.volume.value = -8;

        // Lead Synth (Brass/Saw)
        const lead = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sawtooth" },
            envelope: { attack: 0.02, decay: 0.1, sustain: 0.3, release: 0.1 }
        }).toDestination();
        lead.volume.value = -2;

        // Bass/Kick
        const kick = new Tone.MembraneSynth().toDestination();
        const bass = new Tone.MonoSynth({ oscillator: {type:"square"}, envelope:{attack:0.01, decay:0.2, sustain:0} }).toDestination();
        
        // "Eye of the Tiger" Rhythmic Pattern (Simplified approximation)
        // C - C Bb C - C Bb C - C Bb G
        const riffNotes = [
            { time: "0:0:0", note: "C3", dur: "4n" }, // Bum
            
            { time: "0:0:3", note: "C3", dur: "8n" }, // Bum
            { time: "0:1:0", note: "Bb2", dur: "8n" }, // Bum
            { time: "0:1:1", note: "C3", dur: "4n" }, // Bum
            
            { time: "0:2:0", note: "C3", dur: "8n" }, // Bum
            { time: "0:2:1", note: "Bb2", dur: "8n" }, // Bum
            { time: "0:2:2", note: "C3", dur: "4n" }, // Bum

            { time: "0:3:1", note: "C3", dur: "8n" }, // Bum
            { time: "0:3:2", note: "Bb2", dur: "8n" }, // Bum
            { time: "0:3:3", note: "G2", dur: "4n" }, // Buuum
        ];

        musicPart = new Tone.Part((time, val) => {
            lead.triggerAttackRelease(val.note, val.dur, time);
            // Rhythm backing
            if(Math.random() > 0.3) kick.triggerAttackRelease("C1", "8n", time);
            bass.triggerAttackRelease("C2", "16n", time);
        }, riffNotes).start(0);
        
        musicPart.loop = true;
        musicPart.loopEnd = "2m"; // 2 measures loop
        Tone.Transport.bpm.value = 109; // Original Tempo
    }

    function sfx(type) {
        if (type === 'hit') {
            const synth = new Tone.MetalSynth({ harmonicity:12, resonance:800, modulationIndex:20, envelope:{decay:0.1} }).toDestination();
            synth.triggerAttackRelease(80, "16n");
            navigator.vibrate(50);
        } else if (type === 'miss') {
            const noise = new Tone.NoiseSynth({ envelope: {attack:0.01, decay:0.1} }).toDestination();
            noise.triggerAttackRelease("32n");
        } else if (type === 'heavy') {
            const mem = new Tone.MembraneSynth().toDestination();
            mem.triggerAttackRelease("C1", "8n");
            navigator.vibrate([40, 50, 40]);
        }
    }

    // --- GAME LOGIC ---

    let gyro = { beta: 90, gamma: 0 }; // Default upright
    let punchReady = true;

    function handleMotion(e) {
        if(!STATE.isFighting) return;
        
        // Rotation for aiming/blocking
        if(e.rotationRate) {
            // Integrate rotation rate for smoother response than absolute orientation
            // Simplified here using orientation event below for absolute aim
        }
        
        // Acceleration for punches
        const a = e.acceleration;
        if(!a) return;
        
        const force = Math.sqrt(a.x**2 + a.y**2 + a.z**2);

        // Movement Logic (Accelerometer Drift)
        // Constrain side-to-side (X) to be tighter
        if (Math.abs(a.x) > CFG.moveThresh) {
            cameraRig.position.x -= a.x * 0.02;
            cameraRig.position.x = Math.max(-1.5, Math.min(1.5, cameraRig.position.x));
        }

        // Forward/Back (Lean)
        // Show player body when leaning forward (Z accel or tilt)
        if (a.z < -2) cameraRig.position.z -= 0.1; 
        if (a.z > 2) cameraRig.position.z += 0.1;
        cameraRig.position.z = Math.max(1.0, Math.min(3.0, cameraRig.position.z));

        // Punch Detection
        if (force > CFG.accelThresh && punchReady) {
            punchReady = false;
            setTimeout(() => punchReady = true, 300); // Debounce
            processPlayerPunch(a, force);
        }
    }

    window.addEventListener('deviceorientation', (e) => {
        gyro.beta = e.beta;
        gyro.gamma = e.gamma;
    });

    function processPlayerPunch(accel, force) {
        if(STATE.playerHP <= 0) return;

        // Classify Punch
        let type = 'jab';
        if (accel.z > 8) type = 'uppercut'; // Vertical impulse
        else if (Math.abs(accel.x) > 8) type = 'hook'; // Horizontal impulse
        else type = 'cross'; // Forward strong

        // Track stats for AI
        if(type==='jab') STATE.jabCount++;
        if(type==='hook') STATE.hookCount++;

        // Aiming
        let target = (gyro.beta < 50) ? 'body' : 'head';

        // Animation
        const glove = (accel.x < 0) ? pGloveL : pGloveR;
        
        // Distinct Animations
        if(type === 'uppercut') {
             gsap.to(glove.position, { y: 0.5, z: -2, duration: 0.15, yoyo: true, repeat: 1 });
        } else if (type === 'hook') {
             gsap.to(glove.position, { x: (accel.x<0?-1:1), z: -2, duration: 0.15, yoyo: true, repeat: 1 });
        } else {
             gsap.to(glove.position, { z: -3, y: (target==='head'?0.2:-0.3), duration: 0.1, yoyo: true, repeat: 1 });
        }

        // Hit Check
        setTimeout(() => checkHit(type, target, force), 100);
    }

    function checkHit(type, target, force) {
        // AI Learning Defense
        // As level increases, chance to block increases
        // If player spams Jab, AI blocks Jab more
        let blockChance = 0.2 + (STATE.level * 0.05);
        if (type === 'jab' && STATE.jabCount > STATE.hookCount + 5) blockChance += 0.3;
        
        // AI Reaction
        if (Math.random() < blockChance) {
            // Blocked
            sfx('miss');
            log("BLOCKED", '#aaa');
            enemyBlockAnim();
        } else {
            // Hit
            sfx('hit');
            let damage = CFG.baseDmg + (force/5);
            STATE.enemyHP -= damage;
            updateHP();
            
            log(type.toUpperCase() + " HIT!", '#ff0');
            enemyReactAnim(target, type);

            if(STATE.enemyHP <= 0) doWin();
        }
    }

    // --- ENEMY ANIMATIONS ---
    
    function enemyBlockAnim() {
        // Raise arms together
        gsap.to([eShoulderL.rotation, eShoulderR.rotation], { z: 0, duration: 0.1, yoyo: true, repeat: 1 });
        gsap.to([eElbowL.position, eElbowR.position], { y: 0, duration: 0.1, yoyo: true, repeat: 1 });
    }

    function enemyReactAnim(target, type) {
        // Wince/Knockback
        const bodyPart = (target==='head') ? eHead : eTorso;
        bodyPart.material.color.setHex(0xffffff);
        setTimeout(()=> bodyPart.material.color.setHex(0xff0000), 100);

        // Physics shake
        let xForce = (Math.random()-0.5);
        if(type === 'hook') xForce = 1.0; 
        
        gsap.to(enemyRoot.position, { z: -2.5, x: xForce, duration: 0.1, yoyo: true, repeat: 1 });
        gsap.to(enemyRoot.rotation, { x: -0.2, duration: 0.2, yoyo: true, repeat: 1 });
    }

    function enemyAttack() {
        if(!STATE.isFighting || STATE.enemyHP <= 0 || STATE.isKnockedDown) return;

        // Choose arm
        const isLeft = Math.random() > 0.5;
        const shoulder = isLeft ? eShoulderL : eShoulderR;
        const elbow = isLeft ? eElbowL : eElbowR;
        const glove = isLeft ? eGloveL : eGloveR;

        // Aim: Randomized slightly but accurate
        const aimError = Math.max(0, 0.5 - (STATE.level * 0.05)); 
        const targetX = cameraRig.position.x + (Math.random() - 0.5) * aimError;
        
        // Animate Punch toward camera
        // Using rotation to swing arm
        const rotDir = isLeft ? -1 : 1;
        
        // Windup
        gsap.to(shoulder.rotation, { y: rotDir * 0.5, duration: 0.2, onComplete: () => {
            // Strike
            sfx('miss'); // Swoosh
            gsap.to(shoulder.rotation, { x: -0.5, y: -rotDir*0.2, duration: 0.1, onComplete: () => {
                // Check Player Block (Tilt Back)
                const playerBlocking = (gyro.beta < 20); 
                
                if (playerBlocking) {
                    sfx('hit'); // Dull hit on guard
                    log("YOU BLOCKED", "#0f0");
                    STATE.playerHP -= 1;
                } else {
                    sfx('heavy');
                    log("OUCH!", "#f00");
                    cameraRig.position.x += (Math.random()-0.5); // Screen shake
                    STATE.playerHP -= (5 + STATE.level);
                    document.body.style.backgroundColor = '#300';
                    setTimeout(() => document.body.style.backgroundColor = '#050505', 100);
                }
                updateHP();
                if(STATE.playerHP <= 0) doKnockdown();

                // Reset Arm
                gsap.to(shoulder.rotation, { x: 0.5, y: 0, duration: 0.3 });
            }});
        }});
    }

    // --- GAME LOOPS ---

    function doKnockdown() {
        STATE.isKnockedDown = true;
        Tone.Transport.pause();
        document.getElementById('log').innerText = "KNOCKDOWN! SHAKE TO RISE!";
        
        // Camera falls
        gsap.to(cameraRig.rotation, { z: 0.5, x: -1, duration: 0.5 });
        gsap.to(cameraRig.position, { y: 0.5, duration: 0.5 });

        let count = 10;
        const interval = setInterval(() => {
            if(!STATE.isKnockedDown) { clearInterval(interval); return; }
            log(count + "...", "red");
            count--;
            if(count < 0) {
                clearInterval(interval);
                STATE.isFighting = false;
                log("GAME OVER", "red");
                setTimeout(() => location.reload(), 3000);
            }
        }, 1000);

        // Shake detection logic
        window.addEventListener('devicemotion', checkRecoveryShake);
    }

    function checkRecoveryShake(e) {
        if(!STATE.isKnockedDown) return;
        if(Math.abs(e.acceleration.x) > 20) {
            STATE.playerHP += 5;
            updateHP();
            if(STATE.playerHP > 30) {
                STATE.isKnockedDown = false;
                window.removeEventListener('devicemotion', checkRecoveryShake);
                Tone.Transport.start();
                
                // Camera Gets up
                gsap.to(cameraRig.rotation, { z: 0, x: 0, duration: 1 });
                gsap.to(cameraRig.position, { y: 2, duration: 1 });
                log("RISE!!", "#0f0");
            }
        }
    }

    function doWin() {
        STATE.isFighting = false;
        Tone.Transport.stop();
        
        // Ragdoll Enemy
        gsap.to(enemyRoot.rotation, { x: -1.5, z: (Math.random()-0.5), duration: 1, ease: "bounce.out" });
        gsap.to(enemyRoot.position, { y: -1, duration: 0.5 });

        setTimeout(() => {
            document.getElementById('next-opponent-name').innerText = "NEXT: " + NAMES[STATE.level % NAMES.length];
            document.getElementById('next-match-screen').style.display = 'flex';
        }, 2000);
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
        STATE.level++;
        STATE.playerHP = 100;
        STATE.enemyHP = 100 + (STATE.level * 20); // Harder
        STATE.isFighting = true;
        
        // Reset Enemy Mesh
        enemyRoot.rotation.set(0,0,0);
        enemyRoot.position.set(0, 0, -2);
        
        // Randomize Enemy Color for variety
        const randomColor = Math.random() * 0xffffff;
        eTorso.material.color.setHex(randomColor);

        document.getElementById('eName').innerText = NAMES[(STATE.level-1) % NAMES.length];
        document.getElementById('level-indicator').innerText = "FIGHT " + STATE.level;
        document.getElementById('next-match-screen').style.display = 'none';
        
        updateHP();
        Tone.Transport.start();
        log("FIGHT!", "#fff");
    });

    function updateHP() {
        document.getElementById('pBar').style.width = Math.max(0, STATE.playerHP) + '%';
        document.getElementById('eBar').style.width = Math.max(0, (STATE.enemyHP/(100 + (STATE.level-1)*20))*100) + '%';
    }

    function log(msg, color) {
        const el = document.getElementById('log');
        el.innerText = msg;
        el.style.color = color || '#fff';
        el.className = 'hit-text';
        setTimeout(() => el.className = '', 200);
        setTimeout(() => el.innerText = '', 1500);
    }

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // Breath/Idle Animation
        if(STATE.enemyHP > 0) {
            enemyRoot.position.y = Math.sin(t * 3) * 0.05; // Bob
            // Keep guard up
            if(!gsap.isTweening(eShoulderL.rotation)) {
                eShoulderL.rotation.z = 0.5 + Math.sin(t*2)*0.1;
                eShoulderR.rotation.z = -0.5 - Math.sin(t*2)*0.1;
            }
        }

        // Crowd Sway
        const pos = crowd.geometry.attributes.position.array;
        for(let i=0; i<pos.length; i+=3) {
            pos[i+1] += Math.sin(t * 2 + pos[i]) * 0.01;
        }
        crowd.geometry.attributes.position.needsUpdate = true;

        // Camera Smooth Pan (Cinematic feel)
        // Zoom in slightly if close to knocking out enemy
        if (STATE.enemyHP < 30) {
            camera.fov = THREE.MathUtils.lerp(camera.fov, 60, 0.05);
        } else {
            camera.fov = THREE.MathUtils.lerp(camera.fov, 65, 0.05);
        }
        camera.updateProjectionMatrix();

        renderer.render(scene, camera);
    }

    // --- INITIALIZATION ---
    document.getElementById('startBtn').addEventListener('click', async () => {
        // Permissions
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            try { await DeviceMotionEvent.requestPermission(); } catch(e){}
        }
        window.addEventListener('devicemotion', handleMotion);

        await initAudio();
        Tone.Transport.start();

        document.getElementById('overlay').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        
        STATE.isFighting = true;
        animate();

        // Start AI Loop
        setInterval(() => {
            // Speed increases with level
            const attackSpeed = Math.max(800, 2500 - (STATE.level * 200));
            if(Math.random() > 0.3) enemyAttack();
        }, 1500); // Base tick, randomized inside
    });

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Singularity</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffaa; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; border: 1px solid rgba(0,255,170,0.5); transform: translate(-50%, -50%); border-radius: 50%; }
        #power-bar { position: absolute; bottom: 50px; left: 50%; width: 300px; height: 8px; border: 1px solid #00ffaa; transform: translateX(-50%); }
        #power-fill { width: 0%; height: 100%; background: #00ffaa; box-shadow: 0 0 15px #00ffaa; }
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 100; color: #00ffaa; text-align: center; }
        #menu-content { padding: 40px; border: 1px solid #00ffaa; background: rgba(0, 20, 15, 0.9); backdrop-filter: blur(10px); }
        button { background: transparent; border: 2px solid #00ffaa; color: #00ffaa; padding: 15px 30px; font-size: 1.2em; cursor: pointer; transition: 0.3s; margin-top: 20px; font-family: inherit; }
        button:hover { background: #00ffaa; color: #000; box-shadow: 0 0 20px #00ffaa; }
        #hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0px solid transparent; pointer-events: none; box-sizing: border-box; transition: border 0.2s; z-index: 5; }
        .warning { animation: flash-red 0.5s infinite alternate; border-width: 20px !important; }
        @keyframes flash-red { from { border-color: rgba(255,0,0,0.5); } to { border-color: transparent; } }
        #cockpit-glass { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; background-size: cover; z-index: 6; }
    </style>
</head>
<body>

<div id="start-screen">
    <div id="menu-content">
        <h1>ORBITAL SINGULARITY</h1>
        <p>SYSTEM STATUS: <span style="color:#fff">IDLE</span></p>
        <button id="start-btn">INITIALIZE NEURAL LINK</button>
        <p style="font-size: 0.8em; margin-top: 20px;">WASD: THRUST | ARROWS: STEER | CLICK: FIRE | GAMEPAD SUPPORTED</p>
    </div>
</div>

<div id="ui">
    <div>SECTOR SCORE: <span id="score">0</span></div>
    <div>ALTITUDE: <span id="dist">0</span>u</div>
</div>
<div id="crosshair"></div>
<div id="hud-overlay"></div>
<div id="cockpit-glass"></div>
<div id="power-bar"><div id="power-fill"></div></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import * as Tone from 'https://esm.sh/tone';

    // --- CONFIG & STATE ---
    let gameState = 'PREFLIGHT';
    let score = 0;
    let powerLevel = 0;
    let isCharging = false;
    let velocity = new THREE.Vector3();
    const GRAVITY_BASE = 0.08;
    const SHIP_ACCEL = 0.008;
    const EXPLOSIONS = [];
    const POWERUPS = [];

    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- SHADERS (The Blob Ship) ---
    const vShader = `
        varying vec3 vNormal;
        varying vec3 vPosition;
        uniform float uTime;
        void main() {
            vNormal = normal;
            vPosition = position;
            float pulse = sin(uTime * 2.0 + position.y * 5.0) * 0.1;
            vec3 newPos = position + normal * pulse;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
        }
    `;
    const fShader = `
        varying vec3 vNormal;
        varying vec3 vPosition;
        uniform vec3 uColor;
        void main() {
            vec3 viewDir = normalize(cameraPosition - vPosition);
            float fresnel = pow(1.0 - dot(viewDir, vNormal), 3.0);
            gl_FragColor = vec4(mix(uColor * 0.2, uColor, fresnel), 0.5 + fresnel);
        }
    `;

    // --- OBJECTS ---
    // Outer Sphere
    const sky = new THREE.Mesh(
        new THREE.SphereGeometry(800, 32, 32),
        new THREE.MeshBasicMaterial({ color: 0x002211, wireframe: true, side: THREE.BackSide, transparent: true, opacity: 0.1 })
    );
    scene.add(sky);

    // Starfield
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(3000 * 3);
    for(let i=0; i<9000; i++) starPos[i] = (Math.random()-0.5) * 1500;
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.5})));

    // Central Target
    let target;
    function createTarget() {
        if(target) scene.remove(target);
        const geo = new THREE.DodecahedronGeometry(12, 0);
        const mat = new THREE.MeshPhongMaterial({ color: 0x00ffaa, wireframe: true, transparent: true, opacity: 0.8 });
        target = new THREE.Mesh(geo, mat);
        target.userData = { 
            health: new Array(12).fill(5), 
            rotV: new THREE.Vector2(0.005, 0.005),
            growth: 1.0 
        };
        scene.add(target);
    }
    createTarget();

    // Ship (The Blob)
    const shipMat = new THREE.ShaderMaterial({
        uniforms: { uTime: {value: 0}, uColor: {value: new THREE.Color(0x00ffaa)} },
        vertexShader: vShader, fragmentShader: fShader, transparent: true
    });
    const ship = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), shipMat);
    ship.position.set(0, 0, 60);
    scene.add(ship);

    // Light
    const spot = new THREE.SpotLight(0xffffff, 500, 200, 0.5);
    ship.add(spot);
    ship.add(spot.target);
    spot.target.position.set(0,0,-10);
    scene.add(new THREE.AmbientLight(0x112233));

    // --- AUDIO ---
    const drone = new Tone.Oscillator(55, "sawtooth").toDestination();
    drone.volume.value = -30;
    const synth = new Tone.PolySynth(Tone.Synth).toDestination();

    // --- INPUTS ---
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // --- GAMEPLAY FUNCTIONS ---
    function handleGamepad() {
        const gp = navigator.getGamepads()[0];
        if(!gp) return;
        
        // Rotation (Right Stick)
        if(Math.abs(gp.axes[2]) > 0.1) ship.rotation.y -= gp.axes[2] * 0.04;
        if(Math.abs(gp.axes[3]) > 0.1) ship.rotation.x -= gp.axes[3] * 0.04;

        // Thrust (Triggers & Left Stick)
        const forward = new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion);
        const right = new THREE.Vector3(1,0,0).applyQuaternion(ship.quaternion);
        
        if(gp.buttons[7].value > 0.1) velocity.add(forward.multiplyScalar(gp.buttons[7].value * SHIP_ACCEL));
        if(gp.buttons[6].value > 0.1) velocity.add(forward.multiplyScalar(-gp.buttons[6].value * SHIP_ACCEL));
        if(Math.abs(gp.axes[0]) > 0.1) velocity.add(right.multiplyScalar(gp.axes[0] * SHIP_ACCEL));

        // Fire (A Button)
        if(gp.buttons[0].pressed) {
            isCharging = true;
            powerLevel = Math.min(powerLevel + 0.02, 1);
        } else if(isCharging) {
            fireLaser();
            isCharging = false;
            powerLevel = 0;
        }
    }

    function fireLaser() {
        const ray = new THREE.Raycaster();
        ray.set(ship.position, new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion));
        const hits = ray.intersectObject(target);
        
        if(hits.length > 0) {
            const hit = hits[0];
            const fIdx = Math.floor(hit.faceIndex / 3);
            target.userData.health[fIdx]--;
            score += 10;
            
            // Torque / Billiard Effect
            target.userData.rotV.x += (Math.random()-0.5) * 0.02 * powerLevel;
            target.userData.rotV.y += (Math.random()-0.5) * 0.02 * powerLevel;

            // Sound
            synth.triggerAttackRelease("C3", "16n", undefined, 0.5 + powerLevel);
        }
    }

    // --- MAIN LOOP ---
    function update() {
        requestAnimationFrame(update);
        const time = performance.now();
        shipMat.uniforms.uTime.value = time / 1000;

        if (gameState === 'PREFLIGHT') {
            ship.position.x = Math.sin(time * 0.0005) * 70;
            ship.position.z = Math.cos(time * 0.0005) * 70;
            ship.lookAt(0,0,0);
        } else {
            // Flight Physics
            const forward = new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion);
            const right = new THREE.Vector3(1,0,0).applyQuaternion(ship.quaternion);
            
            if(keys['KeyW']) velocity.add(forward.multiplyScalar(SHIP_ACCEL));
            if(keys['KeyS']) velocity.add(forward.multiplyScalar(-SHIP_ACCEL));
            if(keys['KeyA']) velocity.add(right.multiplyScalar(-SHIP_ACCEL));
            if(keys['KeyD']) velocity.add(right.multiplyScalar(SHIP_ACCEL));

            // Rotation
            if(keys['ArrowLeft']) ship.rotation.y += 0.04;
            if(keys['ArrowRight']) ship.rotation.y -= 0.04;
            if(keys['ArrowUp']) ship.rotation.x += 0.04;
            if(keys['ArrowDown']) ship.rotation.x -= 0.04;

            // Gravity
            const dist = ship.position.distanceTo(target.position);
            const dir = new THREE.Vector3().subVectors(target.position, ship.position).normalize();
            velocity.add(dir.multiplyScalar(GRAVITY_BASE / dist));
            
            ship.position.add(velocity);
            velocity.multiplyScalar(0.98); // Dampening

            // Target Updates
            target.rotation.x += target.userData.rotV.x;
            target.rotation.y += target.userData.rotV.y;
            target.scale.multiplyScalar(1.0001); // Growth

            // HUD
            document.getElementById('score').innerText = score;
            document.getElementById('dist').innerText = Math.floor(dist);
            document.getElementById('power-fill').style.width = (powerLevel * 100) + '%';
            
            const hud = document.getElementById('hud-overlay');
            if(dist < 35) {
                hud.classList.add('warning');
                if(dist < 15) { alert("SINGULARITY COLLISION. MISSION FAILED."); location.reload(); }
            } else {
                hud.classList.remove('warning');
            }

            handleGamepad();
        }

        camera.position.copy(ship.position);
        camera.quaternion.copy(ship.quaternion);
        renderer.render(scene, camera);
    }

    // --- START EVENT ---
    document.getElementById('start-btn').addEventListener('click', async () => {
        await Tone.start();
        drone.start();
        gameState = 'ACTIVE';
        document.getElementById('start-screen').style.display = 'none';
    });

    // Handle Shooting via mouse
    window.addEventListener('mousedown', () => { if(gameState==='ACTIVE') isCharging = true; });
    window.addEventListener('mouseup', () => { if(isCharging){ fireLaser(); isCharging=false; powerLevel=0; } });

    update();
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
